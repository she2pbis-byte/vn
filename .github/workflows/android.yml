name: Build Android APK (Ultra Search Icon)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Capacitor Sync
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Force Overwrite Icons
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          
          # Находим путь к иконке, игнорируя регистр (icon.png, ICON.PNG, icon.Png)
          # Ищем во всем репозитории, исключая папку android и node_modules
          SOURCE_ICON=$(find . -maxdepth 3 -not -path "*/.*" -not -path "./android/*" -not -path "./node_modules/*" -iname "icon.png" | head -n 1)
          
          if [ -z "$SOURCE_ICON" ]; then
            echo "КРИТИЧЕСКАЯ ОШИБКА: Файл icon.png не найден ни в одной папке проекта!"
            ls -R # Выводим список всех файлов для отладки, если не нашли
            exit 1
          fi
          
          echo "Иконка найдена по адресу: $SOURCE_ICON"
          RES_PATH="android/app/src/main/res"
          
          # Массив размеров и папок
          declare -A SIZES=( ["48x48"]="mdpi" ["72x72"]="hdpi" ["96x96"]="xhdpi" ["144x144"]="xxhdpi" ["192x192"]="xxxhdpi" )
          
          for size in "${!SIZES[@]}"; do
            folder=${SIZES[$size]}
            # Создаем папку если её нет
            mkdir -p "$RES_PATH/mipmap-$folder"
            # Генерируем обычную и круглую иконки
            convert "$SOURCE_ICON" -resize "$size" "$RES_PATH/mipmap-$folder/ic_launcher.png"
            convert "$SOURCE_ICON" -resize "$size" "$RES_PATH/mipmap-$folder/ic_launcher_round.png"
          done
          
          echo "Иконки успешно обновлены во всех папках Android!"

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: staffcloud-fixed-icon
          path: android/app/build/outputs/apk/debug/app-debug.apk
