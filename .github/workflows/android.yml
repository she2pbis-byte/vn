name: Build Android APK (Force Icon)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Capacitor Sync
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Force Overwrite Icons
        # Устанавливаем ImageMagick для изменения размера и копируем иконку во все папки Android
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          SOURCE_ICON="dist/icon.png"
          RES_PATH="android/app/src/main/res"
          
          # Проверяем, есть ли файл в папке dist (куда он попал после билда)
          if [ -f "$SOURCE_ICON" ]; then
            convert "$SOURCE_ICON" -resize 48x48 "$RES_PATH/mipmap-mdpi/ic_launcher.png"
            convert "$SOURCE_ICON" -resize 72x72 "$RES_PATH/mipmap-hdpi/ic_launcher.png"
            convert "$SOURCE_ICON" -resize 96x96 "$RES_PATH/mipmap-xhdpi/ic_launcher.png"
            convert "$SOURCE_ICON" -resize 144x144 "$RES_PATH/mipmap-xxhdpi/ic_launcher.png"
            convert "$SOURCE_ICON" -resize 192x192 "$RES_PATH/mipmap-xxxhdpi/ic_launcher.png"
            # Также обновляем круглые иконки
            convert "$SOURCE_ICON" -resize 48x48 "$RES_PATH/mipmap-mdpi/ic_launcher_round.png"
            convert "$SOURCE_ICON" -resize 72x72 "$RES_PATH/mipmap-hdpi/ic_launcher_round.png"
            convert "$SOURCE_ICON" -resize 96x96 "$RES_PATH/mipmap-xhdpi/ic_launcher_round.png"
            convert "$SOURCE_ICON" -resize 144x144 "$RES_PATH/mipmap-xxhdpi/ic_launcher_round.png"
            convert "$SOURCE_ICON" -resize 192x192 "$RES_PATH/mipmap-xxxhdpi/ic_launcher_round.png"
            echo "Иконки успешно перезаписаны!"
          else
            echo "Файл icon.png не найден в dist!"
            exit 1
          fi

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: staffcloud-fixed-icon
          path: android/app/build/outputs/apk/debug/app-debug.apk
