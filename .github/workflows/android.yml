name: Build Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Рекомендуемая версия для текущих проектов

      - name: Install dependencies
        run: npm install

      - name: Build Web App
        # ЭТО САМЫЙ ВАЖНЫЙ ШАГ. Он создает папку dist.
        run: npm run build

      - name: Capacitor Sync
        run: |
          npx cap add android || true
          npx cap sync android
