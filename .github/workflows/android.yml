name: Build Android App

on:
  push:
    branches:
      - main  # Запускать при каждом пуше в ветку main
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой в интерфейсе GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build Web Project
        run: npm run build # Создаем ту самую папку dist

      - name: Capacitor Sync
        run: |
          npx cap add android || true
          npx cap sync android
