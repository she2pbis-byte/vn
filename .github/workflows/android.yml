name: Build Android APK with Icon

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Install Dependencies
        run: npm install

      - name: Prepare and Generate Assets
        # Создаем нужную структуру папок и генерируем иконки
        run: |
          mkdir -p assets
          if [ -f "icon.png" ]; then
            cp icon.png assets/icon.png
          fi
          npm install @capacitor/assets --save-dev
          npx capacitor-assets generate --android

      - name: Build Web App
        run: npm run build

      - name: Capacitor Sync and Update
        # update необходим, чтобы новые иконки привязались к проекту
        run: |
          npx cap add android || true
          npx cap update android
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: staffcloud-with-icon
          path: android/app/build/outputs/apk/debug/app-debug.apk
