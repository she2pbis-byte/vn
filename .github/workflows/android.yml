name: Build Android App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # Опция cache удалена, чтобы не требовать package-lock.json

      - name: Install Dependencies
        # Используем простую установку
        run: npm install

      - name: Build Web App
        # Создаем папку dist перед запуском Capacitor
        run: npm run build

      - name: Capacitor Sync
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Upload Android Project
        # Сохраняем готовую папку android как артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: android-project-files
          path: android/
