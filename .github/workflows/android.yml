name: Build Android APK

on:
  push:
    branches: [ main, master ] # Сборка запускается при пуше в эти ветки
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Берем исходный код из репозитория
      - name: Checkout Source
        uses: actions/checkout@v4

      # 2. Устанавливаем Java (необходима для сборки Android)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Устанавливаем Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 4. Устанавливаем зависимости проекта
      - name: Install Dependencies
        run: npm install

      # 5. Собираем веб-часть (ваш HTML/JS/CSS)
      # Если у вас нет скрипта build, просто создайте папку 'www' или 'dist' и скопируйте туда index.html
      - name: Build Web Project
        run: npm run build --if-present

      # 6. Устанавливаем Android SDK и инструменты сборки
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 7. Сборка самого APK через Capacitor
      # Мы используем npx, чтобы не устанавливать всё глобально
      - name: Build Android APK
        run: |
          npx cap add android || true
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 8. Загрузка готового файла (Исправленная версия v4)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: catering-app-debug
          # Путь к сгенерированному файлу после работы Gradle
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
