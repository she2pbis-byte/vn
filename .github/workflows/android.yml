name: Build Android APK (Final Force Icon)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Capacitor Sync
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Force Overwrite Icons
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          
          # Ищем иконку везде: в корне, в src или в public
          if [ -f "icon.png" ]; then
            SOURCE_ICON="icon.png"
          elif [ -f "public/icon.png" ]; then
            SOURCE_ICON="public/icon.png"
          elif [ -f "dist/icon.png" ]; then
            SOURCE_ICON="dist/icon.png"
          else
            echo "Ошибка: Файл icon.png не найден ни в корне, ни в public, ни в dist!"
            exit 1
          fi
          
          echo "Использую иконку из: $SOURCE_ICON"
          RES_PATH="android/app/src/main/res"
          
          # Генерируем все размеры иконки напрямую в папки Android
          for size in 48x48:mipmap-mdpi 72x72:mipmap-hdpi 96x96:mipmap-xhdpi 144x144:mipmap-xxhdpi 192x192:mipmap-xxxhdpi; do
            IFS=":" read -r res folder <<< "$size"
            convert "$SOURCE_ICON" -resize "$res" "$RES_PATH/$folder/ic_launcher.png"
            convert "$SOURCE_ICON" -resize "$res" "$RES_PATH/$folder/ic_launcher_round.png"
          done
          
          echo "Иконки успешно внедрены в проект!"

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: staffcloud-fixed-icon
          path: android/app/build/outputs/apk/debug/app-debug.apk
