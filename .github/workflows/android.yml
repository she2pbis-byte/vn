jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: npm install

      - name: Build React App  # ЭТОТ ШАГ ОБЯЗАТЕЛЕН ПЕРЕД CAPACITOR
        run: npm run build

      - name: Sync Capacitor
        run: |
          npx cap add android || true
          npx cap sync android
