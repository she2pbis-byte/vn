name: Build Android APK (Master Icon Fix)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Capacitor Sync
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Force Overwrite Icons & Disable Adaptive
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          
          # Поиск иконки
          SOURCE_ICON=$(find . -maxdepth 3 -not -path "./android/*" -not -path "./node_modules/*" -iname "icon.png" | head -n 1)
          
          if [ -z "$SOURCE_ICON" ]; then
            echo "Файл icon.png не найден!"
            exit 1
          fi
          
          RES_PATH="android/app/src/main/res"
          
          # 1. Генерируем классические иконки (все размеры)
          declare -A SIZES=( ["48x48"]="mdpi" ["72x72"]="hdpi" ["96x96"]="xhdpi" ["144x144"]="xxhdpi" ["192x192"]="xxxhdpi" )
          for size in "${!SIZES[@]}"; do
            folder=${SIZES[$size]}
            mkdir -p "$RES_PATH/mipmap-$folder"
            convert "$SOURCE_ICON" -resize "$size" "$RES_PATH/mipmap-$folder/ic_launcher.png"
            convert "$SOURCE_ICON" -resize "$size" "$RES_PATH/mipmap-$folder/ic_launcher_round.png"
          done

          # 2. УДАЛЯЕМ адаптивные иконки (xml-файлы), которые блокируют вашу картинку
          find "$RES_PATH" -name "ic_launcher.xml" -delete
          find "$RES_PATH" -name "ic_launcher_round.xml" -delete
          find "$RES_PATH" -name "ic_launcher_background.xml" -delete
          find "$RES_PATH" -name "ic_launcher_foreground.xml" -delete
          
          # 3. ПРАВИМ MANIFEST: заставляем Android искать именно PNG
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:icon="@mipmap\/ic_launcher"/android:icon="@mipmap\/ic_launcher"/g' $MANIFEST
          
          echo "Адаптивные иконки удалены, PNG принудительно установлены!"

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: staffcloud-final-icon
          path: android/app/build/outputs/apk/debug/app-debug.apk
