name: Build Android App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        # Именно этот шаг создает папку ./dist, которую ищет Capacitor
        run: npm run build

      - name: Capacitor Sync
        run: |
          npx cap add android || true
          npx cap sync android

      # Опционально: архивация папки android для скачивания (если нужно)
      - name: Upload Android Folder
        uses: actions/upload-artifact@v4
        with:
          name: android-project
          path: android/
