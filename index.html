                                        <div className="flex items-center gap-1.5 bg-gray-50 px-2.5 py-1 rounded-lg border border-gray-100">
                                            <span className="text-[9px] font-black uppercase tracking-wider text-gray-400">Статус:</span>
                                            <span className={`text-[10px] font-black uppercase ${checkEventCompleteness(currentEvent) ? 'text-emerald-600' : 'text-red-500'}`}>
                                                {checkEventCompleteness(currentEvent) ? 'ГОТОВО' : 'ПРОЕКТ'}
                                            </span>
                                        </div>
                                    </div>

                                    {currentEvent.staff && currentEvent.staff.length > 0 ? (
                                        <div className="border border-[#60453910] rounded-2xl overflow-hidden bg-gray-50/50">
                                            <table className="staff-table text-xs">
                                                <thead>
                                                    <tr className="bg-gray-100/80 text-left text-[9px] font-black uppercase text-gray-400 tracking-wider border-b border-[#60453910]">
                                                        <th className="col-staff py-2 px-3">Сотрудник</th>
                                                        <th className="col-timing py-2 px-2 text-center">Время</th>
                                                        <th className="col-actions py-2 px-3 text-right">Расчёт</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-gray-100 font-semibold">
                                                    {currentEvent.staff.map((s, sIdx) => (
                                                        <tr key={sIdx} className="hover:bg-white/80 transition-colors">
                                                            <td className="py-2.5 px-3 min-w-0">
                                                                <div className="flex items-center gap-1.5 min-w-0">
                                                                    {s.phone && (
                                                                        <a href={`tel:${s.phone}`} className="p-1 bg-gray-100 text-gray-400 rounded hover:text-[#C7886B] shrink-0" title={s.phone}>
                                                                            <Icons.Phone size={10} />
                                                                        </a>
                                                                    )}
                                                                    <p className="truncate text-gray-800 uppercase font-bold text-[13px]">{s.name}</p>
                                                                </div>
                                                                <div className="flex flex-wrap gap-0.5 mt-1">
                                                                    {s.roles.map(r => (
                                                                        <span key={r} className="text-[9px] font-black px-1.5 py-0.2 bg-[#60453910] text-[#604539] rounded uppercase">
                                                                            {r}
                                                                        </span>
                                                                    ))}
                                                                </div>
                                                            </td>
                                                            <td className="py-2.5 px-2 text-center text-gray-500 font-bold text-[11px] whitespace-nowrap">
                                                                {s.time || '—'}{s.end ? `–${s.end}` : ''}
                                                            </td>
                                                            <td className="py-2.5 px-3 text-right">
                                                                <div className="flex justify-end gap-1">
                                                                    {s.roles.map(role => {
                                                                        const isPaid = s.rolePaid && s.rolePaid[role] === true;
                                                                        return (
                                                                            <button 
                                                                                key={role}
                                                                                onClick={async () => {
                                                                                    const updatedEvents = events.map(ev => {
                                                                                        if (ev.id === selectedEventId) {
                                                                                            const updatedStaff = ev.staff.map((st, sIndex) => {
                                                                                                if (sIndex !== sIdx) return st;
                                                                                                const currentPaid = st.rolePaid || {};
                                                                                                return { ...st, rolePaid: { ...currentPaid, [role]: !currentPaid[role] } };
                                                                                            });
                                                                                            return { ...ev, staff: updatedStaff };
                                                                                        }
                                                                                        return ev;
                                                                                    });
                                                                                    setEvents(updatedEvents);
                                                                                    await saveToGitHub(GITHUB_CONFIG.path, updatedEvents);
                                                                                }}
                                                                                className={`w-7 h-7 rounded-lg font-black text-[9px] uppercase border transition-all flex items-center justify-center ${isPaid ? 'bg-emerald-500 border-emerald-500 text-white shadow-sm' : 'bg-white border-red-200 text-red-500 hover:bg-red-50'}`}
                                                                                title={`${role.toUpperCase()}: ${isPaid ? 'Оплачено' : 'Ждет оплату'}`}
                                                                            >
                                                                                {role}
                                                                            </button>
                                                                        );
                                                                    })}
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    ) : (
                                        <div className="py-6 text-center text-gray-300 border-2 border-dashed border-gray-100 rounded-2xl uppercase font-black text-[9px] tracking-widest">Команда не собрана</div>
                                    )}
                                </div>
                            </div>
                        </div>
                    ) : (
                        /* СПИСОК МЕРОПРИЯТИЙ */
                        <div className="space-y-3">
                            {filteredEvents.length > 0 ? (
                                filteredEvents.map(ev => {
                                    const completeness = checkEventCompleteness(ev);
                                    const paidStatus = isEventFullyPaid(ev);
                                    return (
                                        <div 
                                            key={ev.id}
                                            onClick={() => setSelectedEventId(ev.id)}
                                            className="bg-white p-4 rounded-3xl border-2 border-[#604539] border-b-8 shadow-md hover:scale-[1.01] active:scale-[0.99] transition-all cursor-pointer flex gap-4 items-center relative overflow-hidden"
                                        >
                                            {/* Левая плашка даты */}
                                            <div className="w-12 shrink-0 flex flex-col items-center justify-center border-r-2 border-[#60453910] pr-4">
                                                <span className="text-[9px] font-black uppercase text-gray-400 tracking-wider">{new Date(ev.date).toLocaleString('ru', { month: 'short' })}</span>
                                                <span className="text-2xl font-black text-[#604539] leading-none mt-0.5">{new Date(ev.date).getDate()}</span>
                                            </div>

                                            {/* Центральный блок инфо */}
                                            <div className="flex-1 min-w-0">
                                                <h3 className="font-black text-base uppercase tracking-tight truncate text-[#1F1713]">{ev.name}</h3>
                                                <div className="flex items-center gap-3 mt-1.5 text-xs text-gray-500 font-bold">
                                                    <div className="flex items-center gap-1">
                                                        <Icons.Clock size={13} className="text-[#C7886B]" />
                                                        <span>{ev.start || '—'}{ev.end ? `-${ev.end}` : ''}</span>
                                                    </div>
                                                    {ev.location && (
                                                        <div className="flex items-center gap-1 min-w-0 max-w-[150px]">
                                                            <Icons.MapPin size={13} className="text-[#C7886B] shrink-0" />
                                                            <span className="truncate">{ev.location}</span>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>

                                            {/* Правый блок статусов */}
                                            <div className="shrink-0 flex items-center gap-1">
                                                {!showArchive ? (
                                                    // Для предстоящих: Индикатор готовности команды
                                                    <div className={`w-6 h-6 rounded-full flex items-center justify-center border-2 ${completeness ? 'bg-emerald-500 border-emerald-500 text-white' : 'bg-white border-red-300 text-red-500'}`}>
                                                        {completeness ? <Icons.DoubleCheck size={14} color="white" /> : <span className="font-black text-[10px]">!</span>}
                                                    </div>
                                                ) : (
                                                    // Для архива: Индикатор оплаты долгов
                                                    <div className={`w-6 h-6 rounded-full flex items-center justify-center border-2 ${paidStatus ? 'bg-emerald-500 border-emerald-500' : 'bg-red-500 border-red-500'}`}>
                                                        <Icons.Check size={12} color="white" />
                                                    </div>
                                                )}
                                                <span className="text-gray-300 font-black text-sm pl-1">»</span>
                                            </div>
                                        </div>
                                    );
                                })
                            ) : (
                                <div className="py-12 text-center bg-white/40 border-2 border-dashed border-[#60453915] rounded-3xl">
                                    <p className="text-[10px] font-black uppercase tracking-widest text-gray-400">Мероприятий не найдено</p>
                                </div>
                            )}
                        </div>
                    )}

                    {/* ЭКРАН ФОРМЫ (СОЗДАНИЕ / РЕДАКТИРОВАНИЕ МЕРОПРИЯТИЯ) */}
                    {view === 'form' && isFormOpen && (
                        <div ref={eventFormRef} className="bg-white p-5 rounded-3xl border-2 border-[#604539] border-b-8 shadow-xl mt-6 animate-in">
                            <h3 className="font-black uppercase tracking-wider text-[#604539] text-sm border-b-2 border-dashed border-[#60453910] pb-3 mb-4">
                                {selectedEventId ? '✏️ Изменить мероприятие' : '✨ Новое мероприятие'}
                            </h3>
                            
                            <div className="space-y-4">
                                <div>
                                    <p className="text-[9px] uppercase font-bold mb-1 opacity-40 ml-1">Название мероприятия *</p>
                                    <input type="text" placeholder="Заказчик / Название" value={newEvent.name} onChange={e => setNewEvent({...newEvent, name: e.target.value})} className="w-full py-2.5 px-3 rounded-xl border-2 bg-white text-sm font-bold outline-none focus:border-[#C7886B]" style={{borderColor: colors.accent+'20'}} />
                                </div>

                                <div className="grid grid-cols-2 gap-2">
                                    <div>
                                        <p className="text-[9px] uppercase font-bold mb-1 opacity-40 ml-1">Дата *</p>
                                        <input type="date" value={newEvent.date} onChange={e => setNewEvent({...newEvent, date: e.target.value})} className="w-full py-2.5 px-3 rounded-xl border-2 bg-white text-sm font-bold outline-none focus:border-[#C7886B]" style={{borderColor: colors.accent+'20'}} />
                                    </div>
                                    <div className="relative">
                                        <p className="text-[9px] uppercase font-bold mb-1 opacity-40 ml-1">Администратор</p>
                                        <input type="text" placeholder="Имя" value={newEvent.admin || ''} onChange={e => setNewEvent({...newEvent, admin: e.target.value})} onFocus={() => setShowAdminSuggestions(true)} onBlur={() => setTimeout(() => setShowAdminSuggestions(false), 200)} className="w-full py-2.5 px-3 rounded-xl border-2 bg-white text-sm font-bold outline-none focus:border-[#C7886B]" style={{borderColor: colors.accent+'20'}} />
                                        {showAdminSuggestions && (
                                            <div className="autocomplete-list custom-scrollbar">
                                                {admins.filter(a => a.toLowerCase().includes((newEvent.admin || '').toLowerCase())).map(a => (
                                                    <div key={a} onMouseDown={() => setNewEvent({...newEvent, admin: a})} className="autocomplete-item font-bold uppercase text-[#604539]">{a}</div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>

                                <div className="flex gap-2">
                                    <SimpleTimePicker label="Начало (сбор)" value={newEvent.start} onChange={val => setNewEvent({...newEvent, start: val})} colors={colors} />
                                    <SimpleTimePicker label="Окончание" value={newEvent.end} onChange={val => setNewEvent({...newEvent, end: val})} colors={colors} />
                                </div>

                                <div>
                                    <p className="text-[9px] uppercase font-bold mb-1 opacity-40 ml-1">Место проведения</p>
                                    <input type="text" placeholder="Локация / Адрес" value={newEvent.location} onChange={e => setNewEvent({...newEvent, location: e.target.value})} className="w-full py-2.5 px-3 rounded-xl border-2 bg-white text-sm font-bold outline-none focus:border-[#C7886B]" style={{borderColor: colors.accent+'20'}} />
                                </div>

                                <div className="relative">
                                    <p className="text-[9px] uppercase font-bold mb-1 opacity-40 ml-1">Формат накрытия</p>
                                    <input type="text" placeholder="Выберите или введите" value={newEvent.format} onChange={e => setNewEvent({...newEvent, format: e.target.value})} onFocus={() => setShowFormatSuggestions(true)} onBlur={() => setTimeout(() => setShowFormatSuggestions(false), 200)} className="w-full py-2.5 px-3 rounded-xl border-2 bg-white text-sm font-bold outline-none focus:border-[#C7886B]" style={{borderColor: colors.accent+'20'}} />
                                    {showFormatSuggestions && (
                                        <div className="autocomplete-list custom-scrollbar">
                                            {formats.filter(f => f.toLowerCase().includes((newEvent.format || '').toLowerCase())).map(f => (
                                                <div key={f} onMouseDown={() => setNewEvent({...newEvent, format: f})} className="autocomplete-item font-bold uppercase text-[#604539]">{f}</div>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                <div>
                                    <p className="text-[9px] uppercase font-bold mb-1 opacity-40 ml-1">Комментарий / Детали</p>
                                    <AutoHeightTextarea placeholder="Особые пожелания, меню, тайминг..." value={newEvent.comment} onChange={e => setNewEvent({...newEvent, comment: e.target.value})} className="w-full py-2.5 px-3 rounded-xl border-2 bg-white text-sm font-medium outline-none focus:border-[#C7886B]" style={{borderColor: colors.accent+'20', lineHeight: '1.4'}} />
                                </div>

                                {/* ФАЙЛЫ В ФОРМЕ МЕРОПРИЯТИЯ */}
                                <div>
                                    <p className="text-[9px] uppercase font-bold mb-1 opacity-40 ml-1">Прикрепленные файлы</p>
                                    <div className="space-y-1.5 mb-2">
                                        {newEvent.files && newEvent.files.length > 0 && (
                                            newEvent.files.map((file, fIdx) => (
                                                <div key={fIdx} className="flex items-center justify-between p-2 bg-gray-50 border border-gray-100 rounded-xl text-xs font-bold text-[#604539]">
                                                    <span className="truncate pr-2">{file.name}</span>
                                                    <button onClick={() => handleFileDelete(file, 'new_event')} className="p-1 text-gray-300 hover:text-red-500"><Icons.Trash size={14} /></button>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                    <input ref={fileInputRef} type="file" multiple className="hidden" onChange={(e) => handleFileUpload(e, 'new_event')} disabled={isUploading} />
                                    <button onClick={() => fileInputRef.current.click()} disabled={isUploading} className="w-full py-2 bg-gray-50 border-2 border-dashed border-gray-200 text-gray-500 rounded-xl text-[9px] font-black uppercase tracking-widest flex items-center justify-center gap-1.5 hover:bg-gray-100 transition-all">
                                        <Icons.Paperclip size={12} /> {isUploading ? 'ЗАГРУЗКА...' : 'ПРИКРЕПИТЬ ФАЙЛЫ'}
                                    </button>
                                </div>

                                {/* КОЛИЧЕСТВО ПЕРСОНАЛА */}
                                <div className="p-3 bg-gray-50 rounded-2xl border border-[#60453905]">
                                    <p className="text-[9px] uppercase font-black tracking-wider mb-2 opacity-40">Необходимый персонал (позиций):</p>
                                    <div className="grid grid-cols-4 gap-2">
                                        {['оф', 'бар', 'мой', 'пов'].map(role => (
                                            <div key={role} className="text-center">
                                                <p className="text-[9px] font-black uppercase mb-1 text-gray-400">{role === 'оф' ? 'Оф' : role === 'бар' ? 'Бар' : role === 'мой' ? 'Мой' : 'Пов'}</p>
                                                <input 
                                                    type="text" 
                                                    inputMode="numeric"
                                                    value={newEvent.neededStaff?.[role] || 0} 
                                                    onChange={e => {
                                                        const num = parseInt(formatOnlyNumbers(e.target.value)) || 0;
                                                        setNewEvent({ ...newEvent, neededStaff: { ...newEvent.neededStaff, [role]: num } });
                                                    }}
                                                    className="w-full p-2 rounded-xl border-2 border-gray-200 bg-white font-black text-sm text-center outline-none focus:border-[#C7886B]" 
                                                />
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* УПРАВЛЕНИЕ СМЕНОЙ ПЕРСОНАЛА В ФОРМЕ */}
                                <div className="pt-2 border-t border-dashed border-[#60453910]">
                                    <div className="flex justify-between items-center mb-2">
                                        <h4 className="text-[10px] font-black uppercase tracking-widest text-gray-400">Назначение команды:</h4>
                                        <button onClick={handleAddStaffRow} className="py-1 px-2.5 bg-[#604539] text-white text-[9px] font-black uppercase tracking-widest rounded-lg flex items-center gap-1 hover:bg-[#C7886B] transition-all shadow-sm">+ Добавить</button>
                                    </div>

                                    {newEvent.staff && newEvent.staff.length > 0 ? (
                                        <div className="space-y-2 max-h-[300px] overflow-y-auto pr-1 custom-scrollbar">
                                            {newEvent.staff.map((s, idx) => (
                                                <div key={idx} className="p-3 bg-gray-50 rounded-2xl border-2 border-gray-100 space-y-2 relative animate-in">
                                                    <button onClick={() => handleRemoveStaffRow(idx)} className="absolute top-2.5 right-2.5 text-gray-300 hover:text-red-500 transition-colors"><Icons.X size={16} /></button>
                                                    
                                                    <div className="relative pr-6">
                                                        <input 
                                                            type="text" 
                                                            placeholder="ФИО сотрудника" 
                                                            value={s.name} 
                                                            onChange={e => {
                                                                handleStaffRowChange(idx, 'name', e.target.value);
                                                                setShowSuggestions(idx);
                                                            }}
                                                            onFocus={() => setShowSuggestions(idx)}
                                                            onBlur={() => setTimeout(() => setShowSuggestions(false), 200)}
                                                            className="w-full py-1.5 px-3 rounded-xl border-2 bg-white text-xs font-bold outline-none focus:border-[#C7886B] uppercase" 
                                                            style={{borderColor: colors.accent+'10'}}
                                                        />
                                                        {showSuggestions === idx && s.name && (
                                                            <div className="autocomplete-list custom-scrollbar">
                                                                {filteredStaffSuggestions(s.name).map(name => (
                                                                    <div 
                                                                        key={name} 
                                                                        onMouseDown={() => {
                                                                            handleStaffRowChange(idx, 'name', name);
                                                                            setShowSuggestions(false);
                                                                        }} 
                                                                        className="autocomplete-item font-bold uppercase text-[#604539]"
                                                                    >
                                                                        {name}
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        )}
                                                    </div>

                                                    <div className="flex gap-2">
                                                        <div className="flex-1">
                                                            <input type="text" placeholder="Время сб" value={s.time} onChange={e => handleStaffRowChange(idx, 'time', e.target.value)} className="w-full py-1.5 px-2 rounded-xl border-2 bg-white text-center text-xs font-bold outline-none" style={{borderColor: colors.accent+'10'}} />
                                                        </div>
                                                        <div className="flex-1">
                                                            <input type="text" placeholder="Время окн" value={s.end || ''} onChange={e => handleStaffRowChange(idx, 'end', e.target.value)} className="w-full py-1.5 px-2 rounded-xl border-2 bg-white text-center text-xs font-bold outline-none" style={{borderColor: colors.accent+'10'}} />
                                                        </div>
                                                    </div>

                                                    <div className="flex flex-wrap gap-1 pt-1">
                                                        {['оф', 'бар', 'мой', 'пов'].map(role => {
                                                            const isSelected = s.roles.includes(role);
                                                            return (
                                                                <button 
                                                                    key={role}
                                                                    onClick={() => {
                                                                        const newRoles = isSelected ? s.roles.filter(r => r !== role) : [...s.roles, role];
                                                                        handleStaffRowChange(idx, 'roles', newRoles);
                                                                    }}
                                                                    className={`px-3 py-1 rounded-lg text-[10px] font-black uppercase border transition-all ${isSelected ? 'bg-[#604539] border-[#604539] text-white shadow-sm' : 'bg-white border-gray-200 text-gray-400'}`}
                                                                >
                                                                    {role === 'оф' ? 'Оф' : role === 'бар' ? 'Бар' : role === 'мой' ? 'Мой' : 'Пов'}
                                                                </button>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    ) : (
                                        <div className="py-6 text-center text-gray-300 border-2 border-dashed border-gray-100 rounded-2xl uppercase font-black text-[9px] tracking-widest">Никто не добавлен</div>
                                    )}
                                </div>

                                {/* ЧЕКБОКС Проверено / Подтверждено */}
                                <div className="pt-2">
                                    <button 
                                        onClick={handleToggleChecked}
                                        className={`w-full py-3 px-4 rounded-xl border-2 font-black text-[10px] uppercase tracking-widest flex items-center justify-center gap-2 transition-all ${newEvent.status?.checked ? 'bg-emerald-500 border-emerald-500 text-white shadow-md' : 'bg-white border-red-200 text-red-500 hover:bg-red-50'}`}
                                    >
                                        <Icons.Check size={16} color={newEvent.status?.checked ? "white" : "currentColor"} />
                                        {newEvent.status?.checked ? 'СМЕНА ПОЛНОСТЬЮ УТВЕРЖДЕНА' : 'ПОДТВЕРДИТЬ И УТВЕРДИТЬ СМЕНУ'}
                                    </button>
                                </div>

                                <div className="grid grid-cols-2 gap-3 pt-4 border-t border-[#60453910]">
                                    <button onClick={() => { setIsFormOpen(false); setSelectedEventId(null); setView('list'); }} className="py-3 bg-gray-100 text-gray-600 rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-gray-200 transition-all">Отмена</button>
                                    <button onClick={handleSaveEvent} className="py-3 bg-[#604539] text-white rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-[#C7886B] transition-all shadow-md">Сохранить</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ЭКРАН СОЗДАНИЯ СОТРУДНИКА */}
                    {view === 'staff_form' && isStaffFormOpen && (
                        <div ref={staffFormRef} className="bg-white p-5 rounded-3xl border-2 border-[#604539] border-b-8 shadow-xl mt-6 animate-in">
                            <h3 className="font-black uppercase tracking-wider text-[#604539] text-sm border-b-2 border-dashed border-[#60453910] pb-3 mb-4">👤 Добавить сотрудника</h3>
                            <div className="space-y-4">
                                <div>
                                    <p className="text-[9px] uppercase font-bold mb-1 opacity-40 ml-1">Фамилия Имя *</p>
                                    <input type="text" placeholder="Иванов Иван" value={newStaff.name} onChange={e => setNewStaff({...newStaff, name: e.target.value})} className="w-full py-2.5 px-3 rounded-xl border-2 bg-white text-sm font-bold outline-none focus:border-[#C7886B] uppercase" style={{borderColor: colors.accent+'20'}} />
                                </div>
                                <div>
                                    <p className="text-[9px] uppercase font-bold mb-1 opacity-40 ml-1">Номер телефона</p>
                                    <input type="text" inputMode="tel" placeholder="+7 (900) 000-00-00" value={newStaff.phone} onChange={e => setNewStaff({...newStaff, phone: formatPhoneNumber(e.target.value)})} className="w-full py-2.5 px-3 rounded-xl border-2 bg-white text-sm font-bold outline-none focus:border-[#C7886B]" style={{borderColor: colors.accent+'20'}} />
                                </div>
                                <div>
                                    <p className="text-[9px] uppercase font-bold mb-1 opacity-40 ml-1">Номер карты / Банк</p>
                                    <input type="text" placeholder="0000 Сбер" value={newStaff.card} onChange={e => setNewStaff({...newStaff, card: e.target.value})} className="w-full py-2.5 px-3 rounded-xl border-2 bg-white text-sm font-bold outline-none focus:border-[#C7886B]" style={{borderColor: colors.accent+'20'}} />
                                </div>
                                <div>
                                    <p className="text-[9px] uppercase font-bold mb-1 opacity-40 ml-1">Заметки / Особенности</p>
                                    <AutoHeightTextarea placeholder="Опыт, наличие медкнижки, авто..." value={newStaff.notes} onChange={e => setNewStaff({...newStaff, notes: e.target.value})} className="w-full py-2.5 px-3 rounded-xl border-2 bg-white text-sm font-medium outline-none focus:border-[#C7886B]" style={{borderColor: colors.accent+'20', lineHeight: '1.4'}} />
                                </div>
                                <div className="grid grid-cols-2 gap-3 pt-2">
                                    <button onClick={() => { setIsStaffFormOpen(false); setView('list'); }} className="py-3 bg-gray-100 text-gray-600 rounded-xl text-[10px] font-black uppercase tracking-widest">Отмена</button>
                                    <button onClick={handleSaveStaff} className="py-3 bg-[#604539] text-white rounded-xl text-[10px] font-black uppercase tracking-widest shadow-md">Добавить</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ЭКРАН НАСТРОЕК GITHUB TOKEN */}
                    {view === 'settings' && (
                        <div className="bg-white p-5 rounded-3xl border-2 border-[#604539] border-b-8 shadow-xl animate-in">
                            <h3 className="font-black uppercase tracking-wider text-[#604539] text-sm border-b-2 border-dashed border-[#60453910] pb-3 mb-4">⚙️ Синхронизация данных</h3>
                            <div className="space-y-4">
                                <div>
                                    <p className="text-[9px] uppercase font-bold mb-1 opacity-40 ml-1">GitHub Personal Access Token</p>
                                    <input 
                                        type="password" 
                                        placeholder="ghp_..." 
                                        value={githubToken} 
                                        onChange={e => setGithubToken(e.target.value)} 
                                        className="w-full py-2.5 px-3 rounded-xl border-2 bg-white text-sm font-bold outline-none focus:border-[#C7886B]" 
                                        style={{borderColor: colors.accent+'20'}} 
                                    />
                                    <p className="text-[9px] text-gray-400 font-medium mt-1.5 leading-normal px-1">Токен сохраняется локально в вашем браузере и используется напрямую для безопасных запросов к GitHub API.</p>
                                </div>
                                <div className="pt-2">
                                    <button 
                                        onClick={() => { setView('list'); setSelectedEventId(null); setIsFormOpen(false); }} 
                                        className="w-full py-3 bg-[#604539] text-white rounded-xl text-[10px] font-black uppercase tracking-widest shadow-md"
                                    >
                                        Вернуться в панель
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* МОДАЛКА ГРАФИКА РАБОТЫ КОНКРЕТНОГО СОТРУДНИКА */}
                    {activeStaffSchedule && (
                        <StaffScheduleModal 
                            staffName={activeStaffSchedule}
                            events={events}
                            todayStr={todayStr}
                            onClose={() => setActiveStaffSchedule(null)}
                            onSelectEvent={(id) => { setSelectedEventId(id); setActiveStaffSchedule(null); setView('list'); }}
                        />
                    )}

                    {/* НИЖНИЙ НАВИГАЦИОННЫЙ БАР */}
                    <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/90 backdrop-blur-md border-t-2 border-[#60453920] px-6 py-2.5 flex justify-around items-center z-50 rounded-t-3xl shadow-xl">
                        <button 
                            onClick={() => { setView('list'); setSelectedEventId(null); setIsFormOpen(false); setIsStaffFormOpen(false); }}
                            className={`flex flex-col items-center gap-0.5 transition-all ${view === 'list' ? 'text-[#604539] scale-110 font-black' : 'text-gray-400 hover:text-gray-600'}`}
                        >
                            <span className="text-xl">📋</span>
                            <span className="text-[9px] uppercase tracking-wider">События</span>
                        </button>
                        <button 
                            onClick={() => { setView('form'); setIsFormOpen(true); setSelectedEventId(null); setIsStaffFormOpen(false); setNewEvent({name:'', date:'', start:'', end:'', location:'', format:'', admin:'', comment:'', neededStaff:{оф:0, бар:0, мой:0, пов:0}, staff:[], files:[], status:{checked:false}}); }}
                            className={`flex flex-col items-center gap-0.5 transition-all ${view === 'form' && isFormOpen ? 'text-[#604539] scale-110 font-black' : 'text-gray-400 hover:text-gray-600'}`}
                        >
                            <span className="text-xl">✨</span>
                            <span className="text-[9px] uppercase tracking-wider">+ Событие</span>
                        </button>
                        <button 
                            onClick={() => { setView('staff_form'); setIsStaffFormOpen(true); setIsFormOpen(false); setSelectedEventId(null); }}
                            className={`flex flex-col items-center gap-0.5 transition-all ${view === 'staff_form' && isStaffFormOpen ? 'text-[#604539] scale-110 font-black' : 'text-gray-400 hover:text-gray-600'}`}
                        >
                            <span className="text-xl">👤</span>
                            <span className="text-[9px] uppercase tracking-wider">+ Человек</span>
                        </button>
                        <button 
                            onClick={() => { setView('settings'); setIsFormOpen(false); setIsStaffFormOpen(false); setSelectedEventId(null); }}
                            className={`flex flex-col items-center gap-0.5 transition-all ${view === 'settings' ? 'text-[#604539] scale-110 font-black' : 'text-gray-400 hover:text-gray-600'}`}
                        >
                            <span className="text-xl">⚙️</span>
                            <span className="text-[9px] uppercase tracking-wider">Токен</span>
                        </button>
                    </nav>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
