<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>АДМИН</title>
    <link rel="icon" type="image/x-icon" href="catering-b.ico">

    <meta name="theme-color" content="#FFEED2">
    <meta name="msapplication-navbutton-color" content="#FFEED2">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #FFECD2; scroll-behavior: smooth; }
        .animate-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .sync-status { 
            font-size: 10px; 
            font-weight: 800; 
            padding: 4px 12px; 
            border-radius: 99px; 
            min-width: 100px; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            line-height: 1.4; 
            letter-spacing: 0.05em; 
            transition: all 0.3s ease;
        }
        .sync-idle { background: #e2e8f0; color: #64748b; }
        .sync-loading { background: #fef9c3; color: #a16207; }
        .sync-success { background: #dcfce7; color: #166534; }
        .sync-error { background: #fee2e2; color: #991b1b; }
        .sync-local { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }
        
        .spin-slow { animation: spin 2s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .role-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.2s;
            cursor: pointer;
            white-space: nowrap;
        }

        .staff-table { table-layout: fixed; width: 100%; }
        .col-staff { width: 55%; }
        .col-timing { width: 25%; }
        .col-actions { width: 20%; }

        .auto-textarea { resize: none; overflow: hidden; min-height: 60px; }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
        }

        .weekday-header {
            text-align: center;
            font-size: 9px;
            font-weight: 900;
            text-transform: uppercase;
            padding: 6px 0;
            background-color: #FFEED2;
            color: #1F1713;
            border-radius: 6px;
            margin-bottom: 4px;
        }

        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        
        .calendar-day.has-event::after {
            content: '';
            position: absolute;
            bottom: 6px;
            width: 50%;
            height: 2px;
            background: #000;
            border-radius: 1px;
            transition: background 0.2s;
        }

        .calendar-day.is-today.has-event::after,
        .calendar-day.has-unpaid-debt.has-event::after,
        .calendar-day.selected.has-event::after {
            background: #fff !important;
        }

        .calendar-day.is-today {
            background-color: #604539 !important;
            color: white !important;
            font-weight: 800 !important;
        }

        .calendar-day.has-unpaid-debt {
            background-color: #fee2e2 !important;
            color: #991b1b !important;
            font-weight: 700;
        }

        .calendar-day.past-date:not(.selected):not(.has-unpaid-debt):not(.is-today) {
            background-color: #f3f4f6;
            color: #9ca3af;
        }

        .calendar-day.status-error { box-shadow: inset 0 0 0 2.5px #ef4444; }
        .calendar-day.status-complete { box-shadow: inset 0 0 0 2.5px #22c55e; }
        .calendar-day.status-both { animation: flash-status 1.2s step-end infinite; }

        @keyframes flash-status {
            0%, 100% { box-shadow: inset 0 0 0 2.5px #ef4444; }
            50% { box-shadow: inset 0 0 0 2.5px #22c55e; }
        }

        .calendar-day.selected.status-error { box-shadow: 0 0 0 3px #ef4444; }
        .calendar-day.selected.status-complete { box-shadow: 0 0 0 3px #22c55e; }
        .calendar-day.selected.status-both { animation: flash-status-selected 1.2s step-end infinite; }

        @keyframes flash-status-selected {
            0%, 100% { box-shadow: 0 0 0 3px #ef4444; }
            50% { box-shadow: 0 0 0 3px #22c55e; }
        }

        .hidden-date-input { position: absolute; opacity: 0; width: 1px; height: 1px; overflow: hidden; pointer-events: none; }
        .calendar-nav-btn:hover { border-color: #60453950; }
        .file-name-container { width: 100%; overflow: hidden; }
        .file-name-text { word-wrap: break-word; overflow-wrap: break-word; word-break: normal; line-height: 1.2; display: block; }

        .autocomplete-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 2px solid #60453920;
            border-top: none;
            border-radius: 0 0 12px 12px;
            z-index: 50;
            max-height: 150px;
            overflow-y: auto;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .autocomplete-item {
            padding: 8px 12px;
            font-size: 12px;
            cursor: pointer;
            border-bottom: 1px solid #f3f4f6;
        }
        .autocomplete-item:hover { background-color: #FFECD2; }
        .autocomplete-item:last-child { border-bottom: none; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #60453920; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, useRef } = React;

        const GITHUB_CONFIG = {
            owner: 'she2pbis-byte',
            repo: 'vn',
            path: 'events_data.json',
            staffPath: 'staff_database.json',
            commonFilesPath: 'common_files_db.json'
        };

        const Icons = {
            Plus: ({size=20}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5v14M5 12h14"/></svg>,
            Trash: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18M19 6v14c0-1-1-2-2-2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>,
            Edit: ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>,
            Check: ({size=20, color="currentColor"}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17l-5-5"/></svg>,
            DoubleCheck: ({size=20, color="currentColor"}) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{ display: 'block' }}>
                    <path d="M7 12l2 2 5-5" /><path d="M13 12l2 2 5-5" opacity="0.6" />
                </svg>
            ),
            Clock: ({size=18, color="currentColor"}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
            ChevronLeft: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m15 18-6-6 6-6"/></svg>,
            ChevronRight: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m9 18 6-6 6-6"/></svg>,
            Calendar: ({size=20}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>,
            Cloche: ({size=14}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M2 20h20" /><path d="M20 20a8 8 0 0 0-16 0" /><circle cx="12" cy="12" r="1" /><path d="M12 12V10" /><path d="M11 10h2" /></svg>,
            Martini: ({size=14}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M8 22h8M12 11v11M19 2 12 11 5 2z"/></svg>,
            Droplet: ({size=14}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z" /></svg>,
            Pot: ({size=14}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 8h16" /><path d="M4 8v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8" /><path d="M10 8V5a1 1 0 0 1 1-1h2a1 1 0 0 1 1-1v3" /><path d="M2 11h2" /><path d="M20 11h2" /></svg>,
            Archive: ({size=20}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="21 8 21 21 3 21 3 8"></polyline><rect x="1" y="3" width="22" height="5"></rect><line x1="10" y1="12" x2="14" y2="12"></line></svg>,
            Users: ({size=18, color="currentColor"}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
            Refresh: ({size=14, className=""}) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>,
            X: ({size=20}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>,
            MapPin: ({size=14, color="currentColor"}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>,
            Paperclip: ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>,
            FileText: ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14.5 2 14.5 7.5 20 7.5"/></svg>,
            ExternalLink: ({size=14}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>,
            Phone: ({size=12, color="currentColor"}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>,
            User: ({size=14, color="currentColor"}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        };

        const formatPhoneNumber = (value) => {
            if (!value) return value;
            const phoneNumber = value.replace(/[^\d]/g, '');
            const phoneNumberLength = phoneNumber.length;
            if (phoneNumberLength < 2) return `+7`;
            if (phoneNumberLength < 5) return `+7 (${phoneNumber.slice(1, 4)}`;
            if (phoneNumberLength < 8) return `+7 (${phoneNumber.slice(1, 4)}) ${phoneNumber.slice(4, 7)}`;
            if (phoneNumberLength < 10) return `+7 (${phoneNumber.slice(1, 4)}) ${phoneNumber.slice(4, 7)}-${phoneNumber.slice(7, 9)}`;
            return `+7 (${phoneNumber.slice(1, 4)}) ${phoneNumber.slice(4, 7)}-${phoneNumber.slice(7, 9)}-${phoneNumber.slice(9, 11)}`;
        };

        const formatOnlyNumbers = (value) => value.replace(/[^\d]/g, '');

        const keyToLabel = { 'оф': 'Официант', 'бар': 'Бармен', 'мой': 'Мойщица', 'пов': 'Повар' };
        
        const getStaffCounts = (ev) => {
            const counts = { 'Официант': 0, 'Бармен': 0, 'Мойщица': 0, 'Повар': 0 };
            if (!ev || !ev.staff) return counts;
            ev.staff.forEach(s => {
                s.roles.forEach(role => { if (counts.hasOwnProperty(role)) counts[role]++; });
            });
            return counts;
        };

        const checkEventCompleteness = (ev) => {
            if (!ev || !ev.start) return false;
            if (ev.staff && ev.staff.length > 0) {
                if (ev.staff.some(s => !s.time)) return false;
            }
            const counts = getStaffCounts(ev);
            const rolesComplete = ['оф', 'бар', 'мой', 'пов'].every(roleKey => {
                const target = parseInt(ev.neededStaff?.[roleKey] || 0);
                const actual = counts[keyToLabel[roleKey]];
                return target === 0 || actual >= target;
            });
            if (!rolesComplete) return false;
            if (!ev.status?.checked) return false;
            return true;
        };

        const isEventFullyPaid = (ev) => {
            if (!ev || !ev.staff || ev.staff.length === 0) return true;
            return ev.staff.every(s => {
                if (!s.roles || s.roles.length === 0) return true;
                return s.roles.every(role => s.rolePaid && s.rolePaid[role] === true);
            });
        };

        const SimpleTimePicker = ({ value, onChange, colors, label, disabled }) => {
            const [inputValue, setInputValue] = useState(value || '');

            useEffect(() => {
                setInputValue(value || '');
            }, [value]);

            const handleInputChange = (e) => {
                let val = e.target.value.replace(/[^\d]/g, '');
                if (val.length > 4) val = val.slice(0, 4);

                let formatted = val;
                if (val.length >= 3) {
                    formatted = val.slice(0, 2) + ':' + val.slice(2);
                } else if (val.length > 0 && val.length <= 2) {
                    formatted = val;
                }
                
                setInputValue(formatted);
            };

            const handleBlur = () => {
                let clean = inputValue.replace(/[^\d]/g, '');
                if (!clean) {
                    onChange('');
                    return;
                }

                let h = "00", m = "00";

                if (clean.length === 1) {
                    h = clean.padStart(2, '0');
                } else if (clean.length === 2) {
                    h = clean;
                } else if (clean.length === 3) {
                    h = clean.slice(0, 1).padStart(2, '0');
                    m = clean.slice(1);
                } else if (clean.length === 4) {
                    h = clean.slice(0, 2);
                    m = clean.slice(2);
                }

                let hours = parseInt(h);
                let minutes = parseInt(m);

                if (hours > 23) hours = 23;
                if (minutes > 59) minutes = 59;

                const finalTime = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
                setInputValue(finalTime);
                onChange(finalTime);
            };

            return (
                <div className="flex-1">
                    {label && <p className="text-[9px] uppercase font-bold mb-1 opacity-40 ml-1">{label}</p>}
                    <input 
                        type="text"
                        inputMode="numeric"
                        value={inputValue}
                        onChange={handleInputChange}
                        onBlur={handleBlur}
                        placeholder="00:00"
                        disabled={disabled}
                        className="w-full py-2.5 px-2 rounded-xl border-2 bg-white text-center text-sm font-bold outline-none focus:border-[#C7886B] transition-all disabled:opacity-50"
                        style={{ borderColor: colors.accent + '20' }}
                    />
                </div>
            );
        };

        const Calendar = ({ events, onSelectDate, selectedDate, calendarRef }) => {
            const [currentMonth, setCurrentMonth] = useState(new Date(selectedDate || new Date()));
            const dateInputRef = useRef(null);
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const todayStr = today.toISOString().split('T')[0];
            
            const daysInMonth = (year, month) => new Date(year, month + 1, 0).getDate();
            const startDayOfMonth = (year, month) => {
                let day = new Date(year, month, 1).getDay();
                return day === 0 ? 6 : day - 1; 
            };

            const year = currentMonth.getFullYear();
            const month = currentMonth.getMonth();
            const days = daysInMonth(year, month);
            const startDay = startDayOfMonth(year, month);
            const monthName = currentMonth.toLocaleString('ru', { month: 'long' });

            const hasDebtInHistory = useMemo(() => {
                const firstDayOfCurrentView = new Date(year, month, 1);
                return events.some(ev => {
                    const evDate = new Date(ev.date);
                    return evDate < firstDayOfCurrentView && ev.date < todayStr && !isEventFullyPaid(ev);
                });
            }, [events, year, month, todayStr]);

            const prevMonth = (e) => { e.stopPropagation(); setCurrentMonth(new Date(year, month - 1, 1)); };
            const nextMonth = (e) => { e.stopPropagation(); setCurrentMonth(new Date(year, month + 1, 1)); };

            const handleJumpDate = (e) => {
                const dateVal = e.target.value;
                if (!dateVal) return;
                const d = new Date(dateVal);
                setCurrentMonth(new Date(d.getFullYear(), d.getMonth(), 1));
                onSelectDate(dateVal);
            };

            const triggerJump = (e) => {
                e.stopPropagation();
                if (dateInputRef.current) {
                    try {
                        if (dateInputRef.current.showPicker) {
                            dateInputRef.current.showPicker();
                        } else {
                            dateInputRef.current.focus();
                            dateInputRef.current.click();
                        }
                    } catch (err) {
                        dateInputRef.current.click();
                    }
                }
            };

            const calendarDays = [];
            for (let i = 0; i < startDay; i++) calendarDays.push(null);
            for (let i = 1; i <= days; i++) calendarDays.push(i);

            const isSelected = (day) => {
                if (!day || !selectedDate) return false;
                const d = new Date(selectedDate);
                return d.getDate() === day && d.getMonth() === month && d.getFullYear() === year;
            };

            const isToday = (day) => {
                if (!day) return false;
                return day === today.getDate() && month === today.getMonth() && year === today.getFullYear();
            };

            const isPast = (day) => {
                if (!day) return false;
                const d = new Date(year, month, day);
                return d < today;
            };

            const getDayEvents = (day) => {
                if (!day) return [];
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                return events.filter(e => e.date === dateStr);
            };

            const hasEvent = (day) => getDayEvents(day).length > 0;

            const hasUnpaidDebt = (day) => {
                if (!day || !isPast(day)) return false;
                const daysEvents = getDayEvents(day);
                if (daysEvents.length === 0) return false;
                return daysEvents.some(ev => !isEventFullyPaid(ev));
            };

            const getDayStatusClasses = (day) => {
                if (!day || isPast(day)) return "";
                const daysEvents = getDayEvents(day);
                if (daysEvents.length === 0) return "";
                
                const hasIncomplete = daysEvents.some(ev => !checkEventCompleteness(ev));
                const hasComplete = daysEvents.some(ev => checkEventCompleteness(ev));

                if (hasIncomplete && hasComplete) return "status-both";
                if (hasIncomplete) return "status-error";
                if (hasComplete) return "status-complete";
                return "";
            };

            return (
                <div ref={calendarRef} className="bg-white p-5 rounded-3xl border-2 border-[#604539] border-l-8 shadow-xl animate-in mb-6">
                    <div className="flex items-center justify-between mb-6">
                        <button 
                            onClick={prevMonth} 
                            className={`calendar-nav-btn w-10 h-10 flex items-center justify-center rounded-xl border-2 transition-all duration-300 font-black text-xl ${hasDebtInHistory ? 'bg-[#fee2e2] border-red-200 text-red-600 animate-pulse' : 'bg-white border-[#60453910] text-[#604539] hover:text-[#C7886B]'}`}
                        >
                            «
                        </button>
                        <div className="text-center">
                            <h3 className="font-black uppercase tracking-[0.2em] text-[#604539] text-sm leading-none">{monthName}</h3>
                            <span className="text-[10px] font-bold opacity-30 tracking-widest">{year}</span>
                        </div>
                        <button 
                            onClick={nextMonth} 
                            className="calendar-nav-btn w-10 h-10 flex items-center justify-center rounded-xl border-2 border-[#60453910] text-[#604539] hover:text-[#C7886B] transition-all duration-300 font-black text-xl"
                        >
                            »
                        </button>
                    </div>
                    <div className="calendar-grid mb-1">
                        {['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].map(d => (
                            <div key={d} className="weekday-header">{d}</div>
                        ))}
                        {calendarDays.map((day, idx) => {
                            const past = isPast(day);
                            const current = isToday(day);
                            const selected = isSelected(day);
                            const hasEv = hasEvent(day);
                            const unpaid = hasUnpaidDebt(day);
                            const statusClasses = getDayStatusClasses(day);

                            return (
                                <div 
                                    key={idx} 
                                    onClick={(e) => {
                                        if (day) {
                                            e.stopPropagation();
                                            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                                            onSelectDate(dateStr);
                                        }
                                    }}
                                    className={`
                                        calendar-day ${!day ? 'invisible' : ''} 
                                        ${unpaid && !selected && !current ? 'has-unpaid-debt' : ''}
                                        ${selected ? 'bg-[#C7886B] text-white font-black scale-110 z-10 selected' : ''}
                                        ${current && !selected ? 'is-today shadow-lg scale-105' : ''}
                                        ${!selected && !current && !unpaid && past ? 'past-date' : ''}
                                        ${!selected && !current && !unpaid && !past ? 'hover:bg-[#FFECD2]' : ''}
                                        ${hasEv ? 'has-event' : ''}
                                        ${statusClasses}
                                    `}
                                >
                                    {day}
                                </div>
                            );
                        })}
                    </div>
                    <div className="mt-4 pt-4 border-t border-[#60453910]">
                        <input 
                            ref={dateInputRef}
                            type="date" 
                            className="hidden-date-input" 
                            onChange={handleJumpDate}
                        />
                        <button 
                            onClick={triggerJump}
                            className="w-full py-2.5 px-4 bg-[#60453908] hover:bg-[#60453915] text-[#604539] rounded-xl flex items-center justify-center gap-2 transition-all border border-[#60453910]"
                        >
                            <Icons.Calendar size={14} />
                            <span className="text-[10px] font-bold uppercase tracking-widest">Перейти к дате</span>
                        </button>
                    </div>
                </div>
            );
        };

        const StaffList = ({ staffDatabase, events, onClose }) => {
            const getStaffPaymentStatus = (name) => {
                const todayStr = new Date().toISOString().split('T')[0];
                
                return events
                    .filter(ev => 
                        ev.staff && 
                        ev.staff.some(s => s.name.toLowerCase() === name.toLowerCase())
                    )
                    .map(ev => {
                        const staffEntry = ev.staff.find(s => s.name.toLowerCase() === name.toLowerCase());
                        const isPast = ev.date < todayStr;
                        
                        const hasUnpaidRole = staffEntry.roles.some(role => 
                            !staffEntry.rolePaid || staffEntry.rolePaid[role] !== true
                        );

                        return {
                            date: ev.date,
                            display: ev.date.split('-').slice(1).reverse().join('.'), 
                            isUnpaid: hasUnpaidRole,
                            isPast: isPast
                        };
                    })
                    .filter(status => !status.isPast || status.isUnpaid)
                    .sort((a, b) => a.date.localeCompare(b.date));
            };

            return (
                <div className="bg-white p-5 rounded-3xl border-2 border-[#604539] border-l-8 shadow-xl animate-in mb-6">
                    <div className="flex items-center justify-between mb-6">
                        <div className="flex items-center gap-2">
                            <Icons.Users size={18} className="text-[#604539]" />
                            <h3 className="font-black uppercase tracking-[0.2em] text-[#604539] text-sm leading-none">Смены сотрудников</h3>
                        </div>
                        <button onClick={onClose} className="p-1.5 text-gray-300 hover:text-red-500 transition-colors"><Icons.X size={20} /></button>
                    </div>
                    <div className="space-y-4 h-auto pr-2">
                        {staffDatabase.sort((a,b) => a.name.localeCompare(b.name)).map((s, idx) => {
                            const eventStatuses = getStaffPaymentStatus(s.name);
                            const hasAnyDebt = eventStatuses.some(status => status.isPast && status.isUnpaid);

                            return (
                                <div key={idx} className={`p-3 rounded-xl border transition-all ${hasAnyDebt ? 'bg-red-50 border-red-200' : 'bg-gray-50 border-[#60453910] hover:border-[#C7886B50]'}`}>
                                    <div className="flex justify-between items-start">
                                        <div className="flex items-center gap-2 min-w-0">
                                            {s.phone && (
                                                <a href={`tel:${s.phone}`} className="shrink-0 p-1.5 bg-[#C7886B20] text-[#C7886B] rounded-lg hover:bg-[#C7886B] hover:text-white transition-all" title={s.phone}>
                                                    <Icons.Phone size={14} />
                                                </a>
                                            )}
                                            <p className={`font-bold text-sm uppercase truncate ${hasAnyDebt ? 'text-red-700' : 'text-[#604539]'}`} onClick={() => window.setActiveStaffScheduleFromList && window.setActiveStaffScheduleFromList(s.name)} style={{cursor:'pointer'}}>
                                                {s.name}
                                            </p>
                                        </div>
                                        {hasAnyDebt && <span className="text-[10px] font-black bg-red-500 text-white px-2 py-0.5 rounded-full animate-pulse shrink-0 ml-2">ЖДЁТ ОПЛАТУ</span>}
                                    </div>
                                    
                                    {eventStatuses.length > 0 ? (
                                        <div className="mt-2 pt-2 border-t border-dashed border-[#60453910]">
                                            <p className="text-[10px] font-black uppercase text-gray-400 mb-1">Актуальные смены:</p>
                                            <div className="flex flex-wrap gap-1">
                                                {eventStatuses.map((status, sIdx) => (
                                                    <span 
                                                        key={sIdx} 
                                                        className={`text-[12px] font-bold px-1.5 py-0.5 rounded ${status.isPast && status.isUnpaid ? 'bg-red-500 text-white' : 'text-gray-500 bg-gray-200/50'}`}
                                                    >
                                                        {status.display}
                                                    </span>
                                                ))}
                                            </div>
                                        </div>
                                    ) : (
                                        <p className="text-[8px] font-black uppercase text-gray-300 mt-2">Нет записей</p>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const AutoHeightTextarea = ({ value, onChange, placeholder, className }) => {
            const textareaRef = useRef(null);

            const adjustHeight = () => {
                const textarea = textareaRef.current;
                if (textarea) {
                    textarea.style.height = 'auto';
                    textarea.style.height = `${textarea.scrollHeight}px`;
                }
            };

            useEffect(() => {
                adjustHeight();
            }, [value]);

            return (
                <textarea 
                    ref={textareaRef}
                    value={value}
                    onChange={(e) => {
                        onChange(e);
                        adjustHeight();
                    }}
                    placeholder={placeholder}
                    className={`${className} auto-textarea`}
                />
            );
        };

        const StaffScheduleModal = ({ staffName, events, onClose, onSelectEvent, todayStr }) => {
            const staffFutureEvents = useMemo(() => {
                return events
                    .filter(ev => ev.date >= todayStr && ev.staff && ev.staff.some(s => s.name.toLowerCase() === staffName.toLowerCase()))
                    .sort((a, b) => a.date.localeCompare(b.date));
            }, [staffName, events, todayStr]);

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-[#1F1713]/80 backdrop-blur-sm">
                    <div className="bg-white w-full max-w-sm rounded-3xl shadow-2xl overflow-hidden border-2 border-[#604539]">
                        <div className="p-4 border-b border-[#60453910] flex items-center justify-between">
                            <div>
                                <h3 className="text-sm font-black uppercase text-[#604539] leading-tight">График работы</h3>
                                <p className="text-[10px] font-bold text-[#C7886B] uppercase tracking-widest mt-0.5">{staffName}</p>
                            </div>
                            <button onClick={onClose} className="p-1.5 bg-gray-50 rounded-lg text-gray-300 hover:text-red-500 transition-colors">
                                <Icons.X size={18} />
                            </button>
                        </div>
                        
                        <div className="p-4 max-h-[50vh] overflow-y-auto custom-scrollbar">
                            {staffFutureEvents.length > 0 ? (
                                <div className="space-y-3">
                                    {staffFutureEvents.map(ev => {
                                        const staffEntry = ev.staff.find(s => s.name.toLowerCase() === staffName.toLowerCase());
                                        return (
                                            <div 
                                                key={ev.id}
                                                onClick={() => onSelectEvent(ev.id)}
                                                className="flex gap-3 p-3 bg-gray-50 rounded-xl border-2 border-transparent hover:border-[#FFECD2] transition-all cursor-pointer group active:scale-[0.98]"
                                            >
                                                <div className="w-10 shrink-0 flex flex-col items-center justify-center border-r-2 border-[#60453910] pr-3 group-hover:border-[#FFECD2]">
                                                    <span className="text-[8px] font-black uppercase text-gray-400">{new Date(ev.date).toLocaleString('ru', { month: 'short' })}</span>
                                                    <span className="text-lg font-black text-[#604539] leading-none">{new Date(ev.date).getDate()}</span>
                                                </div>
                                                <div className="flex-1 min-w-0 flex flex-col justify-center">
                                                    <p className="text-[15px] font-bold uppercase truncate text-[#1F1713] group-hover:text-[#C7886B]">{ev.name}</p>
                                                    <div className="flex items-center gap-2 mt-1.5">
                                                        <div className="flex items-center gap-1.5 text-[13.5px] font-bold text-[#C7886B]">
                                                            <Icons.Clock size={14} />
                                                            <span>{staffEntry.time || '—'}{staffEntry.end ? ` — ${staffEntry.end}` : ''}</span>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            ) : (
                                <div className="py-8 text-center">
                                    <div className="w-12 h-12 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-3 border-2 border-dashed border-gray-100">
                                        <Icons.Calendar size={18} className="text-gray-200" />
                                    </div>
                                    <p className="text-[9px] font-black uppercase tracking-widest text-gray-300">Мероприятий нет</p>
                                </div>
                            )}
                        </div>
                        
                        <div className="p-3 bg-gray-50 border-t border-[#60453910]">
                            <button onClick={onClose} className="w-full py-2.5 bg-[#604539] text-white rounded-xl text-[9px] font-black uppercase tracking-widest">Закрыть</button>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [events, setEvents] = useState([]);
            const [staffDatabase, setStaffDatabase] = useState([]);
            const [commonFiles, setCommonFiles] = useState([]);
            
            const [isOnline, setIsOnline] = useState(navigator.onLine);
            const [syncStatus, setSyncStatus] = useState('idle'); // 'idle' | 'loading' | 'success' | 'error' | 'local'
            const [token, setToken] = useState(localStorage.getItem('gh_token') || '');
            const [isTokenVerified, setIsTokenVerified] = useState(false);
            
            const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);
            const [selectedEventId, setSelectedEventId] = useState(null);
            
            const [isFormOpen, setIsFormOpen] = useState(false);
            const [isStaffFormOpen, setIsStaffFormOpen] = useState(false);
            const [isStaffDbOpen, setIsStaffDbOpen] = useState(false);
            const [isCommonFilesOpen, setIsCommonFilesOpen] = useState(false);
            const [activeStaffScheduleName, setActiveStaffScheduleName] = useState(null);

            const [isUploading, setIsUploading] = useState(false);
            const fileInputRef = useRef(null);
            const commonFileInputRef = useRef(null);

            const [formData, setFormData] = useState({
                id: null, name: '', place: '', start: '', end: '', comment: '', 
                neededStaff: { оф: '0', бар: '0', мой: '0', пов: '0' },
                files: []
            });

            const [staffFormData, setStaffFormData] = useState({ name: '', roles: [], time: '', end: '' });
            const [newStaffDbEntry, setNewStaffDbEntry] = useState({ name: '', phone: '' });

            const calendarRef = useRef(null);
            const todayStr = useMemo(() => {
                const d = new Date();
                d.setHours(0,0,0,0);
                return d.toISOString().split('T')[0];
            }, []);

            useEffect(() => {
                const handleOnline = () => setIsOnline(true);
                const handleOffline = () => setIsOnline(false);

                window.addEventListener('online', handleOnline);
                window.addEventListener('offline', handleOffline);

                return () => {
                    window.removeEventListener('online', handleOnline);
                    window.removeEventListener('offline', handleOffline);
                };
            }, []);

            window.setActiveStaffScheduleFromList = (name) => {
                setActiveStaffScheduleName(name);
            };

            const fetchFromGithub = useCallback(async (tokenToUse) => {
                if (!tokenToUse) {
                    setIsTokenVerified(false);
                    return;
                }

                if (!navigator.onLine) {
                    setSyncStatus('local');
                    const localEv = localStorage.getItem('cached_events');
                    const localStaff = localStorage.getItem('cached_staff');
                    const localFiles = localStorage.getItem('cached_common_files');
                    
                    if (localEv) setEvents(JSON.parse(localEv));
                    if (localStaff) setStaffDatabase(JSON.parse(localStaff));
                    if (localFiles) setCommonFiles(JSON.parse(localFiles));
                    setIsTokenVerified(true);
                    return;
                }

                setSyncStatus('loading');
                try {
                    const res = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}?nocache=${Date.now()}`, {
                        headers: { 'Authorization': `token ${tokenToUse}` }
                    });
                    const staffRes = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.staffPath}?nocache=${Date.now()}`, {
                        headers: { 'Authorization': `token ${tokenToUse}` }
                    }).catch(() => null);
                    const commonFilesRes = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.commonFilesPath}?nocache=${Date.now()}`, {
                        headers: { 'Authorization': `token ${tokenToUse}` }
                    }).catch(() => null);

                    if (res.ok) {
                        const data = await res.json();
                        const content = JSON.parse(decodeURIComponent(escape(atob(data.content))));
                        setEvents(content);
                        localStorage.setItem('cached_events', JSON.stringify(content));

                        if (staffRes && staffRes.ok) {
                            const sData = await staffRes.json();
                            const sContent = JSON.parse(decodeURIComponent(escape(atob(sData.content))));
                            setStaffDatabase(sContent);
                            localStorage.setItem('cached_staff', JSON.stringify(sContent));
                        }
                        if (commonFilesRes && commonFilesRes.ok) {
                            const cData = await commonFilesRes.json();
                            const cContent = JSON.parse(decodeURIComponent(escape(atob(cData.content))));
                            setCommonFiles(cContent);
                            localStorage.setItem('cached_common_files', JSON.stringify(cContent));
                        }
                        
                        setIsTokenVerified(true);
                        setSyncStatus('success');
                        setTimeout(() => setSyncStatus('idle'), 3000);
                    } else {
                        throw new Error("Ошибка загрузки");
                    }
                } catch (err) {
                    setSyncStatus('error');
                    const localEv = localStorage.getItem('cached_events');
                    if (localEv) setEvents(JSON.parse(localEv));
                    const localStaff = localStorage.getItem('cached_staff');
                    if (localStaff) setStaffDatabase(JSON.parse(localStaff));
                    const localFiles = localStorage.getItem('cached_common_files');
                    if (localFiles) setCommonFiles(JSON.parse(localFiles));
                }
            }, []);

            const saveToGithub = useCallback(async (updatedEvents, updatedStaff, updatedCommonFiles) => {
                if (!navigator.onLine) return;
                
                const currentEv = updatedEvents || events;
                const currentStaff = updatedStaff || staffDatabase;
                const currentCommon = updatedCommonFiles || commonFiles;

                localStorage.setItem('cached_events', JSON.stringify(currentEv));
                localStorage.setItem('cached_staff', JSON.stringify(currentStaff));
                localStorage.setItem('cached_common_files', JSON.stringify(currentCommon));

                setSyncStatus('loading');
                try {
                    if (updatedEvents) {
                        await pushFileToGit(GITHUB_CONFIG.path, currentEv);
                    }
                    if (updatedStaff) {
                        await pushFileToGit(GITHUB_CONFIG.staffPath, currentStaff);
                    }
                    if (updatedCommonFiles) {
                        await pushFileToGit(GITHUB_CONFIG.commonFilesPath, currentCommon);
                    }
                    setSyncStatus('success');
                    setTimeout(() => setSyncStatus('idle'), 3000);
                } catch (err) {
                    setSyncStatus('error');
                }
            }, [events, staffDatabase, commonFiles]);

            const pushFileToGit = async (path, jsonContent) => {
                const getShaRes = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${path}`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                let sha = null;
                if (getShaRes.ok) {
                    const shaData = await getShaRes.json();
                    sha = shaData.sha;
                }
                const base64Str = btoa(unescape(encodeURIComponent(JSON.stringify(jsonContent, null, 2))));
                await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${path}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: `Update ${path}`, content: base64Str, sha })
                });
            };

            useEffect(() => {
                if (token) fetchFromGithub(token);
            }, [token, fetchFromGithub]);

            const handleTokenSubmit = (e) => {
                e.preventDefault();
                const raw = e.target.elements.tokenInput.value.trim();
                if (raw) {
                    localStorage.setItem('gh_token', raw);
                    setToken(raw);
                }
            };

            const currentDayEvents = useMemo(() => {
                return events.filter(e => e.date === selectedDate).sort((a,b) => (a.start || '').localeCompare(b.start || ''));
            }, [events, selectedDate]);

            const currentEvent = useMemo(() => {
                return events.find(e => e.id === selectedEventId) || null;
            }, [events, selectedEventId]);

            const handleCreateOrUpdateEvent = (e) => {
                e.preventDefault();
                if (!isOnline) return;

                let updated;
                if (formData.id) {
                    updated = events.map(ev => ev.id === formData.id ? { ...ev, ...formData } : ev);
                } else {
                    const newEv = { ...formData, id: Date.now().toString(), date: selectedDate, staff: [] };
                    updated = [...events, newEv];
                    setSelectedEventId(newEv.id);
                }
                setEvents(updated);
                setIsFormOpen(false);
                setFormData({ id: null, name: '', place: '', start: '', end: '', comment: '', neededStaff: { оф: '0', bar: '0', мой: '0', пов: '0' }, files: [] });
                saveToGithub(updated, null, null);
            };

            const startEditEvent = (e, ev) => {
                if (e) e.stopPropagation();
                setFormData({
                    id: ev.id, name: ev.name, place: ev.place || '', start: ev.start || '', end: ev.end || '', comment: ev.comment || '',
                    neededStaff: ev.neededStaff || { оф: '0', бар: '0', мой: '0', пов: '0' },
                    files: ev.files || []
                });
                setIsFormOpen(true);
            };

            const fastDeleteEvent = (e, id) => {
                e.stopPropagation();
                if (!isOnline) return;
                if (confirm("Удалить мероприятие?")) {
                    const updated = events.filter(ev => ev.id !== id);
                    setEvents(updated);
                    if (selectedEventId === id) setSelectedEventId(null);
                    saveToGithub(updated, null, null);
                }
            };

            const toggleCheckedStatus = () => {
                if (!isOnline || !selectedEventId) return;
                const updated = events.map(ev => {
                    if (ev.id === selectedEventId) {
                        const currentChecked = ev.status?.checked || false;
                        return { ...ev, status: { ...ev.status, checked: !currentChecked } };
                    }
                    return ev;
                });
                setEvents(updated);
                saveToGithub(updated, null, null);
            };

            const toggleRolePaidStatus = (staffId, roleKey) => {
                if (!isOnline || !selectedEventId) return;
                const updated = events.map(ev => {
                    if (ev.id === selectedEventId) {
                        const updatedStaff = ev.staff.map(s => {
                            if (s.id === staffId) {
                                const rolePaid = { ...(s.rolePaid || {}) };
                                rolePaid[roleKey] = !rolePaid[roleKey];
                                return { ...s, rolePaid };
                            }
                            return s;
                        });
                        return { ...ev, staff: updatedStaff };
                    }
                    return ev;
                });
                setEvents(updated);
                saveToGithub(updated, null, null);
            };

            const handleAddStaffToShift = (e) => {
                e.preventDefault();
                if (!isOnline || !selectedEventId) return;
                
                if (!staffFormData.name.trim() || staffFormData.roles.length === 0) {
                    alert("Укажите имя и выберите роль");
                    return;
                }

                const existingDb = staffDatabase.find(x => x.name.toLowerCase() === staffFormData.name.trim().toLowerCase());
                let updatedDb = null;
                if (!existingDb) {
                    const newPerson = { name: staffFormData.name.trim(), phone: '' };
                    updatedDb = [...staffDatabase, newPerson];
                    setStaffDatabase(updatedDb);
                }

                const newStaffShift = {
                    id: Date.now().toString(),
                    name: staffFormData.name.trim(),
                    roles: staffFormData.roles,
                    time: staffFormData.time || currentEvent?.start || '',
                    end: staffFormData.end || currentEvent?.end || '',
                    rolePaid: staffFormData.roles.reduce((acc, r) => ({ ...acc, [r]: false }), {})
                };

                const updatedEvents = events.map(ev => {
                    if (ev.id === selectedEventId) {
                        const list = ev.staff || [];
                        return { ...ev, staff: [...list, newStaffShift] };
                    }
                    return ev;
                });

                setEvents(updatedEvents);
                setIsStaffFormOpen(false);
                setStaffFormData({ name: '', roles: [], time: '', end: '' });
                saveToGithub(updatedEvents, updatedDb, null);
            };

            const handleAddStaffToDbOnly = (e) => {
                e.preventDefault();
                if (!isOnline) return;
                if (!newStaffDbEntry.name.trim()) return;
                
                const exists = staffDatabase.some(x => x.name.toLowerCase() === newStaffDbEntry.name.trim().toLowerCase());
                if (exists) {
                    alert("Такой сотрудник уже есть");
                    return;
                }

                const updated = [...staffDatabase, { name: newStaffDbEntry.name.trim(), phone: formatOnlyNumbers(newStaffDbEntry.phone) }];
                setStaffDatabase(updated);
                setNewStaffDbEntry({ name: '', phone: '' });
                saveToGithub(null, updated, null);
            };

            const handleDeleteStaffFromDb = (name) => {
                if (!isOnline) return;
                if (confirm(`Удалить ${name} из базы навсегда?`)) {
                    const updated = staffDatabase.filter(x => x.name !== name);
                    setStaffDatabase(updated);
                    saveToGithub(null, updated, null);
                }
            };

            const handleFileUpload = async (e, type) => {
                const file = e.target.files[0];
                if (!file || !isOnline) return;

                setIsUploading(true);
                try {
                    const reader = new FileReader();
                    reader.onloadend = async () => {
                        const base64Data = reader.result.split(',')[1];
                        const folder = type === 'common' ? 'global' : selectedEventId;
                        const finalPath = `files/${folder}/${Date.now()}_${encodeURIComponent(file.name)}`;
                        
                        const uploadRes = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${finalPath}`, {
                            method: 'PUT',
                            headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                            body: JSON.stringify({ message: `Upload file ${file.name}`, content: base64Data })
                        });

                        if (uploadRes.ok) {
                            const resJson = await uploadRes.json();
                            const fileObj = { name: file.name, path: finalPath, download_url: resJson.content.download_url };

                            if (type === 'common') {
                                const updatedCommon = [...commonFiles, fileObj];
                                setCommonFiles(updatedCommon);
                                saveToGithub(null, null, updatedCommon);
                            } else {
                                const updatedEvents = events.map(ev => {
                                    if (ev.id === selectedEventId) {
                                        const fList = ev.files || [];
                                        return { ...ev, files: [...fList, fileObj] };
                                    }
                                    return ev;
                                });
                                setEvents(updatedEvents);
                                saveToGithub(updatedEvents, null, null);
                            }
                        } else {
                            alert("Не удалось загрузить файл");
                        }
                        setIsUploading(false);
                    };
                    reader.readAsDataURL(file);
                } catch (err) {
                    alert("Ошибка загрузки");
                    setIsUploading(false);
                }
            };

            const handleFileDelete = async (fileObj, type) => {
                if (!isOnline) return;
                if (!confirm(`Удалить файл ${fileObj.name}?`)) return;

                try {
                    const getShaRes = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${fileObj.path}`, {
                        headers: { 'Authorization': `token ${token}` }
                    });
                    if (getShaRes.ok) {
                        const shaData = await getShaRes.json();
                        await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${fileObj.path}`, {
                            method: 'DELETE',
                            headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                            body: JSON.stringify({ message: `Delete file ${fileObj.name}`, sha: shaData.sha })
                        });
                    }

                    if (type === 'common') {
                        const updatedCommon = commonFiles.filter(f => f.path !== fileObj.path);
                        setCommonFiles(updatedCommon);
                        saveToGithub(null, null, updatedCommon);
                    } else {
                        const updatedEvents = events.map(ev => {
                            if (ev.id === selectedEventId) {
                                const fList = ev.files || [];
                                return { ...ev, files: fList.filter(f => f.path !== fileObj.path) };
                            }
                            return ev;
                        });
                        setEvents(updatedEvents);
                        saveToGithub(updatedEvents, null, null);
                    }
                } catch (err) {
                    alert("Ошибка удаления файла");
                }
            };

            const handleFileDownload = (fileObj) => {
                window.open(fileObj.download_url, '_blank');
            };

            const formattedHeaderDate = useMemo(() => {
                const d = new Date(selectedDate);
                const day = d.getDate();
                const month = d.toLocaleString('ru', { month: 'long' });
                const weekday = d.toLocaleString('ru', { weekday: 'long' });
                return { day, month: month.toUpperCase(), weekday: weekday.toUpperCase() };
            }, [selectedDate]);

            if (!isTokenVerified) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <form onSubmit={handleTokenSubmit} className="bg-white p-6 rounded-3xl border-2 border-[#604539] w-full max-w-sm shadow-xl">
                            <h2 className="font-black text-xs uppercase tracking-widest text-[#604539] mb-4 text-center">Авторизация</h2>
                            <input 
                                type="password" 
                                name="tokenInput"
                                placeholder="GitHub Личный Токен" 
                                defaultValue={token}
                                className="w-full px-4 py-3 rounded-xl border-2 border-gray-100 outline-none focus:border-[#C7886B] font-bold text-sm mb-4 text-center transition-all"
                            />
                            <button className="w-full py-3.5 bg-[#604539] text-white rounded-xl font-black text-xs uppercase tracking-widest active:scale-[0.98] transition-all">Войти</button>
                        </form>
                    </div>
                );
            }

            return (
                <div className="max-w-md mx-auto px-4 pt-4 pb-24">
                    {/* ХЕДЕР */}
                    <div className="flex justify-between items-center mb-6 bg-white py-3 px-5 rounded-2xl border border-[#60453910] shadow-sm">
                        <div className="flex items-center gap-2">
                            <span className="font-black tracking-[0.2em] text-[#604539] text-xs">АДМИНПАНЕЛЬ</span>
                        </div>
                        <div className={`sync-status ${
                            !isOnline || syncStatus === 'local' ? 'sync-local' :
                            syncStatus === 'loading' ? 'sync-loading' : 
                            syncStatus === 'success' ? 'sync-success' : 
                            syncStatus === 'error' ? 'sync-error' : 'sync-idle'
                        }`}>
                            {(syncStatus === 'loading' && isOnline) && <Icons.Refresh size={10} className="spin-slow" />}
                            <span>{
                                !isOnline || syncStatus === 'local' ? 'ЛОКАЛЬНО' :
                                syncStatus === 'loading' ? 'ЗАГРУЗКА...' : 
                                syncStatus === 'success' ? 'ОБНОВЛЕНО' : 
                                syncStatus === 'error' ? 'ОШИБКА' : 'ГОТОВО'
                            }</span>
                        </div>
                    </div>

                    {/* БЛОК ДАТЫ */}
                    <div className="bg-[#604539] text-white p-6 rounded-3xl shadow-xl flex justify-between items-center mb-6 border border-white/10 relative overflow-hidden">
                        <div>
                            <p className="text-[10px] font-black tracking-[0.3em] opacity-40 leading-none mb-1">{formattedHeaderDate.weekday}</p>
                            <div className="flex items-baseline gap-2">
                                <h1 className="text-4xl font-black tracking-tight leading-none">{formattedHeaderDate.day}</h1>
                                <span className="text-xs font-black tracking-widest opacity-80">{formattedHeaderDate.month}</span>
                            </div>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={() => setIsCommonFilesOpen(true)} className="w-10 h-10 flex items-center justify-center bg-white/10 hover:bg-white/15 rounded-xl border border-white/10 transition-all text-white"><Icons.Paperclip size={18} /></button>
                            <button onClick={() => setIsStaffDbOpen(true)} className="w-10 h-10 flex items-center justify-center bg-white/10 hover:bg-white/15 rounded-xl border border-white/10 transition-all text-white"><Icons.Users size={18} /></button>
                        </div>
                    </div>

                    {/* КАЛЕНДАРЬ */}
                    <Calendar events={events} onSelectDate={(d) => { setSelectedDate(d); setSelectedEventId(null); }} selectedDate={selectedDate} calendarRef={calendarRef} />

                    {/* СПИСОК МЕРОПРИЯТИЙ НА ВЫБРАННЫЙ ДЕНЬ */}
                    <div className="space-y-3 mb-6">
                        <h2 className="text-[10px] font-black uppercase tracking-[0.2em] text-[#604539] opacity-50 ml-1">Мероприятия дня ({currentDayEvents.length})</h2>
                        {currentDayEvents.length > 0 ? (
                            currentDayEvents.map(ev => {
                                const isComplete = checkEventCompleteness(ev);
                                const isPaid = isEventFullyPaid(ev);
                                const isPastDate = ev.date < todayStr;
                                const counts = getStaffCounts(ev);

                                return (
                                    <div 
                                        key={ev.id}
                                        onClick={() => setSelectedEventId(ev.id === selectedEventId ? null : ev.id)}
                                        className={`p-4 bg-white rounded-2xl border-2 transition-all duration-300 cursor-pointer shadow-sm relative overflow-hidden group active:scale-[0.99] ${ev.id === selectedEventId ? 'border-[#C7886B] ring-4 ring-[#C7886B10]' : 'border-[#60453908] hover:border-[#60453920]'}`}
                                    >
                                        <div className="flex justify-between items-start gap-3">
                                            <div className="min-w-0 flex-1">
                                                <div className="flex items-center gap-2 mb-1.5 flex-wrap">
                                                    <div className="flex items-center gap-1 text-[11px] font-black text-[#C7886B]">
                                                        <Icons.Clock size={12} />
                                                        <span>{ev.start || '—'}</span>
                                                    </div>
                                                    {ev.place && (
                                                        <div className="flex items-center gap-1 text-[11px] font-bold text-gray-400 min-w-0">
                                                            <Icons.MapPin size={11} className="shrink-0" />
                                                            <span className="truncate">{ev.place}</span>
                                                        </div>
                                                    )}
                                                </div>
                                                <h3 className="font-black text-base text-[#1F1713] uppercase tracking-wide group-hover:text-[#C7886B] transition-colors leading-tight">{ev.name}</h3>
                                            </div>
                                            
                                            <div className="flex items-center gap-1 shrink-0">
                                                {isPastDate ? (
                                                    <div className={`p-1.5 rounded-xl ${isPaid ? 'bg-green-50 text-green-600' : 'bg-red-50 text-red-500 animate-pulse'}`}>
                                                        {isPaid ? <Icons.Check size={16} /> : <Icons.Clock size={16} />}
                                                    </div>
                                                ) : (
                                                    <div className={`p-1.5 rounded-xl ${isComplete ? 'bg-green-50 text-green-600' : 'bg-red-50 text-red-400'}`}>
                                                        {isComplete ? <Icons.DoubleCheck size={16} color="currentColor" /> : <Icons.User size={16} color="currentColor" />}
                                                    </div>
                                                )}
                                            </div>
                                        </div>

                                        {/* Счётчики персонала кратко */}
                                        <div className="flex gap-2 mt-3 pt-2.5 border-t border-gray-50 text-[10px] font-extrabold uppercase text-gray-400 tracking-wider">
                                            {['оф', 'бар', 'мой', 'пов'].map(rk => {
                                                const label = keyToLabel[rk];
                                                const need = parseInt(ev.neededStaff?.[rk] || 0);
                                                const currentCount = counts[label] || 0;
                                                if (need === 0 && currentCount === 0) return null;
                                                const isOk = currentCount >= need;
                                                return (
                                                    <span key={rk} className={isOk ? 'text-gray-500' : 'text-red-500 font-black'}>
                                                        {rk}:{currentCount}/{need}
                                                    </span>
                                                );
                                            })}
                                        </div>
                                    </div>
                                );
                            })
                        ) : (
                            <div className="py-12 text-center bg-white/40 rounded-2xl border-2 border-dashed border-[#60453910]">
                                <p className="text-[10px] font-black text-gray-400 uppercase tracking-widest">Нет мероприятий</p>
                            </div>
                        )}
                    </div>

                    {/* КНОПКА ДОБАВЛЕНИЯ МЕРОПРИЯТИЯ */}
                    {!isFormOpen && (
                        <button 
                            disabled={!isOnline}
                            onClick={() => setIsFormOpen(true)}
                            className="w-full py-4 bg-[#604539] text-white rounded-2xl uppercase font-black text-xs tracking-widest shadow-lg active:scale-[0.99] transition-all disabled:opacity-40 disabled:pointer-events-none"
                        >
                            Добавить мероприятие
                        </button>
                    )}

                    {/*ДЕТАЛИ ВЫБРАННОГО МЕРОПРИЯТИЯ */}
                    {currentEvent && !isFormOpen && (
                        <div className="mt-6 bg-white p-5 rounded-3xl border-2 border-[#604539] shadow-xl animate-in">
                            <div className="flex justify-between items-start gap-4 mb-4 pb-4 border-b border-[#60453910]">
                                <div className="min-w-0 flex-1">
                                    <div className="flex items-center gap-2 mb-1 flex-wrap">
                                        <span className="text-[10px] font-black bg-[#FFECD2] text-[#604539] px-2 py-0.5 rounded-md uppercase tracking-wider">{currentEvent.start || '—'} {currentEvent.end ? ` - ${currentEvent.end}` : ''}</span>
                                        {currentEvent.place && <span className="text-[10px] font-bold text-gray-400 truncate max-w-[180px]">{currentEvent.place}</span>}
                                    </div>
                                    <h2 className="text-xl font-black text-[#1F1713] uppercase leading-tight tracking-wide">{currentEvent.name}</h2>
                                </div>
                                <div className="flex gap-1 bg-gray-100 p-1 rounded-2xl shrink-0">
                                    <button 
                                        disabled={!isOnline}
                                        onClick={() => startEditEvent(null, currentEvent)} 
                                        className="text-[#604539] p-2 disabled:opacity-40 disabled:pointer-events-none"
                                    >
                                        <Icons.Edit size={20} />
                                    </button>
                                    <button 
                                        disabled={!isOnline}
                                        onClick={(e) => fastDeleteEvent(e, selectedEventId)} 
                                        className="text-red-400 p-2 disabled:opacity-40 disabled:pointer-events-none"
                                    >
                                        <Icons.Trash size={20} />
                                    </button>
                                </div>
                            </div>

                            {/* Комментарий */}
                            {currentEvent.comment && (
                                <div className="mb-5 bg-gray-50 p-3.5 rounded-xl border border-gray-100">
                                    <p className="text-[9px] font-black uppercase text-gray-400 tracking-wider mb-1">Комментарий к заказу:</p>
                                    <p className="text-sm text-[#1F1713] font-medium whitespace-pre-wrap leading-relaxed">{currentEvent.comment}</p>
                                </div>
                            )}

                            {/* Смена / Персонал */}
                            <div className="mb-6">
                                <div className="flex justify-between items-center mb-3">
                                    <h3 className="text-xs font-black uppercase tracking-wider text-[#604539]">Смена персонала</h3>
                                    <button 
                                        disabled={!isOnline}
                                        onClick={() => setIsStaffFormOpen(true)}
                                        className="px-3 py-1.5 bg-[#604539] text-white rounded-lg text-[10px] font-black uppercase tracking-widest flex items-center gap-1 disabled:opacity-40 disabled:pointer-events-none"
                                    >
                                        <Icons.Plus size={12} /> Персонал
                                    </button>
                                </div>

                                <div className="overflow-hidden border border-gray-100 rounded-2xl">
                                    <table className="staff-table bg-white text-left text-xs">
                                        <thead>
                                            <tr className="bg-gray-50 text-[9px] font-black text-gray-400 uppercase tracking-wider border-b border-gray-100">
                                                <th className="col-staff py-2.5 px-3">Сотрудник / Роль</th>
                                                <th className="col-timing py-2.5 px-1 text-center">Время</th>
                                                <th className="col-actions py-2.5 pr-3 text-right">Статус</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-gray-50 font-semibold text-[#1F1713]">
                                            {currentEvent.staff && currentEvent.staff.length > 0 ? (
                                                currentEvent.staff.map(s => {
                                                    const dbPerson = staffDatabase.find(x => x.name.toLowerCase() === s.name.toLowerCase());
                                                    return (
                                                        <tr key={s.id} className="hover:bg-gray-50/50 transition-colors">
                                                            <td className="py-3 px-3 min-w-0">
                                                                <div className="flex flex-col min-w-0">
                                                                    <div className="flex items-center gap-1.5 min-w-0">
                                                                        {dbPerson?.phone && (
                                                                            <a href={`tel:${dbPerson.phone}`} className="p-1 bg-gray-100 text-gray-400 rounded hover:bg-[#C7886B] hover:text-white shrink-0">
                                                                                <Icons.Phone size={10} />
                                                                            </a>
                                                                        )}
                                                                        <span className="truncate text-sm font-bold uppercase">{s.name}</span>
                                                                    </div>
                                                                    <div className="flex flex-wrap gap-1 mt-1">
                                                                        {s.roles.map(r => {
                                                                            const isPaid = s.rolePaid?.[r] || false;
                                                                            return (
                                                                                <span 
                                                                                    key={r}
                                                                                    onClick={() => { if(!isOnline) return; toggleRolePaidStatus(s.id, r); }}
                                                                                    className={`role-badge ${isPaid ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'} ${!isOnline ? 'disabled:pointer-events-none disabled:opacity-50' : ''}`}
                                                                                >
                                                                                    {r} {isPaid ? '✓' : '×'}
                                                                                </span>
