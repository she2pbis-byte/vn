                                                                                    <span className="text-xs font-bold text-gray-600 file-name-text">{file.name}</span>
                                                                                </div>
                                                                            </div>
                                                                            <button onClick={() => handleFileDownload(file)} className="w-8 h-8 flex items-center justify-center bg-gray-50 rounded-lg text-gray-400 hover:text-[#604539] ml-2 shrink-0"><Icons.ExternalLink size={14} /></button>
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            </div>
                                                        )}

                                                        <div className="space-y-1.5">
                                                            <div className="flex justify-between items-center px-1">
                                                                <p className="text-[9px] uppercase font-black tracking-widest text-gray-400">Персонал на смене</p>
                                                                <div className="text-[9px] font-black text-gray-400 uppercase flex gap-2">
                                                                    {['оф', 'бар', 'мой', 'пов'].map(rk => {
                                                                        const target = parseInt(ev.neededStaff?.[rk] || 0);
                                                                        if (target === 0) return null;
                                                                        return <span key={rk} className={counts[keyToLabel[rk]] >= target ? "text-green-600" : "text-amber-600"}>{rk.toUpperCase()}:{counts[keyToLabel[rk]]}/{target}</span>;
                                                                    })}
                                                                </div>
                                                            </div>

                                                            {ev.staff && ev.staff.length > 0 ? (
                                                                <div className="bg-white rounded-2xl border border-[#60453910] divide-y divide-gray-50 overflow-hidden shadow-sm">
                                                                    <table className="staff-table text-left">
                                                                        <tbody>
                                                                            {ev.staff.map(s => {
                                                                                const dbPerson = staffDatabase.find(p => p.name.toLowerCase() === s.name.toLowerCase());
                                                                                return (
                                                                                    <tr key={s.id} className="hover:bg-gray-50/50">
                                                                                        <td className="col-staff py-2.5 pl-3 min-w-0">
                                                                                            <div className="flex items-center gap-1.5 min-w-0">
                                                                                                {dbPerson?.phone && (
                                                                                                    <a href={`tel:${dbPerson.phone}`} className="p-1 bg-[#C7886B15] text-[#C7886B] rounded-md hover:bg-[#C7886B] hover:text-white transition-all shrink-0">
                                                                                                        <Icons.Phone size={10} />
                                                                                                    </a>
                                                                                                )}
                                                                                                <p className="text-xs font-black uppercase text-[#1F1713] truncate">{s.name}</p>
                                                                                            </div>
                                                                                            <div className="flex flex-wrap gap-1 mt-1 pl-0.5">
                                                                                                {s.roles.map(r => {
                                                                                                    const isPaid = s.rolePaid && s.rolePaid[r] === true;
                                                                                                    return (
                                                                                                        <span 
                                                                                                            key={r} 
                                                                                                            className={`text-[9px] font-black uppercase px-1.5 py-0.5 rounded ${
                                                                                                                isPaid 
                                                                                                                    ? 'bg-green-100 text-green-700 border border-green-200' 
                                                                                                                    : showArchive ? 'bg-red-500 text-white' : 'bg-gray-100 text-gray-500'
                                                                                                            }`}
                                                                                                        >
                                                                                                            {r}
                                                                                                        </span>
                                                                                                    );
                                                                                                })}
                                                                                            </div>
                                                                                        </td>
                                                                                        <td className="col-timing py-2.5 text-center">
                                                                                            <p className="text-xs font-bold text-[#C7886B] whitespace-nowrap">{s.time || '—'}</p>
                                                                                            {s.end && <p className="text-[10px] font-bold text-gray-400 whitespace-nowrap mt-0.5">до {s.end}</p>}
                                                                                        </td>
                                                                                        <td className="col-actions py-2.5 pr-3 text-right">
                                                                                            <div className="inline-flex items-center gap-1 bg-gray-50 p-1 rounded-lg border border-gray-100">
                                                                                                {ev.status?.checked ? (
                                                                                                    <div className="w-6 h-6 flex items-center justify-center text-green-600"><Icons.Check size={14} /></div>
                                                                                                ) : (
                                                                                                    <div className="w-6 h-6 flex items-center justify-center text-gray-300"><Icons.Clock size={14} /></div>
                                                                                                )}
                                                                                            </div>
                                                                                        </td>
                                                                                    </tr>
                                                                                );
                                                                            })}
                                                                        </tbody>
                                                                    </table>
                                                                </div>
                            ) : (
                                                                <div className="py-4 text-center text-gray-300 bg-white rounded-2xl border border-dashed border-gray-100 text-[10px] uppercase font-black tracking-wider">Персонал не назначен</div>
                                                            )}
                                                        </div>

                                                        <div className="flex gap-2 pt-2">
                                                            <button 
                                                                onClick={() => handleOpenForm(ev)}
                                                                className="flex-1 py-2.5 bg-[#604539] hover:bg-[#C7886B] text-white rounded-xl text-[10px] font-black uppercase tracking-widest transition-colors flex items-center justify-center gap-1.5"
                                                            >
                                                                <Icons.Edit size={14} /> Редактировать
                                                            </button>
                                                            <button 
                                                                onClick={() => handleDeleteEvent(ev.id)}
                                                                className="py-2.5 px-4 bg-red-50 hover:bg-red-100 text-red-500 border border-red-100 rounded-xl transition-colors"
                                                            >
                                                                <Icons.Trash />
                                                            </button>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            )}

                            {isFormOpen && (
                                <div ref={eventFormRef} className="bg-white p-5 rounded-3xl border-2 border-[#C7886B] border-l-8 shadow-xl mb-6 animate-in space-y-4">
                                    <div className="flex justify-between items-center border-b border-gray-100 pb-3">
                                        <h3 className="font-black uppercase tracking-wider text-[#604539] text-sm">Мероприятие</h3>
                                        <button onClick={() => setIsFormOpen(false)} className="text-gray-300 hover:text-red-500"><Icons.X size={20} /></button>
                                    </div>

                                    <div className="space-y-3">
                                        <div>
                                            <p className="text-[9px] uppercase font-bold mb-1 opacity-40 ml-1">Название проекта *</p>
                                            <input type="text" value={eventForm.name} onChange={(e) => setEventForm({ ...eventForm, name: e.target.value })} placeholder="Введите название..." className="w-full py-2.5 px-3 rounded-xl border-2 border-[#60453920] text-sm font-bold outline-none focus:border-[#C7886B] transition-all" />
                                        </div>

                                        <div className="flex gap-2">
                                            <div className="flex-1">
                                                <p className="text-[9px] uppercase font-bold mb-1 opacity-40 ml-1">Дата *</p>
                                                <input type="date" value={eventForm.date} onChange={(e) => setEventForm({ ...eventForm, date: e.target.value })} className="w-full py-2 px-2 rounded-xl border-2 border-[#60453920] text-sm font-bold outline-none focus:border-[#C7886B] transition-all" />
                                            </div>
                                            <SimpleTimePicker colors={colors} label="Начало *" value={eventForm.start} onChange={(time) => setEventForm({ ...eventForm, start: time })} />
                                            <SimpleTimePicker colors={colors} label="Конец" value={eventForm.end} onChange={(time) => setEventForm({ ...eventForm, end: time })} />
                                        </div>

                                        <div>
                                            <p className="text-[9px] uppercase font-bold mb-1 opacity-40 ml-1">Место проведения *</p>
                                            <input type="text" value={eventForm.location} onChange={(e) => setEventForm({ ...eventForm, location: e.target.value })} placeholder="Локация..." className="w-full py-2.5 px-3 rounded-xl border-2 border-[#60453920] text-sm font-bold outline-none focus:border-[#C7886B] transition-all" />
                                        </div>

                                        <div className="flex gap-2">
                                            <div className="flex-1 relative">
                                                <p className="text-[9px] uppercase font-bold mb-1 opacity-40 ml-1">Формат</p>
                                                <input 
                                                    type="text" 
                                                    value={eventForm.format} 
                                                    onChange={(e) => setEventForm({ ...eventForm, format: e.target.value })} 
                                                    onFocus={() => setShowFormatSuggestions(true)}
                                                    onBlur={() => setTimeout(() => setShowFormatSuggestions(false), 200)}
                                                    placeholder="Формат..." 
                                                    className="w-full py-2.5 px-3 rounded-xl border-2 border-[#60453920] text-sm font-bold outline-none focus:border-[#C7886B] transition-all" 
                                                />
                                                {showFormatSuggestions && (
                                                    <div className="autocomplete-list custom-scrollbar">
                                                        {formats.filter(f => f.toLowerCase().includes(eventForm.format.toLowerCase())).map(f => (
                                                            <div key={f} onMouseDown={() => setEventForm({ ...eventForm, format: f })} className="autocomplete-item font-bold text-gray-600">{f}</div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>

                                            <div className="flex-1 relative">
                                                <p className="text-[9px] uppercase font-bold mb-1 opacity-40 ml-1">Администратор</p>
                                                <input 
                                                    type="text" 
                                                    value={eventForm.admin} 
                                                    onChange={(e) => setEventForm({ ...eventForm, admin: e.target.value })} 
                                                    onFocus={() => setShowAdminSuggestions(true)}
                                                    onBlur={() => setTimeout(() => setShowAdminSuggestions(false), 200)}
                                                    placeholder="Имя..." 
                                                    className="w-full py-2.5 px-3 rounded-xl border-2 border-[#60453920] text-sm font-bold outline-none focus:border-[#C7886B] transition-all" 
                                                />
                                                {showAdminSuggestions && (
                                                    <div className="autocomplete-list custom-scrollbar">
                                                        {admins.filter(a => a.toLowerCase().includes(eventForm.admin.toLowerCase())).map(a => (
                                                            <div key={a} onMouseDown={() => setEventForm({ ...eventForm, admin: a })} className="autocomplete-item font-bold text-gray-600">{a}</div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        </div>

                                        <div>
                                            <p className="text-[9px] uppercase font-bold mb-1 opacity-40 ml-1">Комментарий к заявке</p>
                                            <AutoHeightTextarea value={eventForm.comment} onChange={(e) => setEventForm({ ...eventForm, comment: e.target.value })} placeholder="Дополнительная информация, меню, контакты..." className="w-full py-2.5 px-3 rounded-xl border-2 border-[#60453920] text-sm font-bold outline-none focus:border-[#C7886B] transition-all" />
                                        </div>

                                        <div>
                                            <p className="text-[9px] uppercase font-bold mb-1 opacity-40 ml-1">Файлы мероприятия ({eventForm.files?.length || 0})</p>
                                            <div className="flex gap-2 items-center">
                                                <input ref={fileInputRef} type="file" multiple onChange={(e) => handleFileUpload(e, 'event')} className="hidden" />
                                                <button disabled={isUploading} onClick={() => fileInputRef.current.click()} className="flex-1 py-2.5 px-3 bg-gray-50 border-2 border-dashed border-[#60453920] hover:border-[#C7886B] rounded-xl text-xs font-bold text-gray-500 transition-colors flex items-center justify-center gap-2">
                                                    <Icons.Paperclip size={14} /> {isUploading ? 'Загрузка...' : 'Выбрать файлы'}
                                                </button>
                                            </div>
                                            {eventForm.files && eventForm.files.length > 0 && (
                                                <div className="mt-2 space-y-1">
                                                    {eventForm.files.map(file => (
                                                        <div key={file.id} className="flex items-center justify-between p-2 bg-gray-50 rounded-xl border border-gray-100 min-w-0">
                                                            <span className="text-[11px] font-bold text-gray-500 truncate pl-1 flex-1 min-w-0">{file.name}</span>
                                                            <div className="flex items-center gap-1 shrink-0 ml-2">
                                                                <button onClick={() => handleFileDownload(file)} className="w-7 h-7 flex items-center justify-center bg-white rounded-lg border text-gray-400 hover:text-[#604539]"><Icons.ExternalLink size={12} /></button>
                                                                <button onClick={() => handleFileDelete(file, 'event')} className="w-7 h-7 flex items-center justify-center bg-white rounded-lg border text-gray-300 hover:text-red-500"><Icons.Trash /></button>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>

                                        <div className="bg-[#FFECD2]/30 p-3 rounded-2xl border border-[#60453910]">
                                            <p className="text-[10px] uppercase font-black tracking-widest text-[#604539] mb-2 text-center">Потребность в персонале</p>
                                            <div className="grid grid-cols-4 gap-2">
                                                {['оф', 'бар', 'мой', 'пов'].map(roleKey => (
                                                    <div key={roleKey} className="text-center">
                                                        <span className="text-[10px] font-black uppercase text-[#604539]">{roleKey}</span>
                                                        <input 
                                                            type="number" 
                                                            inputMode="numeric"
                                                            pattern="[0-9]*"
                                                            value={eventForm.neededStaff[roleKey]} 
                                                            onChange={(e) => setEventForm({
                                                                ...eventForm,
                                                                neededStaff: { ...eventForm.neededStaff, [roleKey]: formatOnlyNumbers(e.target.value) }
                                                            })}
                                                            className="w-full mt-1 py-1.5 bg-white rounded-lg border-2 border-[#60453910] text-center text-sm font-black text-[#604539]" 
                                                        />
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        <div className="space-y-2">
                                            <p className="text-[10px] uppercase font-black tracking-widest text-[#604539] ml-1">Назначенный персонал ({eventForm.staff.length})</p>
                                            
                                            <div className="relative">
                                                <input 
                                                    type="text" 
                                                    placeholder="Поиск сотрудника для добавления..." 
                                                    onFocus={() => setShowSuggestions(true)}
                                                    onBlur={() => setTimeout(() => setShowSuggestions(false), 200)}
                                                    onChange={(e) => {
                                                        const val = e.target.value.toLowerCase();
                                                        setShowSuggestions(true);
                                                        const el = document.getElementById('suggestions-box');
                                                        if(el) {
                                                            const items = el.getElementsByClassName('autocomplete-item');
                                                            for(let i=0; i<items.length; i++) {
                                                                const txt = items[i].textContent.toLowerCase();
                                                                items[i].style.display = txt.includes(val) ? 'block' : 'none';
                                                            }
                                                        }
                                                    }}
                                                    className="w-full py-2.5 px-3 rounded-xl border-2 border-[#60453920] text-sm font-bold outline-none focus:border-[#C7886B] transition-all"
                                                />
                                                {showSuggestions && availableStaffSuggestions.length > 0 && (
                                                    <div id="suggestions-box" className="autocomplete-list custom-scrollbar">
                                                        {availableStaffSuggestions.sort((a,b) => a.name.localeCompare(b.name)).map(p => (
                                                            <div key={p.id} onMouseDown={() => handleAddStaffToEvent(p)} className="autocomplete-item font-black text-[#604539] flex justify-between items-center">
                                                                <span>{p.name}</span>
                                                                <span className="text-[9px] text-gray-400 font-bold">{p.phone}</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>

                                            {eventForm.staff.length > 0 && (
                                                <div className="border border-gray-100 rounded-2xl bg-gray-50/50 p-2 space-y-1.5 max-h-[260px] overflow-y-auto custom-scrollbar">
                                                    {eventForm.staff.map(s => (
                                                        <div key={s.id} className="bg-white p-2.5 rounded-xl border border-gray-100 shadow-sm space-y-2">
                                                            <div className="flex justify-between items-center">
                                                                <span className="text-xs font-black uppercase text-[#1F1713] truncate max-w-[180px]">{s.name}</span>
                                                                <button onClick={() => handleRemoveStaffFromEvent(s.id)} className="text-gray-300 hover:text-red-500 p-1"><Icons.X size={16} /></button>
                                                            </div>
                                                            <div className="flex flex-wrap gap-1">
                                                                {['оф', 'бар', 'мой', 'пов'].map(role => {
                                                                    const hasRole = s.roles.includes(role);
                                                                    const isPaid = s.rolePaid && s.rolePaid[role] === true;

                                                                    return (
                                                                        <div key={role} className="inline-flex items-center shrink-0">
                                                                            <span 
                                                                                onClick={() => handleStaffRoleChange(s.id, role)}
                                                                                className={`role-badge ${hasRole ? 'bg-[#604539] text-white' : 'bg-gray-100 text-gray-400 opacity-60'}`}
                                                                            >
                                                                                {role.toUpperCase()}
                                                                            </span>
                                                                            {hasRole && (
                                                                                <button 
                                                                                    onClick={() => handleRolePaidToggle(s.id, role)}
                                                                                    className={`ml-0.5 p-1 rounded-md transition-colors ${isPaid ? 'bg-green-100 text-green-700' : 'bg-red-50 text-red-500 border border-red-100'}`}
                                                                                    title={isPaid ? "Оплачено" : "Не оплачено"}
                                                                                >
                                                                                    <Icons.Check size={10} color={isPaid ? "#16a34a" : "#dc2626"} />
                                                                                </button>
                                                                            )}
                                                                        </div>
                                                                    );
                                                                })}
                                                            </div>
                                                            <div className="flex gap-2">
                                                                <SimpleTimePicker colors={colors} label="Выход" value={s.time} onChange={(val) => handleStaffTimeChange(s.id, 'time', val)} />
                                                                <SimpleTimePicker colors={colors} label="Окончание" value={s.end} onChange={(val) => handleStaffTimeChange(s.id, 'end', val)} />
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>

                                        <div className="pt-3 border-t border-gray-100 flex items-center justify-between">
                                            <label className="flex items-center gap-2 cursor-pointer select-none">
                                                <input 
                                                    type="checkbox" 
                                                    checked={eventForm.status?.checked || false} 
                                                    onChange={(e) => setEventForm({
                                                        ...eventForm,
                                                        status: { ...(eventForm.status || {}), checked: e.target.checked }
                                                    })}
                                                    className="w-4 h-4 rounded border-[#60453920] text-[#604539] focus:ring-[#C7886B]" 
                                                />
                                                <span className="text-xs font-black uppercase text-[#604539] tracking-wider">Проверено</span>
                                            </label>
                                        </div>

                                        <button onClick={handleSaveEvent} className="w-full py-3 bg-[#C7886B] hover:bg-[#604539] text-white rounded-xl text-xs font-black uppercase tracking-widest transition-colors shadow-md">
                                            Сохранить изменения
                                        </button>
                                    </div>
                                </div>
                            )}

                            <div className="flex justify-between items-center mb-4 mt-6 px-1">
                                <h3 className="font-black uppercase tracking-[0.2em] text-[#604539] text-xs">База персонала ({staffDatabase.length})</h3>
                                <button 
                                    onClick={() => {
                                        setStaffForm({ id: '', name: '', phone: '' });
                                        setIsStaffFormOpen(!isStaffFormOpen);
                                    }} 
                                    className="py-1.5 px-3 bg-[#604539] text-white rounded-xl text-[10px] font-black uppercase tracking-wider flex items-center gap-1 hover:bg-[#C7886B] transition-colors shadow-sm"
                                >
                                    <Icons.Plus size={12} /> Добавить
                                </button>
                            </div>

                            {isStaffFormOpen && (
                                <div ref={staffFormRef} className="bg-white p-4 rounded-3xl border-2 border-[#604539] shadow-xl mb-6 animate-in space-y-3">
                                    <p className="text-[10px] uppercase font-black tracking-widest text-[#604539] opacity-40">Карточка сотрудника</p>
                                    <div className="space-y-2.5">
                                        <input type="text" value={staffForm.name} onChange={(e) => setStaffForm({ ...staffForm, name: e.target.value })} placeholder="ФИО сотрудника..." className="w-full py-2.5 px-3 rounded-xl border-2 border-[#60453920] text-sm font-bold outline-none focus:border-[#C7886B] transition-all" />
                                        <input 
                                            type="tel" 
                                            value={staffForm.phone} 
                                            onChange={(e) => setStaffForm({ ...staffForm, phone: formatPhoneNumber(e.target.value) })} 
                                            placeholder="+7 (999) 000-00-00" 
                                            className="w-full py-2.5 px-3 rounded-xl border-2 border-[#60453920] text-sm font-bold outline-none focus:border-[#C7886B] transition-all" 
                                        />
                                        <div className="flex gap-2 pt-1">
                                            <button onClick={handleSaveStaffDatabase} className="flex-1 py-2 bg-[#604539] text-white rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-[#C7886B] transition-colors">Сохранить</button>
                                            <button onClick={() => setIsStaffFormOpen(false)} className="py-2 px-4 bg-gray-100 text-gray-500 rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-gray-200 transition-colors">Отмена</button>
                                        </div>
                                    </div>
                                </div>
                            )}

                            <div className="bg-white rounded-3xl border-2 border-[#604539] shadow-md overflow-hidden mb-6">
                                <div className="max-h-[240px] overflow-y-auto custom-scrollbar divide-y divide-gray-50">
                                    {staffDatabase.sort((a,b) => a.name.localeCompare(b.name)).map(p => (
                                        <div key={p.id} className="p-3 flex items-center justify-between gap-3 hover:bg-gray-50/50">
                                            <div className="min-w-0 flex-1 pl-1">
                                                <p className="text-xs font-black uppercase text-[#1F1713] truncate">{p.name}</p>
                                                {p.phone && <p className="text-[11px] font-bold text-gray-400 mt-0.5">{p.phone}</p>}
                                            </div>
                                            <div className="flex items-center gap-1 shrink-0">
                                                <button onClick={() => handleEditStaffFromDatabase(p)} className="w-8 h-8 flex items-center justify-center bg-gray-50 rounded-lg text-gray-400 hover:text-[#604539] transition-colors"><Icons.Edit size={14} /></button>
                                                <button onClick={() => handleDeleteStaffDatabase(p.id)} className="w-8 h-8 flex items-center justify-center bg-gray-50 rounded-lg text-gray-300 hover:text-red-500 transition-colors"><Icons.Trash /></button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </>
                    )}

                    {isCommonFilesOpen && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-[#1F1713]/80 backdrop-blur-sm">
                            <div className="bg-white w-full max-w-sm rounded-3xl shadow-2xl overflow-hidden border-2 border-[#604539]">
                                <div className="p-4 border-b border-[#60453910] flex items-center justify-between">
                                    <div>
                                        <h3 className="text-sm font-black uppercase text-[#604539] leading-tight">Общие файлы</h3>
                                        <p className="text-[9px] font-bold text-[#C7886B] uppercase tracking-widest mt-0.5">База документов</p>
                                    </div>
                                    <button onClick={() => setIsCommonFilesOpen(false)} className="p-1.5 bg-gray-50 rounded-lg text-gray-300 hover:text-red-500 transition-colors">
                                        <Icons.X size={18} />
                                    </button>
                                </div>
                                <div className="p-4 bg-gray-50/50">
                                    <input ref={commonFileInputRef} type="file" multiple onChange={(e) => handleFileUpload(e, 'common')} className="hidden" />
                                    <button disabled={isUploading} onClick={() => commonFileInputRef.current.click()} className="w-full py-2.5 px-3 bg-white border-2 border-dashed border-[#60453920] hover:border-[#C7886B] rounded-xl text-[10px] font-black uppercase tracking-widest text-gray-500 transition-colors flex items-center justify-center gap-2 shadow-sm">
                                        <Icons.Paperclip size={14} /> {isUploading ? 'Загрузка...' : 'Загрузить в базу'}
                                    </button>
                                </div>
                                <div className="p-4 max-h-[40vh] overflow-y-auto custom-scrollbar space-y-2">
                                    {commonFiles && commonFiles.length > 0 ? (
                                        commonFiles.map(file => {
                                            return (
                                                <div key={file.id} className="flex items-center justify-between p-2.5 bg-white rounded-xl border border-gray-100 shadow-sm min-w-0">
                                                    <div className="flex items-center gap-2 min-w-0 flex-1">
                                                        <Icons.FileText size={16} className="text-[#C7886B] shrink-0" />
                                                        <div className="file-name-container flex-1">
                                                            <span className="text-xs font-bold text-gray-600 file-name-text">{file.name}</span>
                                                        </div>
                                                    </div>
                                                    <div className="flex items-center gap-2 shrink-0 ml-2">
                                                        <button onClick={() => handleFileDownload(file)} className="w-9 h-9 flex items-center justify-center bg-white rounded-lg border border-gray-200 text-gray-500 hover:text-[#604539]"><Icons.ExternalLink size={16} /></button>
                                                        <button onClick={() => handleFileDelete(file, 'common')} className="w-9 h-9 flex items-center justify-center bg-white rounded-lg border border-gray-200 text-gray-300 hover:text-red-500"><Icons.Trash size={16} /></button>
                                                    </div>
                                                </div>
                                            );
                                        })
                                    ) : (
                                        <div className="py-8 text-center text-gray-300 border-2 border-dashed border-gray-100 rounded-2xl uppercase font-black text-[10px]">Файлов нет</div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {isTokenVerified && !isFormOpen && (
                        <div className="fixed bottom-5 left-1/2 -translate-x-1/2 w-full max-w-xs px-4 z-40">
                            <button 
                                onClick={() => handleOpenForm()}
                                className="w-full py-3.5 bg-[#604539] text-white rounded-2xl font-black text-[11px] uppercase tracking-[0.2em] flex items-center justify-center gap-2 shadow-xl hover:bg-[#C7886B] transition-all active:scale-[0.98]"
                            >
                                <Icons.Plus size={16} /> Добавить проект
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
