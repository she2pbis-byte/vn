                                                        <span className="text-[10px] font-black uppercase text-gray-400 block mb-1">{roleKey}</span>
                                                        <input 
                                                            type="text" 
                                                            inputMode="numeric"
                                                            value={formData.neededStaff?.[roleKey] || '0'} 
                                                            onChange={e => setFormData({
                                                                ...formData, 
                                                                neededStaff: { ...formData.neededStaff, [roleKey]: e.target.value.replace(/[^\d]/g, '') || '0' }
                                                            })} 
                                                            className="w-full bg-white border border-gray-200 rounded-lg text-center font-bold text-sm py-1 outline-none focus:border-[#C7886B]" 
                                                        />
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                        <div>
                                            <label className="text-[9px] uppercase font-black tracking-wider opacity-40 block mb-1 ml-1">Комментарий</label>
                                            <AutoHeightTextarea placeholder="Дополнительная информация..." value={formData.comment} onChange={e => setFormData({...formData, comment: e.target.value})} className="w-full px-4 py-2.5 rounded-xl border-2 border-gray-100 text-sm focus:border-[#C7886B] outline-none transition-all" />
                                        </div>
                                        <button type="submit" className="w-full py-3 bg-[#604539] text-white font-black uppercase tracking-widest text-xs rounded-xl hover:bg-[#C7886B] transition-all">{editingEventId ? 'Сохранить' : 'Создать'}</button>
                                    </form>
                                )}

                                <div className="space-y-3">
                                    {filteredEvents.length > 0 ? (
                                        filteredEvents.map(ev => {
                                            const counts = getStaffCounts(ev);
                                            const isDone = checkEventCompleteness(ev);
                                            const isPaid = isEventFullyPaid(ev);
                                            const isPastDate = ev.date < todayStr;

                                            return (
                                                <div 
                                                    key={ev.id} 
                                                    onClick={() => setSelectedEventId(ev.id)}
                                                    className="bg-white p-4 rounded-3xl border-2 border-[#604539] border-l-8 hover:shadow-md transition-all duration-300 cursor-pointer flex items-center justify-between group active:scale-[0.99] relative overflow-hidden"
                                                    style={{ borderLeftColor: isPastDate ? (isPaid ? '#22c55e' : '#ef4444') : (isDone ? '#22c55e' : '#ef4444') }}
                                                >
                                                    <div className="flex-1 min-w-0 pr-2">
                                                        <div className="flex items-center gap-1.5 flex-wrap mb-1">
                                                            <div className="flex items-center gap-1 text-[11px] font-black text-[#C7886B]">
                                                                <Icons.Clock size={12} />
                                                                <span>{ev.start || '—'}{ev.end ? ` — ${ev.end}` : ''}</span>
                                                            </div>
                                                            {isPastDate && !isPaid && (
                                                                <span className="text-[8px] font-black bg-red-500 text-white px-1.5 py-0.5 rounded animate-pulse uppercase">Долг</span>
                                                            )}
                                                        </div>
                                                        <h2 className="font-black text-base uppercase tracking-tight text-[#1F1713] truncate group-hover:text-[#C7886B] transition-colors">{ev.name}</h2>
                                                        <div className="flex items-center gap-1 text-xs text-gray-400 font-medium truncate mt-0.5">
                                                            <Icons.MapPin size={11} className="shrink-0 text-gray-300" />
                                                            <span>{ev.place}</span>
                                                        </div>
                                                        
                                                        <div className="flex gap-2 mt-3 text-[10px] font-bold text-gray-400 border-t border-dashed pt-2">
                                                            {['оф', 'бар', 'мой', 'пов'].map(roleKey => {
                                                                const target = parseInt(ev.neededStaff?.[roleKey] || 0);
                                                                const actual = counts[keyToLabel[roleKey]];
                                                                if (target === 0 && actual === 0) return null;
                                                                return (
                                                                    <span key={roleKey} className={actual >= target && target > 0 ? 'text-green-600 font-extrabold' : target > 0 ? 'text-red-500 font-extrabold' : 'text-gray-400'}>
                                                                        {roleKey.toUpperCase()}:{actual}/{target === 0 ? '∞' : target}
                                                                    </span>
                                                                );
                                                            })}
                                                        </div>
                                                    </div>

                                                    <div className="flex items-center gap-1.5 shrink-0">
                                                        <div 
                                                            onClick={(e) => {
                                                                if (isLocalStorageVersion) {
                                                                    e.stopPropagation();
                                                                    return;
                                                                }
                                                                toggleEventChecked(e, ev.id);
                                                            }}
                                                            className={`w-11 h-11 flex items-center justify-center rounded-xl border-2 transition-all ${isLocalStorageVersion ? 'opacity-40 cursor-not-allowed' : 'cursor-pointer'} ${ev.status?.checked ? 'bg-emerald-500 border-emerald-500 text-white shadow-sm shadow-emerald-200' : 'bg-white border-gray-100 text-gray-300 hover:border-gray-200'}`}
                                                        >
                                                            <Icons.DoubleCheck size={20} color={ev.status?.checked ? '#ffffff' : '#cbd5e1'} />
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })
                                    ) : (
                                        <div className="py-12 bg-white/20 rounded-3xl border-2 border-dashed border-[#60453920] text-center">
                                            <div className="w-12 h-12 bg-white rounded-full flex items-center justify-center mx-auto mb-3 shadow-sm border border-[#60453905]">
                                                <Icons.Cloche size={16} className="text-[#60453940]" />
                                            </div>
                                            <p className="text-[10px] font-black uppercase tracking-widest opacity-30">Мероприятий нет</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {view === 'list' && selectedEventId && currentEvent && (
                            <div className="animate-in space-y-4">
                                <button onClick={() => setSelectedEventId(null)} className="flex items-center gap-1 text-[#604539] font-black uppercase text-[10px] tracking-widest bg-white/40 px-3 py-2 rounded-xl border border-white/20 hover:bg-white/60 transition-all">
                                    ← К списку
                                </button>

                                <div className="bg-white p-5 rounded-3xl border-2 border-[#604539] shadow-xl relative overflow-hidden">
                                    <div className="flex justify-between items-start gap-4 mb-2">
                                        <div className="min-w-0">
                                            <div className="flex items-center gap-2 mb-1">
                                                <span className="text-[10px] font-black bg-[#C7886B20] text-[#C7886B] px-2.5 py-0.5 rounded-lg">{currentEvent.date.split('-').reverse().join('.')}</span>
                                                <div className="flex items-center gap-1 text-xs font-bold text-[#C7886B]">
                                                    <Icons.Clock size={13} />
                                                    <span>{currentEvent.start || '—'}{currentEvent.end ? ` — ${currentEvent.end}` : ''}</span>
                                                </div>
                                            </div>
                                            <h2 className="font-black text-xl uppercase tracking-tight text-[#1F1713] break-words leading-tight">{currentEvent.name}</h2>
                                        </div>
                                        <div className="flex gap-1 shrink-0">
                                            <button 
                                                onClick={() => !isLocalStorageVersion && startEditEvent(null, currentEvent)} 
                                                disabled={isLocalStorageVersion}
                                                className="text-[#604539] p-2 disabled:opacity-30 disabled:cursor-not-allowed"
                                            >
                                                <Icons.Edit size={20} />
                                            </button>
                                            <button 
                                                onClick={(e) => !isLocalStorageVersion && fastDeleteEvent(e, currentEvent.id)} 
                                                disabled={isLocalStorageVersion}
                                                className="text-red-300 p-2 hover:text-red-500 disabled:opacity-30 disabled:cursor-not-allowed"
                                            >
                                                <Icons.Trash size={20} />
                                            </button>
                                        </div>
                                    </div>

                                    <div className="flex items-center gap-1 text-xs text-gray-500 font-medium pb-3 border-b border-gray-100">
                                        <Icons.MapPin size={13} className="shrink-0 text-gray-300" />
                                        <span className="break-all">{currentEvent.place}</span>
                                    </div>

                                    {currentEvent.comment && (
                                        <div className="mt-3 bg-amber-50/50 border border-amber-100/40 p-3 rounded-2xl">
                                            <p className="text-[9px] uppercase font-black tracking-wider text-amber-800/50 mb-1">Комментарий:</p>
                                            <p className="text-xs text-gray-600 whitespace-pre-wrap leading-relaxed font-medium">{currentEvent.comment}</p>
                                        </div>
                                    )}

                                    <div className="mt-4 flex items-center justify-between bg-gray-50 p-3 rounded-2xl border border-gray-100">
                                        <div className="flex items-center gap-2.5">
                                            <div className={`w-3 h-3 rounded-full ${checkEventCompleteness(currentEvent) ? 'bg-green-500' : 'bg-red-500'}`} />
                                            <div>
                                                <p className="text-[10px] font-black uppercase text-[#1F1713] leading-none">Верификация</p>
                                                <p className="text-[9px] font-bold text-gray-400 mt-0.5 uppercase tracking-wide">
                                                    {checkEventCompleteness(currentEvent) ? 'Смена укомплектована' : 'Не все условия выполнены'}
                                                </p>
                                            </div>
                                        </div>
                                        <div 
                                            onClick={(e) => {
                                                if (isLocalStorageVersion) return;
                                                toggleEventChecked(e, currentEvent.id);
                                            }}
                                            className={`w-10 h-10 flex items-center justify-center rounded-full transition-all shadow-sm ${isLocalStorageVersion ? 'opacity-30 cursor-not-allowed' : 'cursor-pointer'} ${currentEvent?.status?.checked ? 'bg-emerald-500 text-white shadow-emerald-100' : 'bg-white border text-gray-300 hover:text-gray-400'}`}
                                        >
                                            <Icons.DoubleCheck size={20} color={currentEvent?.status?.checked ? '#ffffff' : '#cbd5e1'} />
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-white p-5 rounded-3xl border-2 border-[#604539] shadow-xl">
                                    <div className="flex items-center justify-between mb-4">
                                        <h3 className="font-black uppercase tracking-wider text-[#604539] text-xs flex items-center gap-2">
                                            <Icons.Users size={16} /> Штат смены
                                        </h3>
                                        {!isStaffFormOpen ? (
                                            <button 
                                                onClick={() => !isLocalStorageVersion && setIsStaffFormOpen(true)} 
                                                disabled={isLocalStorageVersion}
                                                className="px-3 py-1.5 bg-[#60453908] border border-[#60453920] hover:bg-[#60453912] text-[#604539] text-[10px] font-black uppercase tracking-wider rounded-xl transition-all flex items-center gap-1 disabled:opacity-40 disabled:cursor-not-allowed"
                                            >
                                                <Icons.Plus size={12} /> Добавить
                                            </button>
                                        ) : (
                                            <button type="button" onClick={() => { setIsStaffFormOpen(false); setEditingStaffId(null); setNewStaff({ name: '', phone: '', time: '', end: '', roles: [] }); }} className="text-gray-400 hover:text-red-500"><Icons.X size={18} /></button>
                                        )}
                                    </div>

                                    {isStaffFormOpen && (
                                        <form onSubmit={handleSaveStaff} className="bg-gray-50 border border-gray-100 p-4 rounded-2xl mb-4 space-y-3 animate-in relative">
                                            <div className="relative">
                                                <label className="text-[8px] uppercase font-black tracking-wider opacity-40 block mb-0.5 ml-1">ФИО сотрудника</label>
                                                <div className="relative">
                                                    <input type="text" required placeholder="Введите имя..." value={newStaff.name} onChange={e => handleStaffNameChange(e.target.value)} className="w-full px-3 py-2 rounded-xl border bg-white text-xs font-bold outline-none focus:border-[#C7886B]" />
                                                    {nameSuggestions.length > 0 && (
                                                        <div className="autocomplete-list custom-scrollbar">
                                                            {nameSuggestions.map((name, idx) => (
                                                                <div key={idx} onClick={() => selectNameSuggestion(name)} className="autocomplete-item font-bold text-xs">{name}</div>
                                                            ))}
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                            <div>
                                                <label className="text-[8px] uppercase font-black tracking-wider opacity-40 block mb-0.5 ml-1">Телефон</label>
                                                <div className="relative">
                                                    <input type="text" placeholder="+7 (999) 000-00-00" value={newStaff.phone} onChange={e => handleStaffPhoneChange(e.target.value)} className="w-full px-3 py-2 rounded-xl border bg-white text-xs font-bold outline-none focus:border-[#C7886B]" />
                                                    {phoneSuggestions.length > 0 && (
                                                        <div className="autocomplete-list custom-scrollbar">
                                                            {phoneSuggestions.map((phone, idx) => (
                                                                <div key={idx} onClick={() => selectPhoneSuggestion(phone)} className="autocomplete-item font-bold text-xs">{phone}</div>
                                                            ))}
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                            <div className="flex gap-2">
                                                <SimpleTimePicker label="Прибытие" value={newStaff.time} onChange={(time) => setNewStaff({...newStaff, time})} colors={colors} />
                                                <SimpleTimePicker label="Уход" value={newStaff.end} onChange={(time) => setNewStaff({...newStaff, end: time})} colors={colors} />
                                            </div>
                                            <div>
                                                <label className="text-[8px] uppercase font-black tracking-wider opacity-40 block mb-1.5 ml-1">Роли на мероприятии</label>
                                                <div className="flex flex-wrap gap-1.5">
                                                    {['Официант', 'Бармен', 'Мойщица', 'Повар'].map(role => {
                                                        const isSelected = newStaff.roles.includes(role);
                                                        return (
                                                            <button 
                                                                key={role} 
                                                                type="button"
                                                                onClick={() => {
                                                                    const roles = isSelected ? newStaff.roles.filter(r => r !== role) : [...newStaff.roles, role];
                                                                    setNewStaff({ ...newStaff, roles });
                                                                }}
                                                                className={`px-3 py-1.5 rounded-lg text-[11px] font-bold border transition-all flex items-center gap-1 ${isSelected ? 'bg-[#604539] text-white border-[#604539]' : 'bg-white text-gray-500 border-gray-100 hover:border-gray-200'}`}
                                                            >
                                                                {roleIconMap[role]?.icon} {role}
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                            <button type="submit" className="w-full py-2 bg-[#604539] text-white font-black uppercase tracking-widest text-[10px] rounded-xl hover:bg-[#C7886B] transition-all">{editingStaffId ? 'Обновить данные' : 'Вписать в смену'}</button>
                                        </form>
                                    )}

                                    <div className="overflow-x-auto">
                                        <table className="staff-table min-w-full">
                                            <thead>
                                                <tr className="border-b border-gray-100 text-left">
                                                    <th className="col-staff pb-2 text-[9px] font-black uppercase tracking-wider text-gray-400 pl-1">Сотрудник / Роль</th>
                                                    <th className="col-timing pb-2 text-[9px] font-black uppercase tracking-wider text-gray-400 text-center">Тайминг</th>
                                                    <th className="col-actions pb-2 text-[9px] font-black uppercase tracking-wider text-gray-400 text-right pr-1">Действия</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-gray-50 font-medium">
                                                {currentEvent.staff && currentEvent.staff.length > 0 ? (
                                                    currentEvent.staff.map((s, idx) => (
                                                        <tr key={idx} className="hover:bg-gray-50/60 transition-colors">
                                                            <td className="col-staff py-3 pl-1 min-w-0">
                                                                <p className="text-xs font-bold text-gray-800 uppercase truncate max-w-full" title={s.name}>{s.name}</p>
                                                                <div className="flex flex-wrap gap-1 mt-1 max-w-full">
                                                                    {s.roles.map((role, rIdx) => (
                                                                        <div 
                                                                            key={rIdx} 
                                                                            onClick={() => !isLocalStorageVersion && toggleStaffRolePaid(s.id, role)}
                                                                            className={`role-badge border ${isLocalStorageVersion ? 'cursor-not-allowed' : ''} ${s.rolePaid?.[role] ? 'bg-green-100 border-green-200 text-green-700' : 'bg-gray-50 border-gray-100 text-gray-500'}`}
                                                                        >
                                                                            {roleIconMap[role]?.icon}
                                                                            <span className="text-[9px] font-bold">{role.slice(0, 3)}</span>
                                                                            {s.rolePaid?.[role] && <span className="font-black text-[10px] ml-0.5">₽</span>}
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            </td>
                                                            <td className="col-timing py-3 text-center">
                                                                <span className={`text-[11px] font-extrabold px-1.5 py-0.5 rounded-md ${s.time ? 'bg-[#C7886B15] text-[#C7886B]' : 'bg-red-50 text-red-500 font-black animate-pulse'}`}>
                                                                    {s.time || '⏳ —'}
                                                                </span>
                                                                {s.end && <span className="text-[9px] block text-gray-400 font-bold mt-1">до {s.end}</span>}
                                                            </td>
                                                            <td className="col-actions py-3 text-right pr-1">
                                                                <div className="flex justify-end gap-1.5">
                                                                    <button 
                                                                        onClick={() => {
                                                                            if (isLocalStorageVersion) return;
                                                                            setEditingStaffId(s.id);
                                                                            setNewStaff({ name: s.name, phone: s.phone || '', time: s.time || '', end: s.end || '', roles: s.roles });
                                                                            setIsStaffFormOpen(true);
                                                                        }}
                                                                        disabled={isLocalStorageVersion}
                                                                        className="text-gray-400 hover:text-[#604539] p-1 disabled:opacity-20 disabled:cursor-not-allowed"
                                                                    >
                                                                        <Icons.Edit size={14} />
                                                                    </button>
                                                                    <button 
                                                                        onClick={() => {
                                                                            if (isLocalStorageVersion) return;
                                                                            if (confirm(`Убрать ${s.name} из смены?`)) {
                                                                                const updated = events.map(ev => ev.id === selectedEventId ? { ...ev, staff: ev.staff.filter(x => x.id !== s.id) } : ev);
                                                                                setEvents(updated);
                                                                                saveToGithub(updated, null, null);
                                                                            }
                                                                        }}
                                                                        disabled={isLocalStorageVersion}
                                                                        className="text-gray-300 hover:text-red-500 p-1 disabled:opacity-20 disabled:cursor-not-allowed"
                                                                    >
                                                                        <Icons.Trash size={15} />
                                                                    </button>
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    ))
                                                ) : (
                                                    <tr>
                                                        <td colSpan="3" className="py-6 text-center text-gray-300 font-black text-[9px] uppercase tracking-wider">Штат пуст</td>
                                                    </tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                                <div className="bg-white p-5 rounded-3xl border-2 border-[#604539] shadow-xl">
                                    <div className="flex items-center justify-between mb-4">
                                        <h3 className="font-black uppercase tracking-wider text-[#604539] text-xs flex items-center gap-2">
                                            <Icons.Paperclip size={16} /> Документы мероприятия
                                        </h3>
                                        <div>
                                            <input ref={fileInputRef} type="file" className="hidden" onChange={(e) => handleFileUpload(e, 'event')} />
                                            <button 
                                                onClick={() => fileInputRef.current.click()} 
                                                disabled={isUploading || isLocalStorageVersion}
                                                className="px-3 py-1.5 bg-[#60453908] border border-[#60453920] hover:bg-[#60453912] text-[#604539] text-[10px] font-black uppercase tracking-wider rounded-xl transition-all flex items-center gap-1 disabled:opacity-40 disabled:cursor-not-allowed"
                                            >
                                                {isUploading ? <Icons.Refresh size={12} className="spin-slow" /> : <Icons.Plus size={12} />} Добавить
                                            </button>
                                        </div>
                                    </div>

                                    <div className="space-y-2 max-h-60 overflow-y-auto pr-1 custom-scrollbar">
                                        {currentEvent.files && currentEvent.files.length > 0 ? (
                                            currentEvent.files.map((file, idx) => {
                                                return (
                                                    <div key={idx} className="flex items-center justify-between p-3 bg-gray-50 rounded-xl border border-gray-100">
                                                        <div className="flex items-center gap-2 min-w-0 file-name-container">
                                                            <Icons.FileText size={16} className="text-[#604539] shrink-0" />
                                                            <span className="text-xs font-bold text-gray-700 truncate file-name-text">{file.name}</span>
                                                        </div>
                                                        <div className="flex items-center gap-2 shrink-0 ml-2">
                                                            <button onClick={() => handleFileDownload(file)} className="w-9 h-9 flex items-center justify-center bg-white rounded-lg border border-gray-200 text-gray-500 hover:text-[#604539]"><Icons.ExternalLink size={16} /></button>
                                                            <button 
                                                                onClick={() => handleFileDelete(file, 'event')} 
                                                                disabled={isLocalStorageVersion}
                                                                className="w-9 h-9 flex items-center justify-center bg-white rounded-lg border border-gray-200 text-gray-300 hover:text-red-500 disabled:opacity-30 disabled:cursor-not-allowed"
                                                            >
                                                                <Icons.Trash size={16} />
                                                            </button>
                                                        </div>
                                                    </div>
                                                );
                                            })
                                        ) : (
                                            <div className="py-8 text-center text-gray-300 border-2 border-dashed border-gray-100 rounded-2xl uppercase font-black text-[10px]">Файлов нет</div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
