                                                                            );
                                                                        })}
                                                                    </div>
                                                                </div>
                                                            </td>
                                                            <td className="py-3 px-1 text-center font-bold text-gray-500 whitespace-nowrap">
                                                                <div>{s.time || '—'}</div>
                                                                {s.end && <div className="text-[10px] text-gray-300 font-medium">до {s.end}</div>}
                                                            </td>
                                                            <td className="py-3 pr-3 text-right">
                                                                <button 
                                                                    disabled={!isOnline}
                                                                    onClick={() => {
                                                                        if (!isOnline) return;
                                                                        const upd = events.map(e => e.id === selectedEventId ? { ...e, staff: e.staff.filter(x => x.id !== s.id) } : e);
                                                                        setEvents(upd);
                                                                        saveToGithub(upd, null, null);
                                                                    }}
                                                                    className="text-gray-300 hover:text-red-500 transition-colors disabled:opacity-40 disabled:pointer-events-none"
                                                                >
                                                                    <Icons.Trash size={16} />
                                                                </button>
                                                            </td>
                                                        </tr>
                                                    );
                                                })
                                            ) : (
                                                <tr>
                                                    <td colSpan="3" className="py-6 text-center text-[10px] font-black text-gray-300 uppercase tracking-widest">Персонал не назначен</td>
                                                </tr>
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                            {/* Кнопка утверждения мероприятия (Чек) */}
                            <div className="mb-6 pt-2 border-t border-dashed border-gray-100">
                                <button 
                                    disabled={!isOnline}
                                    onClick={toggleCheckedStatus}
                                    className={`w-full py-3 rounded-2xl font-black text-[11px] uppercase tracking-widest border-2 flex items-center justify-center gap-2 transition-all ${
                                        currentEvent.status?.checked 
                                            ? 'bg-green-500 border-green-500 text-white shadow-md shadow-green-500/10' 
                                            : 'bg-white border-red-200 text-red-500 hover:bg-red-50/50'
                                    } disabled:opacity-40 disabled:pointer-events-none`}
                                >
                                    <Icons.Check size={14} color="currentColor" />
                                    <span>{currentEvent.status?.checked ? 'Мероприятие утверждено' : 'Утвердить состав и тайминг'}</span>
                                </button>
                            </div>

                            {/* Файлы мероприятия */}
                            <div>
                                <div className="flex justify-between items-center mb-3">
                                    <h3 className="text-xs font-black uppercase tracking-wider text-[#604539]">Документы заказа</h3>
                                    <button 
                                        onClick={() => fileInputRef.current.click()}
                                        disabled={isUploading || !isOnline}
                                        className="px-3 py-1.5 bg-[#604539] text-white rounded-lg text-[10px] font-black uppercase tracking-widest flex items-center gap-1 disabled:opacity-40 disabled:pointer-events-none"
                                    >
                                        <Icons.Plus size={12} /> Файл
                                    </button>
                                    <input ref={fileInputRef} type="file" className="hidden" onChange={(e) => handleFileUpload(e, 'event')} />
                                </div>
                                <div className="space-y-2">
                                    {currentEvent.files && currentEvent.files.length > 0 ? (
                                        currentEvent.files.map((file, fIdx) => (
                                            <div key={fIdx} className="flex items-center justify-between p-3 bg-gray-50 rounded-xl border border-gray-100 group">
                                                <div className="flex items-center gap-2.5 min-w-0 flex-1">
                                                    <Icons.FileText size={16} className="text-[#C7886B] shrink-0" />
                                                    <div className="file-name-container">
                                                        <span className="text-xs font-bold text-[#1F1713] file-name-text">{file.name}</span>
                                                    </div>
                                                </div>
                                                <div className="flex items-center gap-1.5 shrink-0 ml-2">
                                                    <button onClick={() => handleFileDownload(file)} className="w-8 h-8 flex items-center justify-center bg-white rounded-lg border border-gray-100 text-gray-400 hover:text-[#604539] transition-colors"><Icons.ExternalLink size={14} /></button>
                                                    <button 
                                                        disabled={!isOnline}
                                                        onClick={() => handleFileDelete(file, 'event')} 
                                                        className="w-8 h-8 flex items-center justify-center bg-white rounded-lg border border-gray-100 text-gray-300 hover:text-red-500 transition-colors disabled:opacity-40 disabled:pointer-events-none"
                                                    >
                                                        <Icons.Trash size={14} />
                                                    </button>
                                                </div>
                                            </div>
                                        ))
                                    ) : (
                                        <div className="py-6 text-center text-[10px] font-black text-gray-300 uppercase tracking-widest border-2 border-dashed border-gray-50 rounded-2xl">Файлов нет</div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* МОДАЛЬНОЕ ОКНО: ФОРМА МЕРОПРИЯТИЯ */}
                    {isFormOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#1F1713]/80 backdrop-blur-sm">
                            <div className="bg-white w-full max-w-sm rounded-3xl border-2 border-[#604539] shadow-2xl overflow-hidden animate-in">
                                <div className="p-4 border-b border-[#60453910] flex justify-between items-center">
                                    <h3 className="font-black text-xs uppercase tracking-widest text-[#604539]">{formData.id ? 'Редактировать заказ' : 'Новое мероприятие'}</h3>
                                    <button onClick={() => setIsFormOpen(false)} className="p-1 text-gray-300 hover:text-red-500 transition-colors"><Icons.X size={20} /></button>
                                </div>
                                <form onSubmit={handleCreateOrUpdateEvent} className="p-4 space-y-4 max-h-[75vh] overflow-y-auto custom-scrollbar">
                                    <div>
                                        <p className="text-[9px] uppercase font-bold mb-1 opacity-40 ml-1">Название мероприятия</p>
                                        <input type="text" required value={formData.name} onChange={e => setFormData({ ...formData, name: e.target.value })} placeholder="Свадьба, Банкет, Фуршет..." className="w-full px-4 py-3 rounded-xl border-2 border-gray-100 outline-none focus:border-[#C7886B] text-sm font-bold transition-all" />
                                    </div>
                                    <div>
                                        <p className="text-[9px] uppercase font-bold mb-1 opacity-40 ml-1">Место проведения</p>
                                        <input type="text" value={formData.place} onChange={e => setFormData({ ...formData, place: e.target.value })} placeholder="Ресторан, Веранда, Шатер..." className="w-full px-4 py-3 rounded-xl border-2 border-gray-100 outline-none focus:border-[#C7886B] text-sm font-bold transition-all" />
                                    </div>
                                    <div className="flex gap-3">
                                        <SimpleTimePicker label="Начало смены" value={formData.start} onChange={(val) => setFormData({ ...formData, start: val })} colors={{ accent: '#604539' }} />
                                        <SimpleTimePicker label="Окончание" value={formData.end} onChange={(val) => setFormData({ ...formData, end: val })} colors={{ accent: '#604539' }} />
                                    </div>
                                    
                                    {/* Требуемый состав */}
                                    <div className="bg-gray-50 p-3 rounded-2xl border border-gray-100">
                                        <p className="text-[9px] uppercase font-black tracking-wider text-gray-400 mb-2.5 ml-0.5">Необходимый состав персонала:</p>
                                        <div className="grid grid-cols-2 gap-2">
                                            {['оф', 'бар', 'мой', 'пов'].map(rk => (
                                                <div key={rk} className="flex items-center justify-between bg-white px-3 py-1.5 rounded-xl border border-gray-100">
                                                    <span className="text-xs font-bold uppercase text-gray-500">{rk}</span>
                                                    <input 
                                                        type="number" 
                                                        min="0"
                                                        value={formData.neededStaff?.[rk] || '0'} 
                                                        onChange={e => {
                                                            const ns = { ...(formData.neededStaff || {}) };
                                                            ns[rk] = e.target.value;
                                                            setFormData({ ...formData, neededStaff: ns });
                                                        }}
                                                        className="w-12 text-right font-black text-sm outline-none text-[#604539]"
                                                    />
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div>
                                        <p className="text-[9px] uppercase font-bold mb-1 opacity-40 ml-1">Заметки / Комментарий</p>
                                        <AutoHeightTextarea value={formData.comment} onChange={e => setFormData({ ...formData, comment: e.target.value })} placeholder="Детали заказа, меню, особенности..." className="w-full px-4 py-3 rounded-xl border-2 border-gray-100 outline-none focus:border-[#C7886B] text-sm font-medium transition-all" />
                                    </div>
                                    <button type="submit" className="w-full py-3.5 bg-[#604539] text-white rounded-xl font-black text-xs uppercase tracking-widest shadow-md">Сохранить</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* МОДАЛЬНОЕ ОКНО: ФОРМА ДОБАВЛЕНИЯ НА СМЕНУ */}
                    {isStaffFormOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#1F1713]/80 backdrop-blur-sm">
                            <div className="bg-white w-full max-w-sm rounded-3xl border-2 border-[#604539] shadow-2xl overflow-hidden animate-in">
                                <div className="p-4 border-b border-[#60453910] flex justify-between items-center">
                                    <h3 className="font-black text-xs uppercase tracking-widest text-[#604539]">Назначить сотрудника</h3>
                                    <button onClick={() => setIsStaffFormOpen(false)} className="p-1 text-gray-300 hover:text-red-500 transition-colors"><Icons.X size={20} /></button>
                                </div>
                                <form onSubmit={handleAddStaffToShift} className="p-4 space-y-4">
                                    <div className="relative">
                                        <p className="text-[9px] uppercase font-bold mb-1 opacity-40 ml-1">ФИО сотрудника</p>
                                        <input 
                                            type="text" 
                                            required 
                                            value={staffFormData.name} 
                                            onChange={e => {
                                                setStaffFormData({ ...staffFormData, name: e.target.value });
                                            }} 
                                            placeholder="Введите имя..." 
                                            className="w-full px-4 py-3 rounded-xl border-2 border-gray-100 outline-none focus:border-[#C7886B] text-sm font-bold transition-all uppercase" 
                                        />
                                        
                                        {/* Автокомплит */}
                                        {staffFormData.name.trim().length > 0 && staffDatabase.filter(x => x.name.toLowerCase().includes(staffFormData.name.toLowerCase()) && x.name.toLowerCase() !== staffFormData.name.toLowerCase()).length > 0 && (
                                            <div className="autocomplete-list custom-scrollbar">
                                                {staffDatabase
                                                    .filter(x => x.name.toLowerCase().includes(staffFormData.name.toLowerCase()))
                                                    .map((person, pIdx) => (
                                                        <div 
                                                            key={pIdx} 
                                                            onClick={() => setStaffFormData({ ...staffFormData, name: person.name })}
                                                            className="autocomplete-item font-bold uppercase text-[#1F1713]"
                                                        >
                                                            {person.name}
                                                        </div>
                                                    ))
                                                }
                                            </div>
                                        )}
                                    </div>

                                    <div>
                                        <p className="text-[9px] uppercase font-bold mb-2 opacity-40 ml-1">Выбранные роли (можно несколько)</p>
                                        <div className="flex flex-wrap gap-1.5">
                                            {['оф', 'бар', 'мой', 'пов'].map(rk => {
                                                const fullLabel = keyToLabel[rk];
                                                const isSel = staffFormData.roles.includes(fullLabel);
                                                return (
                                                    <button
                                                        key={rk}
                                                        type="button"
                                                        onClick={() => {
                                                            const current = [...staffFormData.roles];
                                                            if (current.includes(fullLabel)) {
                                                                setStaffFormData({ ...staffFormData, roles: current.filter(x => x !== fullLabel) });
                                                            } else {
                                                                setStaffFormData({ ...staffFormData, roles: [...current, fullLabel] });
                                                            }
                                                        }}
                                                        className={`px-3 py-2 rounded-xl text-xs font-black uppercase tracking-wider border-2 transition-all ${isSel ? 'bg-[#604539] border-[#604539] text-white shadow-sm' : 'bg-white border-gray-100 text-gray-400'}`}
                                                    >
                                                        {rk}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>

                                    <div className="flex gap-3">
                                        <SimpleTimePicker label="Прибытие" value={staffFormData.time || currentEvent?.start || ''} onChange={(val) => setStaffFormData({ ...staffFormData, time: val })} colors={{ accent: '#604539' }} />
                                        <SimpleTimePicker label="Окончание" value={staffFormData.end || currentEvent?.end || ''} onChange={(val) => setStaffFormData({ ...staffFormData, end: val })} colors={{ accent: '#604539' }} />
                                    </div>

                                    <button type="submit" className="w-full py-3.5 bg-[#604539] text-white rounded-xl font-black text-xs uppercase tracking-widest shadow-md">Добавить на смену</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* МОДАЛЬНОЕ ОКНО: БАЗА СОТРУДНИКОВ */}
                    {isStaffDbOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#1F1713]/80 backdrop-blur-sm">
                            <div className="bg-white w-full max-w-sm rounded-3xl border-2 border-[#604539] shadow-2xl overflow-hidden flex flex-col max-h-[85vh] animate-in">
                                <div className="p-4 border-b border-[#60453910] flex justify-between items-center bg-gray-50/50">
                                    <div className="flex items-center gap-2">
                                        <Icons.Users size={16} className="text-[#604539]" />
                                        <h3 className="font-black text-xs uppercase tracking-widest text-[#604539]">База персонала ({staffDatabase.length})</h3>
                                    </div>
                                    <button onClick={() => setIsStaffDbOpen(false)} className="p-1 text-gray-300 hover:text-red-500 transition-colors"><Icons.X size={20} /></button>
                                </div>
                                
                                {/* Список сотрудников */}
                                <div className="flex-1 p-4 overflow-y-auto custom-scrollbar space-y-2.5 bg-gray-50/30">
                                    {staffDatabase.sort((a,b) => a.name.localeCompare(b.name)).map((person, idx) => (
                                        <div key={idx} className="flex items-center justify-between p-3 bg-white rounded-xl border border-gray-100 shadow-sm">
                                            <div className="min-w-0 flex-1 pr-2">
                                                <p className="font-black text-xs text-[#1F1713] uppercase truncate tracking-wide">{person.name}</p>
                                                {person.phone ? (
                                                    <a href={`tel:${person.phone}`} className="text-[11px] font-bold text-[#C7886B] mt-0.5 inline-flex items-center gap-1">
                                                        <Icons.Phone size={10} />
                                                        <span>{formatPhoneNumber(person.phone)}</span>
                                                    </a>
                                                ) : (
                                                    <p className="text-[9px] font-bold text-gray-300 uppercase mt-0.5">Нет телефона</p>
                                                )}
                                            </div>
                                            <button 
                                                disabled={!isOnline}
                                                onClick={() => handleDeleteStaffFromDb(person.name)}
                                                className="text-gray-300 hover:text-red-500 p-1 transition-colors disabled:opacity-40 disabled:pointer-events-none"
                                            >
                                                <Icons.Trash size={16} />
                                            </button>
                                        </div>
                                    ))}
                                </div>

                                {/* Добавление в базу */}
                                <form onSubmit={handleAddStaffToDbOnly} className="p-4 border-t border-[#60453910] bg-white space-y-3">
                                    <p className="text-[9px] font-black uppercase text-gray-400 tracking-wider ml-0.5">Быстрое добавление:</p>
                                    <input 
                                        type="text" 
                                        required 
                                        disabled={!isOnline}
                                        value={newStaffDbEntry.name}
                                        onChange={e => setNewStaffDbEntry({ ...newStaffDbEntry, name: e.target.value })}
                                        placeholder="ФИО сотрудника" 
                                        className="w-full px-3.5 py-2.5 rounded-xl border-2 border-gray-100 outline-none focus:border-[#C7886B] text-xs font-bold uppercase transition-all disabled:opacity-50"
                                    />
                                    <input 
                                        type="tel" 
                                        disabled={!isOnline}
                                        value={formatPhoneNumber(newStaffDbEntry.phone)}
                                        onChange={e => setNewStaffDbEntry({ ...newStaffDbEntry, phone: formatOnlyNumbers(e.target.value) })}
                                        placeholder="Номер телефона" 
                                        className="w-full px-3.5 py-2.5 rounded-xl border-2 border-gray-100 outline-none focus:border-[#C7886B] text-xs font-bold transition-all disabled:opacity-50"
                                    />
                                    <button 
                                        type="submit" 
                                        disabled={!isOnline}
                                        className="w-full py-3 bg-[#604539] text-white rounded-xl font-black text-[10px] uppercase tracking-widest shadow-md disabled:opacity-40 disabled:pointer-events-none"
                                    >
                                        Внести в базу
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* МОДАЛЬНОЕ ОКНО: ОБЩИЕ ФАЙЛЫ */}
                    {isCommonFilesOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#1F1713]/80 backdrop-blur-sm">
                            <div className="bg-white w-full max-w-sm rounded-3xl border-2 border-[#604539] shadow-2xl overflow-hidden flex flex-col max-h-[75vh] animate-in">
                                <div className="p-4 border-b border-[#60453910] flex justify-between items-center bg-gray-50/50">
                                    <div className="flex items-center gap-2">
                                        <Icons.Paperclip size={16} className="text-[#604539]" />
                                        <h3 className="font-black text-xs uppercase tracking-widest text-[#604539]">Общие документы ({commonFiles.length})</h3>
                                    </div>
                                    <button onClick={() => setIsCommonFilesOpen(false)} className="p-1 text-gray-300 hover:text-red-500 transition-colors"><Icons.X size={20} /></button>
                                </div>
                                
                                <div className="flex-1 p-4 overflow-y-auto custom-scrollbar space-y-2 bg-gray-50/30">
                                    {commonFiles.length > 0 ? (
                                        commonFiles.map((file, fIdx) => (
                                            <div key={fIdx} className="flex items-center justify-between p-3 bg-white rounded-xl border border-gray-100 shadow-sm group">
                                                <div className="flex items-center gap-2.5 min-w-0 flex-1">
                                                    <Icons.FileText size={16} className="text-[#C7886B] shrink-0" />
                                                    <div className="file-name-container">
                                                        <span className="text-xs font-bold text-[#1F1713] file-name-text">{file.name}</span>
                                                    </div>
                                                </div>
                                                <div className="flex items-center gap-1.5 shrink-0 ml-2">
                                                    <button onClick={() => handleFileDownload(file)} className="w-8 h-8 flex items-center justify-center bg-white rounded-lg border border-gray-100 text-gray-400 hover:text-[#604539] transition-colors"><Icons.ExternalLink size={14} /></button>
                                                    <button 
                                                        disabled={!isOnline}
                                                        onClick={() => handleFileDelete(file, 'common')} 
                                                        className="w-8 h-8 flex items-center justify-center bg-white rounded-lg border border-gray-100 text-gray-300 hover:text-red-500 transition-colors disabled:opacity-40 disabled:pointer-events-none"
                                                    >
                                                        <Icons.Trash size={14} />
                                                    </button>
                                                </div>
                                            </div>
                                        ))
                                    ) : (
                                        <div className="py-12 text-center text-[10px] font-black text-gray-300 uppercase tracking-widest border-2 border-dashed border-gray-100 bg-white rounded-2xl">Файлов нет</div>
                                    )}
                                </div>

                                <div className="p-4 border-t border-[#60453910] bg-white">
                                    <button 
                                        onClick={() => commonFileInputRef.current.click()}
                                        disabled={isUploading || !isOnline}
                                        className="w-full py-3.5 bg-[#604539] text-white rounded-xl font-black text-xs uppercase tracking-widest shadow-md flex items-center justify-center gap-2 disabled:opacity-40 disabled:pointer-events-none"
                                    >
                                        <Icons.Plus size={14} />
                                        <span>Загрузить новый документ</span>
                                    </button>
                                    <input ref={commonFileInputRef} type="file" className="hidden" onChange={(e) => handleFileUpload(e, 'common')} />
                                </div>
                            </div>
                        </div>
                    )}

                    {/* МОДАЛЬНОЕ ОКНО ДЛЯ ПРОСМОТРА СМЕН КОНКРЕТНОГО СОТРУДНИКА */}
                    {activeStaffScheduleName && (
                        <StaffScheduleModal 
                            staffName={activeStaffScheduleName}
                            events={events}
                            todayStr={todayStr}
                            onClose={() => setActiveStaffScheduleName(null)}
                            onSelectEvent={(eventId) => {
                                const ev = events.find(x => x.id === eventId);
                                if (ev) {
                                    setSelectedDate(ev.date);
                                    setSelectedEventId(ev.id);
                                    setActiveStaffScheduleName(null);
                                    setIsStaffDbOpen(false);
                                }
                            }}
                        />
                    )}

                    {/* СПИСОК ВСЕХ СОТРУДНИКОВ (БОКОВАЯ ИЛИ НИЖНЯЯ ПАНЕЛЬ) */}
                    <div className="mt-8 pt-6 border-t-2 border-[#60453910]">
                        <StaffList staffDatabase={staffDatabase} events={events} onClose={() => {}} />
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
