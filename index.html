<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>АДМИН</title>
    <link rel="icon" type="image/x-icon" href="catering-b.ico">

    <meta name="theme-color" content="#FFEED2">
    <meta name="msapplication-navbutton-color" content="#FFEED2">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #FFECD2; scroll-behavior: smooth; }
        .animate-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .sync-status { 
            font-size: 10px; 
            font-weight: 800; 
            padding: 4px 12px; 
            border-radius: 99px; 
            min-width: 100px; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            line-height: 1.4; 
            letter-spacing: 0.05em; 
            transition: all 0.3s ease;
        }
        .sync-idle { background: #e2e8f0; color: #64748b; }
        .sync-loading { background: #fef9c3; color: #a16207; }
        .sync-success { background: #dcfce7; color: #166534; }
        .sync-error { background: #fee2e2; color: #991b1b; }
        
        .spin-slow { animation: spin 2s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .role-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.2s;
            cursor: pointer;
            white-space: nowrap;
        }

        .staff-table { table-layout: fixed; width: 100%; }
        .col-staff { width: 55%; }
        .col-timing { width: 25%; }
        .col-actions { width: 20%; }

        .auto-textarea { resize: none; overflow: hidden; min-height: 60px; }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
        }

        .weekday-header {
            text-align: center;
            font-size: 9px;
            font-weight: 900;
            text-transform: uppercase;
            padding: 6px 0;
            background-color: #FFEED2;
            color: #1F1713;
            border-radius: 6px;
            margin-bottom: 4px;
        }

        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        
        .calendar-day.has-event::after {
            content: '';
            position: absolute;
            bottom: 6px;
            width: 50%;
            height: 2px;
            background: #000;
            border-radius: 1px;
            transition: background 0.2s;
        }

        .calendar-day.is-today.has-event::after,
        .calendar-day.has-unpaid-debt.has-event::after,
        .calendar-day.selected.has-event::after {
            background: #fff !important;
        }

        .calendar-day.is-today {
            background-color: #604539 !important;
            color: white !important;
            font-weight: 800 !important;
        }

        .calendar-day.has-unpaid-debt {
            background-color: #fee2e2 !important;
            color: #991b1b !important;
            font-weight: 700;
        }

        .calendar-day.past-date:not(.selected):not(.has-unpaid-debt):not(.is-today) {
            background-color: #f3f4f6;
            color: #9ca3af;
        }

        .calendar-day.status-error { box-shadow: inset 0 0 0 2.5px #ef4444; }
        .calendar-day.status-complete { box-shadow: inset 0 0 0 2.5px #22c55e; }
        .calendar-day.status-both { animation: flash-status 1.2s step-end infinite; }

        @keyframes flash-status {
            0%, 100% { box-shadow: inset 0 0 0 2.5px #ef4444; }
            50% { box-shadow: inset 0 0 0 2.5px #22c55e; }
        }

        .calendar-day.selected.status-error { box-shadow: 0 0 0 3px #ef4444; }
        .calendar-day.selected.status-complete { box-shadow: 0 0 0 3px #22c55e; }
        .calendar-day.selected.status-both { animation: flash-status-selected 1.2s step-end infinite; }

        @keyframes flash-status-selected {
            0%, 100% { box-shadow: 0 0 0 3px #ef4444; }
            50% { box-shadow: 0 0 0 3px #22c55e; }
        }

        .hidden-date-input { position: absolute; opacity: 0; width: 1px; height: 1px; overflow: hidden; pointer-events: none; }
        .calendar-nav-btn:hover { border-color: #60453950; }
        .file-name-container { width: 100%; overflow: hidden; }
        .file-name-text { word-wrap: break-word; overflow-wrap: break-word; word-break: normal; line-height: 1.2; display: block; }

        .autocomplete-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 2px solid #60453920;
            border-top: none;
            border-radius: 0 0 12px 12px;
            z-index: 50;
            max-height: 150px;
            overflow-y: auto;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .autocomplete-item {
            padding: 8px 12px;
            font-size: 12px;
            cursor: pointer;
            border-bottom: 1px solid #f3f4f6;
        }
        .autocomplete-item:hover { background-color: #FFECD2; }
        .autocomplete-item:last-child { border-bottom: none; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #60453920; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, useRef } = React;

        const GITHUB_CONFIG = {
            owner: 'she2pbis-byte',
            repo: 'vn',
            path: 'events_data.json',
            staffPath: 'staff_database.json',
            commonFilesPath: 'common_files_db.json'
        };

        const Icons = {
            Plus: ({size=20}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5v14M5 12h14"/></svg>,
            Trash: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18M19 6v14c0-1-1-2-2-2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>,
            Edit: ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>,
            Check: ({size=20, color="currentColor"}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17l-5-5"/></svg>,
            DoubleCheck: ({size=20, color="currentColor"}) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{ display: 'block' }}>
                    <path d="M7 12l2 2 5-5" /><path d="M13 12l2 2 5-5" opacity="0.6" />
                </svg>
            ),
            Clock: ({size=18, color="currentColor"}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
            ChevronLeft: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m15 18-6-6 6-6"/></svg>,
            ChevronRight: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m9 18 6-6 6-6"/></svg>,
            Calendar: ({size=20}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>,
            Cloche: ({size=14}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M2 20h20" /><path d="M20 20a8 8 0 0 0-16 0" /><circle cx="12" cy="12" r="1" /><path d="M12 12V10" /><path d="M11 10h2" /></svg>,
            Martini: ({size=14}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M8 22h8M12 11v11M19 2 12 11 5 2z"/></svg>,
            Droplet: ({size=14}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z" /></svg>,
            Pot: ({size=14}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 8h16" /><path d="M4 8v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8" /><path d="M10 8V5a1 1 0 0 1 1-1h2a1 1 0 0 1 1-1v3" /><path d="M2 11h2" /><path d="M20 11h2" /></svg>,
            Archive: ({size=20}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="21 8 21 21 3 21 3 8"></polyline><rect x="1" y="3" width="22" height="5"></rect><line x1="10" y1="12" x2="14" y2="12"></line></svg>,
            Users: ({size=18, color="currentColor"}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
            Refresh: ({size=14, className=""}) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>,
            X: ({size=20}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>,
            MapPin: ({size=14, color="currentColor"}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>,
            Paperclip: ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>,
            FileText: ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14.5 2 14.5 7.5 20 7.5"/></svg>,
            ExternalLink: ({size=14}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>,
            Phone: ({size=12, color="currentColor"}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>,
            User: ({size=14, color="currentColor"}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        };

        const formatPhoneNumber = (value) => {
            if (!value) return value;
            const phoneNumber = value.replace(/[^\d]/g, '');
            const phoneNumberLength = phoneNumber.length;
            if (phoneNumberLength < 2) return `+7`;
            if (phoneNumberLength < 5) return `+7 (${phoneNumber.slice(1, 4)}`;
            if (phoneNumberLength < 8) return `+7 (${phoneNumber.slice(1, 4)}) ${phoneNumber.slice(4, 7)}`;
            if (phoneNumberLength < 10) return `+7 (${phoneNumber.slice(1, 4)}) ${phoneNumber.slice(4, 7)}-${phoneNumber.slice(7, 9)}`;
            return `+7 (${phoneNumber.slice(1, 4)}) ${phoneNumber.slice(4, 7)}-${phoneNumber.slice(7, 9)}-${phoneNumber.slice(9, 11)}`;
        };

        const formatOnlyNumbers = (value) => value.replace(/[^\d]/g, '');

        const keyToLabel = { 'оф': 'Официант', 'бар': 'Бармен', 'мой': 'Мойщица', 'пов': 'Повар' };
        
        const getStaffCounts = (ev) => {
            const counts = { 'Официант': 0, 'Бармен': 0, 'Мойщица': 0, 'Повар': 0 };
            if (!ev || !ev.staff) return counts;
            ev.staff.forEach(s => {
                s.roles.forEach(role => { if (counts.hasOwnProperty(role)) counts[role]++; });
            });
            return counts;
        };

        const checkEventCompleteness = (ev) => {
            if (!ev || !ev.start) return false;
            if (ev.staff && ev.staff.length > 0) {
                if (ev.staff.some(s => !s.time)) return false;
            }
            const counts = getStaffCounts(ev);
            const rolesComplete = ['оф', 'бар', 'мой', 'пов'].every(roleKey => {
                const target = parseInt(ev.neededStaff?.[roleKey] || 0);
                const actual = counts[keyToLabel[roleKey]];
                return target === 0 || actual >= target;
            });
            if (!rolesComplete) return false;
            if (!ev.status?.checked) return false;
            return true;
        };

        const isEventFullyPaid = (ev) => {
            if (!ev || !ev.staff || ev.staff.length === 0) return true;
            return ev.staff.every(s => {
                if (!s.roles || s.roles.length === 0) return true;
                return s.roles.every(role => s.rolePaid && s.rolePaid[role] === true);
            });
        };

        const SimpleTimePicker = ({ value, onChange, colors, label, disabled }) => {
            const [inputValue, setInputValue] = useState(value || '');

            useEffect(() => {
                setInputValue(value || '');
            }, [value]);

            const handleInputChange = (e) => {
                let val = e.target.value.replace(/[^\d]/g, '');
                if (val.length > 4) val = val.slice(0, 4);

                let formatted = val;
                if (val.length >= 3) {
                    formatted = val.slice(0, 2) + ':' + val.slice(2);
                } else if (val.length > 0 && val.length <= 2) {
                    formatted = val;
                }
                
                setInputValue(formatted);
            };

            const handleBlur = () => {
                let clean = inputValue.replace(/[^\d]/g, '');
                if (!clean) {
                    onChange('');
                    return;
                }

                let h = "00", m = "00";

                if (clean.length === 1) {
                    h = clean.padStart(2, '0');
                } else if (clean.length === 2) {
                    h = clean;
                } else if (clean.length === 3) {
                    h = clean.slice(0, 1).padStart(2, '0');
                    m = clean.slice(1);
                } else if (clean.length === 4) {
                    h = clean.slice(0, 2);
                    m = clean.slice(2);
                }

                let hours = parseInt(h);
                let minutes = parseInt(m);

                if (hours > 23) hours = 23;
                if (minutes > 59) minutes = 59;

                const finalTime = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
                setInputValue(finalTime);
                onChange(finalTime);
            };

            return (
                <div className="flex-1">
                    {label && <p className="text-[9px] uppercase font-bold mb-1 opacity-40 ml-1">{label}</p>}
                    <input 
                        type="text"
                        inputMode="numeric"
                        value={inputValue}
                        onChange={handleInputChange}
                        onBlur={handleBlur}
                        placeholder="00:00"
                        disabled={disabled}
                        className="w-full py-2.5 px-2 rounded-xl border-2 bg-white text-center text-sm font-bold outline-none focus:border-[#C7886B] transition-all disabled:opacity-50"
                        style={{ borderColor: colors.accent + '20' }}
                    />
                </div>
            );
        };

        const Calendar = ({ events, onSelectDate, selectedDate, calendarRef }) => {
            const [currentMonth, setCurrentMonth] = useState(new Date(selectedDate || new Date()));
            const dateInputRef = useRef(null);
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const todayStr = today.toISOString().split('T')[0];
            
            const daysInMonth = (year, month) => new Date(year, month + 1, 0).getDate();
            const startDayOfMonth = (year, month) => {
                let day = new Date(year, month, 1).getDay();
                return day === 0 ? 6 : day - 1; 
            };

            const year = currentMonth.getFullYear();
            const month = currentMonth.getMonth();
            const days = daysInMonth(year, month);
            const startDay = startDayOfMonth(year, month);
            const monthName = currentMonth.toLocaleString('ru', { month: 'long' });

            const hasDebtInHistory = useMemo(() => {
                const firstDayOfCurrentView = new Date(year, month, 1);
                return events.some(ev => {
                    const evDate = new Date(ev.date);
                    return evDate < firstDayOfCurrentView && ev.date < todayStr && !isEventFullyPaid(ev);
                });
            }, [events, year, month, todayStr]);

            const prevMonth = (e) => { e.stopPropagation(); setCurrentMonth(new Date(year, month - 1, 1)); };
            const nextMonth = (e) => { e.stopPropagation(); setCurrentMonth(new Date(year, month + 1, 1)); };

            const handleJumpDate = (e) => {
                const dateVal = e.target.value;
                if (!dateVal) return;
                const d = new Date(dateVal);
                setCurrentMonth(new Date(d.getFullYear(), d.getMonth(), 1));
                onSelectDate(dateVal);
            };

            const triggerJump = (e) => {
                e.stopPropagation();
                if (dateInputRef.current) {
                    try {
                        if (dateInputRef.current.showPicker) {
                            dateInputRef.current.showPicker();
                        } else {
                            dateInputRef.current.focus();
                            dateInputRef.current.click();
                        }
                    } catch (err) {
                        dateInputRef.current.click();
                    }
                }
            };

            const calendarDays = [];
            for (let i = 0; i < startDay; i++) calendarDays.push(null);
            for (let i = 1; i <= days; i++) calendarDays.push(i);

            const isSelected = (day) => {
                if (!day || !selectedDate) return false;
                const d = new Date(selectedDate);
                return d.getDate() === day && d.getMonth() === month && d.getFullYear() === year;
            };

            const isToday = (day) => {
                if (!day) return false;
                return day === today.getDate() && month === today.getMonth() && year === today.getFullYear();
            };

            const isPast = (day) => {
                if (!day) return false;
                const d = new Date(year, month, day);
                return d < today;
            };

            const getDayEvents = (day) => {
                if (!day) return [];
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                return events.filter(e => e.date === dateStr);
            };

            const hasEvent = (day) => getDayEvents(day).length > 0;

            const hasUnpaidDebt = (day) => {
                if (!day || !isPast(day)) return false;
                const daysEvents = getDayEvents(day);
                if (daysEvents.length === 0) return false;
                return daysEvents.some(ev => !isEventFullyPaid(ev));
            };

            const getDayStatusClasses = (day) => {
                if (!day || isPast(day)) return "";
                const daysEvents = getDayEvents(day);
                if (daysEvents.length === 0) return "";
                
                const hasIncomplete = daysEvents.some(ev => !checkEventCompleteness(ev));
                const hasComplete = daysEvents.some(ev => checkEventCompleteness(ev));

                if (hasIncomplete && hasComplete) return "status-both";
                if (hasIncomplete) return "status-error";
                if (hasComplete) return "status-complete";
                return "";
            };

            return (
                <div ref={calendarRef} className="bg-white p-5 rounded-3xl border-2 border-[#604539] border-l-8 shadow-xl animate-in mb-6">
                    <div className="flex items-center justify-between mb-6">
                        <button 
                            onClick={prevMonth} 
                            className={`calendar-nav-btn w-10 h-10 flex items-center justify-center rounded-xl border-2 transition-all duration-300 font-black text-xl ${hasDebtInHistory ? 'bg-[#fee2e2] border-red-200 text-red-600 animate-pulse' : 'bg-white border-[#60453910] text-[#604539] hover:text-[#C7886B]'}`}
                        >
                            «
                        </button>
                        <div className="text-center">
                            <h3 className="font-black uppercase tracking-[0.2em] text-[#604539] text-sm leading-none">{monthName}</h3>
                            <span className="text-[10px] font-bold opacity-30 tracking-widest">{year}</span>
                        </div>
                        <button 
                            onClick={nextMonth} 
                            className="calendar-nav-btn w-10 h-10 flex items-center justify-center rounded-xl border-2 border-[#60453910] text-[#604539] hover:text-[#C7886B] transition-all duration-300 font-black text-xl"
                        >
                            »
                        </button>
                    </div>
                    <div className="calendar-grid mb-1">
                        {['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].map(d => (
                            <div key={d} className="weekday-header">{d}</div>
                        ))}
                        {calendarDays.map((day, idx) => {
                            const past = isPast(day);
                            const current = isToday(day);
                            const selected = isSelected(day);
                            const hasEv = hasEvent(day);
                            const unpaid = hasUnpaidDebt(day);
                            const statusClasses = getDayStatusClasses(day);

                            return (
                                <div 
                                    key={idx} 
                                    onClick={(e) => {
                                        if (day) {
                                            e.stopPropagation();
                                            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                                            onSelectDate(dateStr);
                                        }
                                    }}
                                    className={`
                                        calendar-day ${!day ? 'invisible' : ''} 
                                        ${unpaid && !selected && !current ? 'has-unpaid-debt' : ''}
                                        ${selected ? 'bg-[#C7886B] text-white font-black scale-110 z-10 selected' : ''}
                                        ${current && !selected ? 'is-today shadow-lg scale-105' : ''}
                                        ${!selected && !current && !unpaid && past ? 'past-date' : ''}
                                        ${!selected && !current && !unpaid && !past ? 'hover:bg-[#FFECD2]' : ''}
                                        ${hasEv ? 'has-event' : ''}
                                        ${statusClasses}
                                    `}
                                >
                                    {day}
                                </div>
                            );
                        })}
                    </div>
                    <div className="mt-4 pt-4 border-t border-[#60453910]">
                        <input 
                            ref={dateInputRef}
                            type="date" 
                            className="hidden-date-input" 
                            onChange={handleJumpDate}
                        />
                        <button 
                            onClick={triggerJump}
                            className="w-full py-2.5 px-4 bg-[#60453908] hover:bg-[#60453915] text-[#604539] rounded-xl flex items-center justify-center gap-2 transition-all border border-[#60453910]"
                        >
                            <Icons.Calendar size={14} />
                            <span className="text-[10px] font-bold uppercase tracking-widest">Перейти к дате</span>
                        </button>
                    </div>
                </div>
            );
        };

        const StaffList = ({ staffDatabase, events, onClose }) => {
            const getStaffPaymentStatus = (name) => {
                const todayStr = new Date().toISOString().split('T')[0];
                
                return events
                    .filter(ev => 
                        ev.staff && 
                        ev.staff.some(s => s.name.toLowerCase() === name.toLowerCase())
                    )
                    .map(ev => {
                        const staffEntry = ev.staff.find(s => s.name.toLowerCase() === name.toLowerCase());
                        const isPast = ev.date < todayStr;
                        
                        const hasUnpaidRole = staffEntry.roles.some(role => 
                            !staffEntry.rolePaid || staffEntry.rolePaid[role] !== true
                        );

                        return {
                            date: ev.date,
                            display: ev.date.split('-').slice(1).reverse().join('.'), 
                            isUnpaid: hasUnpaidRole,
                            isPast: isPast
                        };
                    })
                    .filter(status => !status.isPast || status.isUnpaid)
                    .sort((a, b) => a.date.localeCompare(b.date));
            };

            return (
                <div className="bg-white p-5 rounded-3xl border-2 border-[#604539] border-l-8 shadow-xl animate-in mb-6">
                    <div className="flex items-center justify-between mb-6">
                        <div className="flex items-center gap-2">
                            <Icons.Users size={18} className="text-[#604539]" />
                            <h3 className="font-black uppercase tracking-[0.2em] text-[#604539] text-sm leading-none">Смены сотрудников</h3>
                        </div>
                        <button onClick={onClose} className="p-1.5 text-gray-300 hover:text-red-500 transition-colors"><Icons.X size={20} /></button>
                    </div>
                    <div className="space-y-4 h-auto pr-2">
                        {staffDatabase.sort((a,b) => a.name.localeCompare(b.name)).map((s, idx) => {
                            const eventStatuses = getStaffPaymentStatus(s.name);
                            const hasAnyDebt = eventStatuses.some(status => status.isPast && status.isUnpaid);

                            return (
                                <div key={idx} className={`p-3 rounded-xl border transition-all ${hasAnyDebt ? 'bg-red-50 border-red-200' : 'bg-gray-50 border-[#60453910] hover:border-[#C7886B50]'}`}>
                                    <div className="flex justify-between items-start">
                                        <div className="flex items-center gap-2 min-w-0">
                                            {s.phone && (
                                                <a href={`tel:${s.phone}`} className="shrink-0 p-1.5 bg-[#C7886B20] text-[#C7886B] rounded-lg hover:bg-[#C7886B] hover:text-white transition-all" title={s.phone}>
                                                    <Icons.Phone size={14} />
                                                </a>
                                            )}
                                            <p className={`font-bold text-sm uppercase truncate ${hasAnyDebt ? 'text-red-700' : 'text-[#604539]'}`} onClick={() => window.setActiveStaffScheduleFromList && window.setActiveStaffScheduleFromList(s.name)} style={{cursor:'pointer'}}>
                                                {s.name}
                                            </p>
                                        </div>
                                        {hasAnyDebt && <span className="text-[10px] font-black bg-red-500 text-white px-2 py-0.5 rounded-full animate-pulse shrink-0 ml-2">ЖДЁТ ОПЛАТУ</span>}
                                    </div>

                                    {eventStatuses.length > 0 ? (
                                        <div className="mt-2 pt-2 border-t border-dashed border-[#60453910]">
                                            <p className="text-[10px] font-black uppercase text-gray-400 mb-1">Актуальные смены:</p>
                                            <div className="flex flex-wrap gap-1">
                                                {eventStatuses.map((status, sIdx) => (
                                                    <span 
                                                        key={sIdx} 
                                                        className={`text-[12px] font-bold px-1.5 py-0.5 rounded ${status.isPast && status.isUnpaid ? 'bg-red-500 text-white' : 'text-gray-500 bg-gray-200/50'}`}
                                                    >
                                                        {status.display}
                                                    </span>
                                                ))}
                                            </div>
                                        </div>
                                    ) : (
                                        <p className="text-[8px] font-black uppercase text-gray-300 mt-2">Нет записей</p>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const AutoHeightTextarea = ({ value, onChange, placeholder, className }) => {
            const textareaRef = useRef(null);

            const adjustHeight = () => {
                const textarea = textareaRef.current;
                if (textarea) {
                    textarea.style.height = 'auto';
                    textarea.style.height = `${textarea.scrollHeight}px`;
                }
            };

            useEffect(() => {
                adjustHeight();
            }, [value]);

            return (
                <textarea
                    ref={textareaRef}
                    value={value}
                    onChange={(e) => {
                        onChange(e);
                        adjustHeight();
                    }}
                    placeholder={placeholder}
                    className={`${className} auto-textarea`}
                />
            );
        };

        const StaffScheduleModal = ({ staffName, events, onClose, onSelectEvent, todayStr }) => {
            const staffFutureEvents = useMemo(() => {
                return events
                    .filter(ev => ev.date >= todayStr && ev.staff && ev.staff.some(s => s.name.toLowerCase() === staffName.toLowerCase()))
                    .sort((a, b) => a.date.localeCompare(b.date));
            }, [staffName, events, todayStr]);

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-[#1F1713]/80 backdrop-blur-sm">
                    <div className="bg-white w-full max-w-sm rounded-3xl shadow-2xl overflow-hidden border-2 border-[#604539]">
                        <div className="p-4 border-b border-[#60453910] flex items-center justify-between">
                            <div>
                                <h3 className="text-sm font-black uppercase text-[#604539] leading-tight">График работы</h3>
                                <p className="text-[10px] font-bold text-[#C7886B] uppercase tracking-widest mt-0.5">{staffName}</p>
                            </div>
                            <button onClick={onClose} className="p-1.5 bg-gray-50 rounded-lg text-gray-300 hover:text-red-500 transition-colors">
                                <Icons.X size={18} />
                            </button>
                        </div>
                        
                        <div className="p-4 max-h-[50vh] overflow-y-auto custom-scrollbar">
                            {staffFutureEvents.length > 0 ? (
                                <div className="space-y-3">
                                    {staffFutureEvents.map(ev => {
                                        const staffEntry = ev.staff.find(s => s.name.toLowerCase() === staffName.toLowerCase());
                                        return (
                                            <div 
                                                key={ev.id} 
                                                onClick={() => onSelectEvent(ev.id)}
                                                className="flex gap-3 p-3 bg-gray-50 rounded-xl border-2 border-transparent hover:border-[#FFECD2] transition-all cursor-pointer group active:scale-[0.98]"
                                            >
                                                <div className="w-10 shrink-0 flex flex-col items-center justify-center border-r-2 border-[#60453910] pr-3 group-hover:border-[#FFECD2]">
                                                    <span className="text-[8px] font-black uppercase text-gray-400">{new Date(ev.date).toLocaleString('ru', { month: 'short' })}</span>
                                                    <span className="text-lg font-black text-[#604539] leading-none">{new Date(ev.date).getDate()}</span>
                                                </div>
                                                <div className="flex-1 min-w-0 flex flex-col justify-center">
                                                    <p className="text-[15px] font-bold uppercase truncate text-[#1F1713] group-hover:text-[#C7886B]">{ev.name}</p>
                                                    <div className="flex items-center gap-2 mt-1.5">
                                                        <div className="flex items-center gap-1.5 text-[13.5px] font-bold text-[#C7886B]">
                                                            <Icons.Clock size={14} />
                                                            <span>{staffEntry.time || '—'}{staffEntry.end ? ` — ${staffEntry.end}` : ''}</span>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            ) : (
                                <div className="py-8 text-center">
                                    <div className="w-12 h-12 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-3 border-2 border-dashed border-gray-100">
                                        <Icons.Calendar size={18} className="text-gray-200" />
                                    </div>
                                    <p className="text-[9px] font-black uppercase tracking-widest text-gray-300">Мероприятий нет</p>
                                </div>
                            )}
                        </div>

                        <div className="p-3 bg-gray-50 border-t border-[#60453910]">
                            <button onClick={onClose} className="w-full py-2.5 bg-[#604539] text-white rounded-xl text-[9px] font-black uppercase tracking-widest">Закрыть</button>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('list');
            const [showArchive, setShowArchive] = useState(false);
            const [archiveFilter, setArchiveFilter] = useState('all');
            const [listFilter, setListFilter] = useState('all'); // 'all' or 'needs_staff'
            const [isFormOpen, setIsFormOpen] = useState(false);
            const [isCalendarOpen, setIsCalendarOpen] = useState(false);
            const [isStaffListOpen, setIsStaffListOpen] = useState(false);
            const [isStaffFormOpen, setIsStaffFormOpen] = useState(false);
            const [isCommonFilesOpen, setIsCommonFilesOpen] = useState(false);
            const [events, setEvents] = useState([]);
            const [staffDatabase, setStaffDatabase] = useState([]);
            const [commonFiles, setCommonFiles] = useState([]);
            const [selectedEventId, setSelectedEventId] = useState(null);
            const [filterDate, setFilterDate] = useState(null);
            const [githubToken, setGithubToken] = useState(() => localStorage.getItem('gh_token') || '');
            const [syncStatus, setSyncStatus] = useState('idle');
            const [isTokenVerified, setIsTokenVerified] = useState(false);
            const [isUploading, setIsUploading] = useState(false);
            const [showSuggestions, setShowSuggestions] = useState(false);
            const [showFormatSuggestions, setShowFormatSuggestions] = useState(false);
            const [showAdminSuggestions, setShowAdminSuggestions] = useState(false);
            const [activeStaffSchedule, setActiveStaffSchedule] = useState(null);

            const calendarRef = useRef(null);
            const calendarButtonRef = useRef(null);
            const fileInputRef = useRef(null);
            const commonFileInputRef = useRef(null);
            const staffFormRef = useRef(null);
            const eventFormRef = useRef(null);

            const colors = { bg: '#FFECD2', dark: '#1F1713', primary: '#604539', accent: '#C7886B' };
            const formats = ["Фуршет", "Кофе-брейк", "Банкет", "Чайный стол", "Туристы", "Доставка", "Самовывоз", "Дегустация", "Буфет", "Несколько накрытий"];
            const admins = ["Александр", "Илья", "Михаил", "Светлана", "ИВ"];

            window.setActiveStaffScheduleFromList = (name) => setActiveStaffSchedule(name);

            useEffect(() => {
                if (githubToken) {
                    verifyTokenAndFetchData();
                }
            }, [githubToken]);

            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (isCalendarOpen && calendarRef.current && !calendarRef.current.contains(event.target) && calendarButtonRef.current && !calendarButtonRef.current.contains(event.target)) {
                        setIsCalendarOpen(false);
                    }
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, [isCalendarOpen]);

            const verifyTokenAndFetchData = async () => {
                setSyncStatus('loading');
                try {
                    const response = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents`, {
                        headers: { 'Authorization': `token ${githubToken}` }
                    });
                    if (response.ok) {
                        setIsTokenVerified(true);
                        localStorage.setItem('gh_token', githubToken);
                        await Promise.all([fetchEvents(), fetchStaffDatabase(), fetchCommonFiles()]);
                        setSyncStatus('success');
                        setTimeout(() => setSyncStatus('idle'), 2000);
                    } else {
                        setIsTokenVerified(false);
                        setSyncStatus('error');
                    }
                } catch (error) {
                    setIsTokenVerified(false);
                    setSyncStatus('error');
                }
            };

            const fetchEvents = async () => {
                try {
                    const res = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}`, {
                        headers: { 'Authorization': `token ${githubToken}` }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        const content = decodeURIComponent(atob(data.content).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
                        setEvents(JSON.parse(content));
                    }
                } catch (e) { console.error(e); }
            };

            const fetchStaffDatabase = async () => {
                try {
                    const res = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.staffPath}`, {
                        headers: { 'Authorization': `token ${githubToken}` }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        const content = decodeURIComponent(atob(data.content).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
                        setStaffDatabase(JSON.parse(content));
                    }
                } catch (e) { console.error(e); }
            };

            const fetchCommonFiles = async () => {
                try {
                    const res = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.commonFilesPath}`, {
                        headers: { 'Authorization': `token ${githubToken}` }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        const content = decodeURIComponent(atob(data.content).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
                        setCommonFiles(JSON.parse(content));
                    }
                } catch (e) { console.error(e); }
            };

            const saveToGitHub = async (newEvents, newStaff, newFiles) => {
                setSyncStatus('loading');
                try {
                    const updateFile = async (path, contentData) => {
                        const fileRes = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${path}`, {
                            headers: { 'Authorization': `token ${githubToken}` }
                        });
                        let sha = '';
                        if (fileRes.ok) {
                            const fileData = await fileRes.json();
                            sha = fileData.sha;
                        }
                        const utf8Bytes = new TextEncoder().encode(JSON.stringify(contentData, null, 2));
                        const base64Content = btoa(String.fromCharCode(...utf8Bytes));
                        await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${path}`, {
                            method: 'PUT',
                            headers: { 'Authorization': `token ${githubToken}`, 'Content-Type': 'application/json' },
                            body: JSON.stringify({ message: `Update ${path}`, content: base64Content, sha })
                        });
                    };

                    if (newEvents) await updateFile(GITHUB_CONFIG.path, newEvents);
                    if (newStaff) await updateFile(GITHUB_CONFIG.staffPath, newStaff);
                    if (newFiles) await updateFile(GITHUB_CONFIG.commonFilesPath, newFiles);

                    setSyncStatus('success');
                    setTimeout(() => setSyncStatus('idle'), 2000);
                } catch (error) {
                    setSyncStatus('error');
                }
            };

            const uploadToImgbb = async (file) => {
                const formData = new FormData();
                formData.append('image', file);
                const res = await fetch('https://api.imgbb.com/1/upload?key=6df7b293526ae76a3e6c0c2998399580', {
                    method: 'POST',
                    body: formData
                });
                if (!res.ok) throw new Error('Ошибка imgbb');
                const data = await res.json();
                return { url: data.data.url, deleteUrl: data.data.delete_url };
            };

            const todayStr = new Date().toISOString().split('T')[0];

            const sortedEvents = useMemo(() => {
                return [...events].sort((a, b) => a.date.localeCompare(b.date));
            }, [events]);

            const { activeEvents, archivedEvents } = useMemo(() => {
                const active = sortedEvents.filter(e => e.date >= todayStr);
                const archived = sortedEvents.filter(e => e.date < todayStr).reverse();
                return { active, archived };
            }, [sortedEvents, todayStr]);

            const filteredEvents = useMemo(() => {
                let list = showArchive ? archivedEvents : activeEvents;
                
                if (filterDate) {
                    list = list.filter(e => e.date === filterDate);
                }

                if (!showArchive && listFilter === 'needs_staff') {
                    list = list.filter(e => !checkEventCompleteness(e));
                }

                if (showArchive && archiveFilter !== 'all') {
                    if (archiveFilter === 'unpaid') {
                        list = list.filter(e => !isEventFullyPaid(e));
                    } else if (archiveFilter === 'completed') {
                        list = list.filter(e => checkEventCompleteness(e) && isEventFullyPaid(e));
                    }
                }

                return list;
            }, [showArchive, activeEvents, archivedEvents, filterDate, listFilter, archiveFilter]);

            const selectedEvent = events.find(e => e.id === selectedEventId);

            const [eventForm, setEventForm] = useState({
                id: '', name: '', date: '', start: '', end: '', location: '', format: '', admin: '', comment: '', files: [],
                neededStaff: { оф: '0', бар: '0', мой: '0', пов: '0' }, staff: [], status: { checked: false, text: '' }
            });

            const [staffForm, setStaffForm] = useState({ id: '', name: '', phone: '' });

            const handleOpenForm = (event = null) => {
                if (event) {
                    setEventForm({
                        ...event,
                        end: event.end || '',
                        format: event.format || '',
                        admin: event.admin || '',
                        comment: event.comment || '',
                        files: event.files || [],
                        neededStaff: event.neededStaff || { оф: '0', бар: '0', мой: '0', пов: '0' },
                        staff: event.staff || [],
                        status: event.status || { checked: false, text: '' }
                    });
                } else {
                    setEventForm({
                        id: Date.now().toString(),
                        name: '', date: filterDate || todayStr, start: '', end: '', location: '', format: '', admin: '', comment: '', files: [],
                        neededStaff: { оф: '0', бар: '0', мой: '0', пов: '0' }, staff: [], status: { checked: false, text: '' }
                    });
                }
                setIsFormOpen(true);
                setTimeout(() => {
                    if(eventFormRef.current) eventFormRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 100);
            };

            const handleSaveEvent = async () => {
                if (!eventForm.name || !eventForm.date || !eventForm.start || !eventForm.location) {
                    alert('Заполните Название, Дату, Время начала и Место!');
                    return;
                }
                let updated;
                if (events.some(e => e.id === eventForm.id)) {
                    updated = events.map(e => e.id === eventForm.id ? eventForm : e);
                } else {
                    updated = [...events, eventForm];
                }
                setEvents(updated);
                setIsFormOpen(false);
                setSelectedEventId(eventForm.id);
                await saveToGitHub(updated, null, null);
            };

            const handleDeleteEvent = async (id) => {
                if (confirm('Удалить мероприятие?')) {
                    const updated = events.filter(e => e.id !== id);
                    setEvents(updated);
                    setSelectedEventId(null);
                    await saveToGitHub(updated, null, null);
                }
            };

            const handleAddStaffToEvent = (person) => {
                if (eventForm.staff.some(s => s.name.toLowerCase() === person.name.toLowerCase())) return;
                const newStaff = [...eventForm.staff, {
                    id: Date.now().toString() + Math.random(),
                    name: person.name,
                    roles: ['оф'],
                    time: eventForm.start,
                    end: eventForm.end || '',
                    rolePaid: { 'оф': false }
                }].sort((a,b) => a.name.localeCompare(b.name));
                setEventForm({ ...eventForm, staff: newStaff });
            };

            const handleRemoveStaffFromEvent = (id) => {
                setEventForm({ ...eventForm, staff: eventForm.staff.filter(s => s.id !== id) });
            };

            const handleStaffRoleChange = (staffId, role) => {
                const updatedStaff = eventForm.staff.map(s => {
                    if (s.id !== staffId) return s;
                    let newRoles = [...s.roles];
                    let currentPaid = s.rolePaid || {};
                    let newPaid = { ...currentPaid };

                    if (newRoles.includes(role)) {
                        if (newRoles.length > 1) {
                            newRoles = newRoles.filter(r => r !== role);
                            delete newPaid[role];
                        }
                    } else {
                        newRoles.push(role);
                        newPaid[role] = currentPaid[role] || false;
                    }
                    return { ...s, roles: newRoles, rolePaid: newPaid };
                });
                setEventForm({ ...eventForm, staff: updatedStaff });
            };

            const handleStaffTimeChange = (staffId, field, value) => {
                const updatedStaff = eventForm.staff.map(s => s.id === staffId ? { ...s, [field]: value } : s);
                setEventForm({ ...eventForm, staff: updatedStaff });
            };

            const handleRolePaidToggle = (staffId, role) => {
                const updatedStaff = eventForm.staff.map(s => {
                    if (s.id !== staffId) return s;
                    const currentPaid = s.rolePaid || {};
                    return {
                        ...s,
                        rolePaid: {
                            ...currentPaid,
                            [role]: !currentPaid[role]
                        }
                    };
                });
                setEventForm({ ...eventForm, staff: updatedStaff });
            };

            const handleFileUpload = async (e, type = 'event') => {
                const files = e.target.files;
                if (!files || files.length === 0) return;
                setIsUploading(true);
                try {
                    const uploadedList = [];
                    for (let i = 0; i < files.length; i++) {
                        const resData = await uploadToImgbb(files[i]);
                        uploadedList.push({
                            id: Date.now().toString() + Math.random(),
                            name: files[i].name,
                            url: resData.url,
                            deleteUrl: resData.deleteUrl
                        });
                    }
                    if (type === 'event') {
                        setEventForm(prev => ({ ...prev, files: [...(prev.files || []), ...uploadedList] }));
                    } else {
                        const updatedFiles = [...commonFiles, ...uploadedList];
                        setCommonFiles(updatedFiles);
                        await saveToGitHub(null, null, updatedFiles);
                    }
                } catch (err) {
                    alert('Ошибка загрузки файлов');
                } finally {
                    setIsUploading(false);
                }
            };

            const handleFileDelete = async (fileObj, type = 'event') => {
                if (!confirm('Удалить файл?')) return;
                if (type === 'event') {
                    setEventForm(prev => ({ ...prev, files: prev.files.filter(f => f.id !== fileObj.id) }));
                } else {
                    const updatedFiles = commonFiles.filter(f => f.id !== fileObj.id);
                    setCommonFiles(updatedFiles);
                    await saveToGitHub(null, null, updatedFiles);
                }
            };

            const handleFileDownload = (fileObj) => {
                window.open(fileObj.url, '_blank');
            };

            const handleSaveStaffDatabase = async () => {
                if (!staffForm.name) return;
                let updated;
                const cleanPhone = staffForm.phone ? formatPhoneNumber(staffForm.phone) : '';
                const personData = { ...staffForm, phone: cleanPhone };

                if (staffForm.id && staffDatabase.some(s => s.id === staffForm.id)) {
                    updated = staffDatabase.map(s => s.id === staffForm.id ? personData : s);
                } else {
                    updated = [...staffDatabase, { ...personData, id: Date.now().toString() }];
                }
                setStaffDatabase(updated);
                setStaffForm({ id: '', name: '', phone: '' });
                setIsStaffFormOpen(false);
                await saveToGitHub(null, updated, null);
            };

            const handleDeleteStaffDatabase = async (id) => {
                if (confirm('Удалить сотрудника из базы?')) {
                    const updated = staffDatabase.filter(s => s.id !== id);
                    setStaffDatabase(updated);
                    await saveToGitHub(null, updated, null);
                }
            };

            const handleEditStaffFromDatabase = (person) => {
                setStaffForm(person);
                setIsStaffFormOpen(true);
                setTimeout(() => {
                    if(staffFormRef.current) staffFormRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 100);
            };

            const availableStaffSuggestions = useMemo(() => {
                if (!eventForm.name) return [];
                return staffDatabase.filter(s => 
                    !eventForm.staff.some(es => es.name.toLowerCase() === s.name.toLowerCase())
                );
            }, [staffDatabase, eventForm.staff, eventForm.name]);

            return (
                <div className="max-w-md mx-auto p-4 pb-24 text-[#1F1713]">
                    <div className="flex items-center justify-between mb-4 mt-2">
                        <div className="flex items-center gap-2">
                            <span className="text-xl font-black uppercase tracking-wider text-[#604539]">Catering</span>
                            <span className="text-[10px] font-black uppercase bg-[#604539] text-[#FFEED2] px-2 py-0.5 rounded-md tracking-widest">PRO</span>
                        </div>
                        <div className="flex items-center gap-2">
                            <div className={`sync-status ${
                                syncStatus === 'loading' ? 'sync-loading' : 
                                syncStatus === 'success' ? 'sync-success' : 
                                syncStatus === 'error' ? 'sync-error' : 'sync-idle'
                            }`}>
                                {syncStatus === 'loading' && <Icons.Refresh size={10} className="spin-slow" />}
                                {syncStatus === 'success' && <Icons.Check size={10} />}
                                {syncStatus === 'error' && <Icons.X size={10} />}
                                <span className="uppercase tracking-widest">
                                    {syncStatus === 'loading' ? 'Синхронизация...' : 
                                     syncStatus === 'success' ? 'Готово' : 
                                     syncStatus === 'error' ? 'Ошибка' : 'Облако'}
                                </span>
                            </div>
                        </div>
                    </div>

                    {!isTokenVerified && (
                        <div className="bg-white p-5 rounded-3xl border-2 border-[#604539] border-l-8 shadow-xl mb-6 animate-in">
                            <p className="text-[10px] uppercase font-black tracking-widest text-[#604539] opacity-40 mb-2">Авторизация через GitHub Token</p>
                            <div className="flex gap-2">
                                <input 
                                    type="password" 
                                    value={githubToken} 
                                    onChange={(e) => setGithubToken(e.target.value)}
                                    placeholder="Вставьте ваш GitHub токен..." 
                                    className="flex-1 py-2 px-3 border-2 border-[#60453920] rounded-xl text-sm font-bold outline-none focus:border-[#C7886B] transition-all"
                                />
                                <button 
                                    onClick={verifyTokenAndFetchData}
                                    className="py-2 px-4 bg-[#604539] hover:bg-[#C7886B] text-white rounded-xl text-xs font-bold uppercase tracking-wider transition-colors shrink-0"
                                >
                                    Вход
                                </button>
                            </div>
                        </div>
                    )}

                    {isTokenVerified && (
                        <>
                            <div className="flex gap-2 mb-6">
                                <button 
                                    ref={calendarButtonRef}
                                    onClick={() => { setIsCalendarOpen(!isCalendarOpen); setIsStaffListOpen(false); }}
                                    className={`flex-1 py-3 px-4 rounded-2xl border-2 font-black text-[10px] uppercase tracking-widest flex items-center justify-center gap-2 transition-all shadow-md ${filterDate ? 'bg-[#C7886B] border-[#C7886B] text-white' : 'bg-white border-[#604539] text-[#604539]'}`}
                                >
                                    <Icons.Calendar size={14} />
                                    <span>{filterDate ? filterDate.split('-').reverse().join('.') : 'КАЛЕНДАРЬ'}</span>
                                </button>
                                <button 
                                    onClick={() => { setIsStaffListOpen(!isStaffListOpen); setIsCalendarOpen(false); }}
                                    className={`flex-1 py-3 px-4 rounded-2xl border-2 font-black text-[10px] uppercase tracking-widest flex items-center justify-center gap-2 transition-all shadow-md ${isStaffListOpen ? 'bg-[#604539] border-[#604539] text-white' : 'bg-white border-[#604539] text-[#604539]'}`}
                                >
                                    <Icons.Users size={14} />
                                    <span>СОТРУДНИКИ</span>
                                </button>
                            </div>

                            {isCalendarOpen && (
                                <Calendar 
                                    events={events} 
                                    selectedDate={filterDate} 
                                    calendarRef={calendarRef}
                                    onSelectDate={(date) => {
                                        setFilterDate(date === filterDate ? null : date);
                                        setIsCalendarOpen(false);
                                        setSelectedEventId(null);
                                    }} 
                                />
                            )}

                            {isStaffListOpen && (
                                <StaffList 
                                    staffDatabase={staffDatabase} 
                                    events={events} 
                                    onClose={() => setIsStaffListOpen(false)} 
                                />
                            )}

                            {activeStaffSchedule && (
                                <StaffScheduleModal 
                                    staffName={activeStaffSchedule}
                                    events={events}
                                    todayStr={todayStr}
                                    onClose={() => setActiveStaffSchedule(null)}
                                    onSelectEvent={(eventId) => {
                                        setSelectedEventId(eventId);
                                        const foundEv = events.find(e => e.id === eventId);
                                        if (foundEv) {
                                            setShowArchive(foundEv.date < todayStr);
                                            setFilterDate(null);
                                        }
                                        setActiveStaffSchedule(null);
                                        setIsStaffListOpen(false);
                                    }}
                                />
                            )}

                            <div className="flex border-b-2 border-[#60453915] mb-4">
                                <button 
                                    onClick={() => { setShowArchive(false); setFilterDate(null); setSelectedEventId(null); }}
                                    className={`flex-1 pb-3 text-xs font-black uppercase tracking-widest transition-all ${!showArchive ? 'text-[#604539] border-b-4 border-[#604539] scale-105' : 'text-gray-400 opacity-60'}`}
                                >
                                    Предстоящие ({activeEvents.length})
                                </button>
                                <button 
                                    onClick={() => { setShowArchive(true); setFilterDate(null); setSelectedEventId(null); }}
                                    className={`flex-1 pb-3 text-xs font-black uppercase tracking-widest transition-all ${showArchive ? 'text-[#604539] border-b-4 border-[#604539] scale-105' : 'text-gray-400 opacity-60'}`}
                                >
                                    Архив ({archivedEvents.length})
                                </button>
                            </div>

                            {filterDate && (
                                <div className="mb-4 p-3 bg-white rounded-2xl border-2 border-dashed border-[#C7886B] flex items-center justify-between animate-in">
                                    <div className="flex items-center gap-2">
                                        <div className="w-2 h-2 bg-[#C7886B] rounded-full animate-ping" />
                                        <p className="text-[10px] font-black uppercase text-[#C7886B] tracking-wider">Фильтр по дате: {filterDate.split('-').reverse().join('.')}</p>
                                    </div>
                                    <button onClick={() => setFilterDate(null)} className="text-[9px] font-black uppercase tracking-widest bg-gray-100 hover:bg-gray-200 text-gray-500 py-1 px-2.5 rounded-lg transition-colors">Сбросить</button>
                                </div>
                            )}

                            {!showArchive ? (
                                <div className="flex gap-1 bg-white p-1 rounded-xl border border-[#60453910] mb-4">
                                    <button 
                                        onClick={() => setListFilter('all')}
                                        className={`flex-1 py-1.5 text-[9px] font-black uppercase tracking-widest rounded-lg transition-all ${listFilter === 'all' ? 'bg-[#FFECD2] text-[#604539]' : 'text-gray-400'}`}
                                    >
                                        Все
                                    </button>
                                    <button 
                                        onClick={() => setListFilter('needs_staff')}
                                        className={`flex-1 py-1.5 text-[9px] font-black uppercase tracking-widest rounded-lg transition-all ${listFilter === 'needs_staff' ? 'bg-red-500 text-white animate-pulse' : 'text-gray-400'}`}
                                    >
                                        Нужен персонал
                                    </button>
                                </div>
                            ) : (
                                <div className="flex gap-1 bg-white p-1 rounded-xl border border-[#60453910] mb-4">
                                    {['all', 'unpaid', 'completed'].map((fKey) => (
                                        <button
                                            key={fKey}
                                            onClick={() => setArchiveFilter(fKey)}
                                            className={`flex-1 py-1.5 text-[9px] font-black uppercase tracking-widest rounded-lg transition-all ${
                                                archiveFilter === fKey 
                                                    ? fKey === 'unpaid' ? 'bg-red-500 text-white' : 'bg-[#FFECD2] text-[#604539]'
                                                    : 'text-gray-400'
                                            }`}
                                        >
                                            {fKey === 'all' ? 'Все' : fKey === 'unpaid' ? 'Ждут оплату' : 'Закрытые'}
                                        </button>
                                    ))}
                                </div>
                            )}

                            {filteredEvents.length === 0 ? (
                                <div className="bg-white/40 py-12 rounded-3xl border-2 border-dashed border-[#60453910] text-center mb-6">
                                    <p className="text-[10px] font-black uppercase tracking-widest text-gray-400">Нет мероприятий</p>
                                </div>
                            ) : (
                                <div className="space-y-2.5 mb-6">
                                    {filteredEvents.map(ev => {
                                        const isSelected = ev.id === selectedEventId;
                                        const counts = getStaffCounts(ev);
                                        const isComplete = checkEventCompleteness(ev);
                                        const fullyPaid = isEventFullyPaid(ev);

                                        return (
                                            <div key={ev.id} className="bg-white rounded-3xl border-2 border-[#604539] border-l-8 shadow-md overflow-hidden transition-all duration-300">
                                                <div 
                                                    onClick={() => setSelectedEventId(isSelected ? null : ev.id)}
                                                    className="p-4 cursor-pointer hover:bg-gray-50 flex items-start justify-between gap-3"
                                                >
                                                    <div className="min-w-0 flex-1">
                                                        <div className="flex items-center gap-2 mb-1.5 flex-wrap">
                                                            <span className="text-[11px] font-black text-[#C7886B] uppercase tracking-wider">{ev.date.split('-').reverse().join('.')}</span>
                                                            <span className="text-[11px] font-bold text-gray-400 flex items-center gap-1">
                                                                <Icons.Clock size={12} /> {ev.start}{ev.end ? `-${ev.end}` : ''}
                                                            </span>
                                                            {ev.format && (
                                                                <span className="text-[10px] font-black uppercase px-2 py-0.5 bg-[#FFECD2] text-[#604539] rounded-md tracking-wider">
                                                                    {ev.format}
                                                                </span>
                                                            )}
                                                            {ev.admin && (
                                                                <span className="text-[10px] font-black uppercase px-2 py-0.5 bg-gray-100 text-gray-600 rounded-md tracking-wider flex items-center gap-1">
                                                                    <Icons.User size={10} /> {ev.admin}
                                                                </span>
                                                            )}
                                                        </div>
                                                        <h4 className="font-black text-[16px] uppercase tracking-tight text-[#1F1713] leading-tight mb-2 break-words">{ev.name}</h4>
                                                        <p className="text-xs font-bold text-gray-400 flex items-center gap-1 truncate"><Icons.MapPin size={12} className="text-[#C7886B] shrink-0" />{ev.location}</p>
                                                    </div>
                                                    
                                                    <div className="flex flex-col items-end gap-1.5 shrink-0">
                                                        {showArchive ? (
                                                            fullyPaid ? (
                                                                <span className="text-[9px] font-black uppercase bg-green-100 text-green-700 px-2 py-1 rounded-full border border-green-200">Оплачено</span>
                                                            ) : (
                                                                <span className="text-[9px] font-black uppercase bg-red-500 text-white px-2 py-1 rounded-full animate-pulse">ДОЛГ</span>
                                                            )
                                                        ) : (
                                                            isComplete ? (
                                                                <span className="text-[9px] font-black uppercase bg-green-100 text-green-700 px-2 py-1 rounded-full border border-green-200 flex items-center gap-1">
                                                                    <Icons.DoubleCheck size={12} color="#15803d" /> ГОТОВО
                                                                </span>
                                                            ) : (
                                                                <span className="text-[9px] font-black uppercase bg-amber-100 text-amber-700 px-2 py-1 rounded-full border border-amber-200 animate-pulse">НАБОР</span>
                                                            )
                                                        )}
                                                        <div className="flex gap-1 text-[10px] font-black text-gray-400 bg-gray-50 px-2 py-1 rounded-xl border border-gray-100">
                                                            <span>О:{counts['Официант']}</span>
                                                            <span>Б:{counts['Бармен']}</span>
                                                            <span>М:{counts['Мойщица']}</span>
                                                            <span>П:{counts['Повар']}</span>
                                                        </div>
                                                    </div>
                                                </div>

                                                {isSelected && (
                                                    <div className="border-t border-[#60453910] bg-gray-50/50 p-4 animate-in space-y-4">
                                                        {ev.comment && (
                                                            <div className="bg-white p-3 rounded-2xl border border-[#60453908]">
                                                                <p className="text-[9px] uppercase font-black tracking-widest text-gray-400 mb-1">Комментарий</p>
                                                                <p className="text-xs font-medium text-[#1F1713] whitespace-pre-wrap break-words">{ev.comment}</p>
                                                            </div>
                                                        )}

                                                        {ev.files && ev.files.length > 0 && (
                                                            <div className="space-y-1.5">
                                                                <p className="text-[9px] uppercase font-black tracking-widest text-gray-400 ml-1">Прикрепленные файлы ({ev.files.length})</p>
                                                                <div className="grid grid-cols-1 gap-1.5">
                                                                    {ev.files.map(file => (
                                                                        <div key={file.id} className="flex items-center justify-between p-2.5 bg-white rounded-xl border border-gray-100 shadow-sm min-w-0">
                                                                            <div className="flex items-center gap-2 min-w-0 flex-1">
                                                                                <Icons.FileText size={16} className="text-[#C7886B] shrink-0" />
                                                                                <div className="file-name-container flex-1">
