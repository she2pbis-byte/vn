<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>АДМИН</title>
    <link rel="icon" type="image/x-icon" href="catering-b.ico">

    <meta name="theme-color" content="#FFEED2">
    <meta name="msapplication-navbutton-color" content="#FFEED2">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #FFECD2; scroll-behavior: smooth; }
        .animate-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .sync-status { 
            font-size: 10px; 
            font-weight: 800; 
            padding: 4px 12px; 
            border-radius: 99px; 
            min-width: 100px; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            line-height: 1.4; 
            letter-spacing: 0.05em; 
            transition: all 0.3s ease;
        }
        .sync-idle { background: #e2e8f0; color: #64748b; }
        .sync-loading { background: #fef9c3; color: #a16207; }
        .sync-success { background: #dcfce7; color: #166534; }
        .sync-error { background: #fee2e2; color: #991b1b; }
        
        .spin-slow { animation: spin 2s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .role-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.2s;
            cursor: pointer;
            white-space: nowrap;
        }

        .staff-table { table-layout: fixed; width: 100%; }
        .col-staff { width: 55%; }
        .col-timing { width: 25%; }
        .col-actions { width: 20%; }

        .auto-textarea { resize: none; overflow: hidden; min-height: 60px; }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
        }

        .weekday-header {
            text-align: center;
            font-size: 9px;
            font-weight: 900;
            text-transform: uppercase;
            padding: 6px 0;
            background-color: #FFEED2;
            color: #1F1713;
            border-radius: 6px;
            margin-bottom: 4px;
        }

        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        
        .calendar-day.has-event::after {
            content: '';
            position: absolute;
            bottom: 6px;
            width: 50%;
            height: 2px;
            background: #000;
            border-radius: 1px;
            transition: background 0.2s;
        }

        .calendar-day.is-today.has-event::after,
        .calendar-day.has-unpaid-debt.has-event::after,
        .calendar-day.selected.has-event::after {
            background: #fff !important;
        }

        .calendar-day.is-today {
            background-color: #604539 !important;
            color: white !important;
            font-weight: 800 !important;
        }

        .calendar-day.has-unpaid-debt {
            background-color: #fee2e2 !important;
            color: #991b1b !important;
            font-weight: 700;
        }

        .calendar-day.past-date:not(.selected):not(.has-unpaid-debt):not(.is-today) {
            background-color: #f3f4f6;
            color: #9ca3af;
        }

        .calendar-day.status-error { box-shadow: inset 0 0 0 2.5px #ef4444; }
        .calendar-day.status-complete { box-shadow: inset 0 0 0 2.5px #22c55e; }
        .calendar-day.status-both { animation: flash-status 1.2s step-end infinite; }

        @keyframes flash-status {
            0%, 100% { box-shadow: inset 0 0 0 2.5px #ef4444; }
            50% { box-shadow: inset 0 0 0 2.5px #22c55e; }
        }

        .calendar-day.selected.status-error { box-shadow: 0 0 0 3px #ef4444; }
        .calendar-day.selected.status-complete { box-shadow: 0 0 0 3px #22c55e; }
        .calendar-day.selected.status-both { animation: flash-status-selected 1.2s step-end infinite; }

        @keyframes flash-status-selected {
            0%, 100% { box-shadow: 0 0 0 3px #ef4444; }
            50% { box-shadow: 0 0 0 3px #22c55e; }
        }

        .hidden-date-input { position: absolute; opacity: 0; width: 1px; height: 1px; overflow: hidden; pointer-events: none; }
        .calendar-nav-btn:hover { border-color: #60453950; }
        .file-name-container { width: 100%; overflow: hidden; }
        .file-name-text { word-wrap: break-word; overflow-wrap: break-word; word-break: normal; line-height: 1.2; display: block; }

        .autocomplete-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 2px solid #60453920;
            border-top: none;
            border-radius: 0 0 12px 12px;
            z-index: 50;
            max-height: 150px;
            overflow-y: auto;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .autocomplete-item {
            padding: 8px 12px;
            font-size: 12px;
            cursor: pointer;
            border-bottom: 1px solid #f3f4f6;
        }
        .autocomplete-item:hover { background-color: #FFECD2; }
        .autocomplete-item:last-child { border-bottom: none; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #60453920; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, useRef } = React;

        const GITHUB_CONFIG = {
            owner: 'she2pbis-byte',
            repo: 'vn',
            path: 'events_data.json',
            staffPath: 'staff_database.json',
            commonFilesPath: 'common_files_db.json'
        };

        const Icons = {
            Plus: ({size=20}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5v14M5 12h14"/></svg>,
            Trash: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18M19 6v14c0-1-1-2-2-2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>,
            Edit: ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>,
            Check: ({size=20, color="currentColor"}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17l-5-5"/></svg>,
            DoubleCheck: ({size=20, color="currentColor"}) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{ display: 'block' }}>
                    <path d="M7 12l2 2 5-5" /><path d="M13 12l2 2 5-5" opacity="0.6" />
                </svg>
            ),
            Clock: ({size=18, color="currentColor"}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
            ChevronLeft: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m15 18-6-6 6-6"/></svg>,
            ChevronRight: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m9 18 6-6 6-6"/></svg>,
            Calendar: ({size=20}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>,
            Cloche: ({size=14}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M2 20h20" /><path d="M20 20a8 8 0 0 0-16 0" /><circle cx="12" cy="12" r="1" /><path d="M12 12V10" /><path d="M11 10h2" /></svg>,
            Martini: ({size=14}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M8 22h8M12 11v11M19 2 12 11 5 2z"/></svg>,
            Droplet: ({size=14}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z" /></svg>,
            Pot: ({size=14}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 8h16" /><path d="M4 8v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8" /><path d="M10 8V5a1 1 0 0 1 1-1h2a1 1 0 0 1 1-1v3" /><path d="M2 11h2" /><path d="M20 11h2" /></svg>,
            Archive: ({size=20}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="21 8 21 21 3 21 3 8"></polyline><rect x="1" y="3" width="22" height="5"></rect><line x1="10" y1="12" x2="14" y2="12"></line></svg>,
            Users: ({size=18, color="currentColor"}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
            Refresh: ({size=14, className=""}) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>,
            X: ({size=20}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>,
            MapPin: ({size=14, color="currentColor"}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>,
            Paperclip: ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>,
            FileText: ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14.5 2 14.5 7.5 20 7.5"/></svg>,
            ExternalLink: ({size=14}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>,
            Phone: ({size=12, color="currentColor"}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>,
            User: ({size=14, color="currentColor"}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        };

        const formatPhoneNumber = (value) => {
            if (!value) return value;
            const phoneNumber = value.replace(/[^\d]/g, '');
            const phoneNumberLength = phoneNumber.length;
            if (phoneNumberLength < 2) return `+7`;
            if (phoneNumberLength < 5) return `+7 (${phoneNumber.slice(1, 4)}`;
            if (phoneNumberLength < 8) return `+7 (${phoneNumber.slice(1, 4)}) ${phoneNumber.slice(4, 7)}`;
            if (phoneNumberLength < 10) return `+7 (${phoneNumber.slice(1, 4)}) ${phoneNumber.slice(4, 7)}-${phoneNumber.slice(7, 9)}`;
            return `+7 (${phoneNumber.slice(1, 4)}) ${phoneNumber.slice(4, 7)}-${phoneNumber.slice(7, 9)}-${phoneNumber.slice(9, 11)}`;
        };

        const formatOnlyNumbers = (value) => value.replace(/[^\d]/g, '');

        const keyToLabel = { 'оф': 'Официант', 'бар': 'Бармен', 'мой': 'Мойщица', 'пов': 'Повар' };
        
        const getStaffCounts = (ev) => {
            const counts = { 'Официант': 0, 'Бармен': 0, 'Мойщица': 0, 'Повар': 0 };
            if (!ev || !ev.staff) return counts;
            ev.staff.forEach(s => {
                s.roles.forEach(role => { if (counts.hasOwnProperty(role)) counts[role]++; });
            });
            return counts;
        };

        const checkEventCompleteness = (ev) => {
            if (!ev || !ev.start) return false;
            if (ev.staff && ev.staff.length > 0) {
                if (ev.staff.some(s => !s.time)) return false;
            }
            const counts = getStaffCounts(ev);
            const rolesComplete = ['оф', 'бар', 'мой', 'пов'].every(roleKey => {
                const target = parseInt(ev.neededStaff?.[roleKey] || 0);
                const actual = counts[keyToLabel[roleKey]];
                return target === 0 || actual >= target;
            });
            if (!rolesComplete) return false;
            if (!ev.status?.checked) return false;
            return true;
        };

        const isEventFullyPaid = (ev) => {
            if (!ev || !ev.staff || ev.staff.length === 0) return true;
            return ev.staff.every(s => {
                if (!s.roles || s.roles.length === 0) return true;
                return s.roles.every(role => s.rolePaid && s.rolePaid[role] === true);
            });
        };

        const SimpleTimePicker = ({ value, onChange, colors, label, disabled }) => {
            const [inputValue, setInputValue] = useState(value || '');

            useEffect(() => {
                setInputValue(value || '');
            }, [value]);

            const handleInputChange = (e) => {
                let val = e.target.value.replace(/[^\d]/g, '');
                if (val.length > 4) val = val.slice(0, 4);

                let formatted = val;
                if (val.length >= 3) {
                    formatted = val.slice(0, 2) + ':' + val.slice(2);
                } else if (val.length > 0 && val.length <= 2) {
                    formatted = val;
                }
                
                setInputValue(formatted);
            };

            const handleBlur = () => {
                let clean = inputValue.replace(/[^\d]/g, '');
                if (!clean) {
                    onChange('');
                    return;
                }

                let h = "00", m = "00";

                if (clean.length === 1) {
                    h = clean.padStart(2, '0');
                } else if (clean.length === 2) {
                    h = clean;
                } else if (clean.length === 3) {
                    h = clean.slice(0, 1).padStart(2, '0');
                    m = clean.slice(1);
                } else if (clean.length === 4) {
                    h = clean.slice(0, 2);
                    m = clean.slice(2);
                }

                let hours = parseInt(h);
                let minutes = parseInt(m);

                if (hours > 23) hours = 23;
                if (minutes > 59) minutes = 59;

                const finalTime = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
                setInputValue(finalTime);
                onChange(finalTime);
            };

            return (
                <div className="flex-1">
                    {label && <p className="text-[9px] uppercase font-bold mb-1 opacity-40 ml-1">{label}</p>}
                    <input 
                        type="text"
                        inputMode="numeric"
                        value={inputValue}
                        onChange={handleInputChange}
                        onBlur={handleBlur}
                        placeholder="00:00"
                        disabled={disabled}
                        className="w-full py-2.5 px-2 rounded-xl border-2 bg-white text-center text-sm font-bold outline-none focus:border-[#C7886B] transition-all disabled:opacity-50"
                        style={{ borderColor: colors.accent + '20' }}
                    />
                </div>
            );
        };

        const Calendar = ({ events, onSelectDate, selectedDate, calendarRef }) => {
            const [currentMonth, setCurrentMonth] = useState(new Date(selectedDate || new Date()));
            const dateInputRef = useRef(null);
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const todayStr = today.toISOString().split('T')[0];
            
            const daysInMonth = (year, month) => new Date(year, month + 1, 0).getDate();
            const startDayOfMonth = (year, month) => {
                let day = new Date(year, month, 1).getDay();
                return day === 0 ? 6 : day - 1; 
            };

            const year = currentMonth.getFullYear();
            const month = currentMonth.getMonth();
            const days = daysInMonth(year, month);
            const startDay = startDayOfMonth(year, month);
            const monthName = currentMonth.toLocaleString('ru', { month: 'long' });

            const hasDebtInHistory = useMemo(() => {
                const firstDayOfCurrentView = new Date(year, month, 1);
                return events.some(ev => {
                    const evDate = new Date(ev.date);
                    return evDate < firstDayOfCurrentView && ev.date < todayStr && !isEventFullyPaid(ev);
                });
            }, [events, year, month, todayStr]);

            const prevMonth = (e) => { e.stopPropagation(); setCurrentMonth(new Date(year, month - 1, 1)); };
            const nextMonth = (e) => { e.stopPropagation(); setCurrentMonth(new Date(year, month + 1, 1)); };

            const handleJumpDate = (e) => {
                const dateVal = e.target.value;
                if (!dateVal) return;
                const d = new Date(dateVal);
                setCurrentMonth(new Date(d.getFullYear(), d.getMonth(), 1));
                onSelectDate(dateVal);
            };

            const triggerJump = (e) => {
                e.stopPropagation();
                if (dateInputRef.current) {
                    try {
                        if (dateInputRef.current.showPicker) {
                            dateInputRef.current.showPicker();
                        } else {
                            dateInputRef.current.focus();
                            dateInputRef.current.click();
                        }
                    } catch (err) {
                        dateInputRef.current.click();
                    }
                }
            };

            const calendarDays = [];
            for (let i = 0; i < startDay; i++) calendarDays.push(null);
            for (let i = 1; i <= days; i++) calendarDays.push(i);

            const isSelected = (day) => {
                if (!day || !selectedDate) return false;
                const d = new Date(selectedDate);
                return d.getDate() === day && d.getMonth() === month && d.getFullYear() === year;
            };

            const isToday = (day) => {
                if (!day) return false;
                return day === today.getDate() && month === today.getMonth() && year === today.getFullYear();
            };

            const isPast = (day) => {
                if (!day) return false;
                const d = new Date(year, month, day);
                return d < today;
            };

            const getDayEvents = (day) => {
                if (!day) return [];
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                return events.filter(e => e.date === dateStr);
            };

            const hasEvent = (day) => getDayEvents(day).length > 0;

            const hasUnpaidDebt = (day) => {
                if (!day || !isPast(day)) return false;
                const daysEvents = getDayEvents(day);
                if (daysEvents.length === 0) return false;
                return daysEvents.some(ev => !isEventFullyPaid(ev));
            };

            const getDayStatusClasses = (day) => {
                if (!day || isPast(day)) return "";
                const daysEvents = getDayEvents(day);
                if (daysEvents.length === 0) return "";
                
                const hasIncomplete = daysEvents.some(ev => !checkEventCompleteness(ev));
                const hasComplete = daysEvents.some(ev => checkEventCompleteness(ev));

                if (hasIncomplete && hasComplete) return "status-both";
                if (hasIncomplete) return "status-error";
                if (hasComplete) return "status-complete";
                return "";
            };

            return (
                <div ref={calendarRef} className="bg-white p-5 rounded-3xl border-2 border-[#604539] border-l-8 shadow-xl animate-in mb-6">
                    <div className="flex items-center justify-between mb-6">
                        <button 
                            onClick={prevMonth} 
                            className={`calendar-nav-btn w-10 h-10 flex items-center justify-center rounded-xl border-2 transition-all duration-300 font-black text-xl ${hasDebtInHistory ? 'bg-[#fee2e2] border-red-200 text-red-600 animate-pulse' : 'bg-white border-[#60453910] text-[#604539] hover:text-[#C7886B]'}`}
                        >
                            «
                        </button>
                        <div className="text-center">
                            <h3 className="font-black uppercase tracking-[0.2em] text-[#604539] text-sm leading-none">{monthName}</h3>
                            <span className="text-[10px] font-bold opacity-30 tracking-widest">{year}</span>
                        </div>
                        <button 
                            onClick={nextMonth} 
                            className="calendar-nav-btn w-10 h-10 flex items-center justify-center rounded-xl border-2 border-[#60453910] text-[#604539] hover:text-[#C7886B] transition-all duration-300 font-black text-xl"
                        >
                            »
                        </button>
                    </div>
                    <div className="calendar-grid mb-1">
                        {['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].map(d => (
                            <div key={d} className="weekday-header">{d}</div>
                        ))}
                        {calendarDays.map((day, idx) => {
                            const past = isPast(day);
                            const current = isToday(day);
                            const selected = isSelected(day);
                            const hasEv = hasEvent(day);
                            const unpaid = hasUnpaidDebt(day);
                            const statusClasses = getDayStatusClasses(day);

                            return (
                                <div 
                                    key={idx} 
                                    onClick={(e) => {
                                        if (day) {
                                            e.stopPropagation();
                                            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                                            onSelectDate(dateStr);
                                        }
                                    }}
                                    className={`
                                        calendar-day ${!day ? 'invisible' : ''} 
                                        ${unpaid && !selected && !current ? 'has-unpaid-debt' : ''}
                                        ${selected ? 'bg-[#C7886B] text-white font-black scale-110 z-10 selected' : ''}
                                        ${current && !selected ? 'is-today shadow-lg scale-105' : ''}
                                        ${!selected && !current && !unpaid && past ? 'past-date' : ''}
                                        ${!selected && !current && !unpaid && !past ? 'hover:bg-[#FFECD2]' : ''}
                                        ${hasEv ? 'has-event' : ''}
                                        ${statusClasses}
                                    `}
                                >
                                    {day}
                                </div>
                            );
                        })}
                    </div>
                    <div className="mt-4 pt-4 border-t border-[#60453910]">
                        <input 
                            ref={dateInputRef}
                            type="date" 
                            className="hidden-date-input" 
                            onChange={handleJumpDate}
                        />
                        <button 
                            onClick={triggerJump}
                            className="w-full py-2.5 px-4 bg-[#60453908] hover:bg-[#60453915] text-[#604539] rounded-xl flex items-center justify-center gap-2 transition-all border border-[#60453910]"
                        >
                            <Icons.Calendar size={14} />
                            <span className="text-[10px] font-bold uppercase tracking-widest">Перейти к дате</span>
                        </button>
                    </div>
                </div>
            );
        };

        const StaffList = ({ staffDatabase, events, onClose }) => {
            const getStaffPaymentStatus = (name) => {
                const todayStr = new Date().toISOString().split('T')[0];
                
                return events
                    .filter(ev => 
                        ev.staff && 
                        ev.staff.some(s => s.name.toLowerCase() === name.toLowerCase())
                    )
                    .map(ev => {
                        const staffEntry = ev.staff.find(s => s.name.toLowerCase() === name.toLowerCase());
                        const isPast = ev.date < todayStr;
                        
                        const hasUnpaidRole = staffEntry.roles.some(role => 
                            !staffEntry.rolePaid || staffEntry.rolePaid[role] !== true
                        );

                        return {
                            date: ev.date,
                            display: ev.date.split('-').slice(1).reverse().join('.'), 
                            isUnpaid: hasUnpaidRole,
                            isPast: isPast
                        };
                    })
                    .filter(status => !status.isPast || status.isUnpaid)
                    .sort((a, b) => a.date.localeCompare(b.date));
            };

            return (
                <div className="bg-white p-5 rounded-3xl border-2 border-[#604539] border-l-8 shadow-xl animate-in mb-6">
                    <div className="flex items-center justify-between mb-6">
                        <div className="flex items-center gap-2">
                            <Icons.Users size={18} className="text-[#604539]" />
                            <h3 className="font-black uppercase tracking-[0.2em] text-[#604539] text-sm leading-none">Смены сотрудников</h3>
                        </div>
                        <button onClick={onClose} className="p-1.5 text-gray-300 hover:text-red-500 transition-colors"><Icons.X size={20} /></button>
                    </div>
                    <div className="space-y-4 h-auto pr-2">
                        {staffDatabase.sort((a,b) => a.name.localeCompare(b.name)).map((s, idx) => {
                            const eventStatuses = getStaffPaymentStatus(s.name);
                            const hasAnyDebt = eventStatuses.some(status => status.isPast && status.isUnpaid);

                            return (
                                <div key={idx} className={`p-3 rounded-xl border transition-all ${hasAnyDebt ? 'bg-red-50 border-red-200' : 'bg-gray-50 border-[#60453910] hover:border-[#C7886B50]'}`}>
                                    <div className="flex justify-between items-start">
                                        <div className="flex items-center gap-2 min-w-0">
                                            {s.phone && (
                                                <a href={`tel:${s.phone}`} className="shrink-0 p-1.5 bg-[#C7886B20] text-[#C7886B] rounded-lg hover:bg-[#C7886B] hover:text-white transition-all" title={s.phone}>
                                                    <Icons.Phone size={14} />
                                                </a>
                                            )}
                                            <p className={`font-bold text-sm uppercase truncate ${hasAnyDebt ? 'text-red-700' : 'text-[#604539]'}`} onClick={() => window.setActiveStaffScheduleFromList && window.setActiveStaffScheduleFromList(s.name)} style={{cursor:'pointer'}}>
                                                {s.name}
                                            </p>
                                        </div>
                                        {hasAnyDebt && <span className="text-[10px] font-black bg-red-500 text-white px-2 py-0.5 rounded-full animate-pulse shrink-0 ml-2">ЖДЁТ ОПЛАТУ</span>}
                                    </div>
                                    {eventStatuses.length > 0 ? (
                                        <div className="mt-2 pt-2 border-t border-dashed border-[#60453910]">
                                            <p className="text-[10px] font-black uppercase text-gray-400 mb-1">Актуальные смены:</p>
                                            <div className="flex flex-wrap gap-1">
                                                {eventStatuses.map((status, sIdx) => (
                                                    <span 
                                                        key={sIdx} 
                                                        className={`text-[12px] font-bold px-1.5 py-0.5 rounded ${status.isPast && status.isUnpaid ? 'bg-red-500 text-white' : 'text-gray-500 bg-gray-200/50'}`}
                                                    >
                                                        {status.display}
                                                    </span>
                                                ))}
                                            </div>
                                        </div>
                                    ) : (
                                        <p className="text-[8px] font-black uppercase text-gray-300 mt-2">Нет записей</p>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const AutoHeightTextarea = ({ value, onChange, placeholder, className }) => {
            const textareaRef = useRef(null);

            const adjustHeight = () => {
                const textarea = textareaRef.current;
                if (textarea) {
                    textarea.style.height = 'auto';
                    textarea.style.height = `${textarea.scrollHeight}px`;
                }
            };

            useEffect(() => {
                adjustHeight();
            }, [value]);

            return (
                <textarea
                    ref={textareaRef}
                    value={value}
                    onChange={(e) => {
                        onChange(e);
                        adjustHeight();
                    }}
                    placeholder={placeholder}
                    className={`${className} auto-textarea`}
                />
            );
        };

        const StaffScheduleModal = ({ staffName, events, onClose, onSelectEvent, todayStr }) => {
            const staffFutureEvents = useMemo(() => {
                return events
                    .filter(ev => ev.date >= todayStr && ev.staff && ev.staff.some(s => s.name.toLowerCase() === staffName.toLowerCase()))
                    .sort((a, b) => a.date.localeCompare(b.date));
            }, [staffName, events, todayStr]);

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-[#1F1713]/80 backdrop-blur-sm">
                    <div className="bg-white w-full max-w-sm rounded-3xl shadow-2xl overflow-hidden border-2 border-[#604539]">
                        <div className="p-4 border-b border-[#60453910] flex items-center justify-between">
                            <div>
                                <h3 className="text-sm font-black uppercase text-[#604539] leading-tight">График работы</h3>
                                <p className="text-[10px] font-bold text-[#C7886B] uppercase tracking-widest mt-0.5">{staffName}</p>
                            </div>
                            <button onClick={onClose} className="p-1.5 bg-gray-50 rounded-lg text-gray-300 hover:text-red-500 transition-colors">
                                <Icons.X size={18} />
                            </button>
                        </div>
                        <div className="p-4 max-h-[50vh] overflow-y-auto custom-scrollbar">
                            {staffFutureEvents.length > 0 ? (
                                <div className="space-y-3">
                                    {staffFutureEvents.map(ev => {
                                        const staffEntry = ev.staff.find(s => s.name.toLowerCase() === staffName.toLowerCase());
                                        return (
                                            <div 
                                                key={ev.id} 
                                                onClick={() => onSelectEvent(ev.id)}
                                                className="flex gap-3 p-3 bg-gray-50 rounded-xl border-2 border-transparent hover:border-[#FFECD2] transition-all cursor-pointer group active:scale-[0.98]"
                                            >
                                                <div className="w-10 shrink-0 flex flex-col items-center justify-center border-r-2 border-[#60453910] pr-3 group-hover:border-[#FFECD2]">
                                                    <span className="text-[8px] font-black uppercase text-gray-400">{new Date(ev.date).toLocaleString('ru', { month: 'short' })}</span>
                                                    <span className="text-lg font-black text-[#604539] leading-none">{new Date(ev.date).getDate()}</span>
                                                </div>
                                                <div className="flex-1 min-w-0 flex flex-col justify-center">
                                                    <p className="text-[15px] font-bold uppercase truncate text-[#1F1713] group-hover:text-[#C7886B]">{ev.name}</p>
                                                    <div className="flex items-center gap-2 mt-1.5">
                                                        <div className="flex items-center gap-1.5 text-[13.5px] font-bold text-[#C7886B]">
                                                            <Icons.Clock size={14} />
                                                            <span>{staffEntry.time || '—'}{staffEntry.end ? ` — ${staffEntry.end}` : ''}</span>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            ) : (
                                <div className="py-8 text-center">
                                    <div className="w-12 h-12 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-3 border-2 border-dashed border-gray-100">
                                        <Icons.Calendar size={18} className="text-gray-200" />
                                    </div>
                                    <p className="text-[9px] font-black uppercase tracking-widest text-gray-300">Мероприятий нет</p>
                                </div>
                            )}
                        </div>
                        <div className="p-3 bg-gray-50 border-t border-[#60453910]">
                            <button onClick={onClose} className="w-full py-2.5 bg-[#604539] text-white rounded-xl text-[9px] font-black uppercase tracking-widest">Закрыть</button>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('list'); 
            const [isLocalStorageVersion, setIsLocalStorageVersion] = useState(true);

            const [events, setEvents] = useState(() => {
                try {
                    const cached = localStorage.getItem('vn_events');
                    return cached ? JSON.parse(cached) : [];
                } catch { return []; }
            });
            const [staffDatabase, setStaffDatabase] = useState(() => {
                try {
                    const cached = localStorage.getItem('vn_staff');
                    return cached ? JSON.parse(cached) : [];
                } catch { return []; }
            });
            const [commonFiles, setCommonFiles] = useState(() => {
                try {
                    const cached = localStorage.getItem('vn_common_files');
                    return cached ? JSON.parse(cached) : [];
                } catch { return []; }
            });

            const [token, setToken] = useState(localStorage.getItem('gh_token') || '');
            const [isTokenVerified, setIsTokenVerified] = useState(false);
            const [syncStatus, setSyncStatus] = useState('idle'); 
            const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);
            const [selectedEventId, setSelectedEventId] = useState(null);
            
            const [isFormOpen, setIsFormOpen] = useState(false);
            const [isCalendarOpen, setIsCalendarOpen] = useState(false);
            const [isStaffListOpen, setIsStaffListOpen] = useState(false);
            const [isStaffFormOpen, setIsStaffFormOpen] = useState(false);
            const [editingStaffId, setEditingStaffId] = useState(null);
            
            const [activeStaffScheduleName, setActiveStaffScheduleName] = useState(null);

            const [formData, setFormData] = useState({ name: '', place: '', start: '', end: '', comment: '', neededStaff: { оф: '0', бар: '0', мой: '0', пов: '0' } });
            const [newStaff, setNewStaff] = useState({ name: '', phone: '', time: '', end: '', roles: [] });
            const [editingEventId, setEditingEventId] = useState(null);
            
            const [nameSuggestions, setNameSuggestions] = useState([]);
            const [phoneSuggestions, setPhoneSuggestions] = useState([]);
            const [isUploading, setIsUploading] = useState(false);

            const calendarRef = useRef(null);
            const fileInputRef = useRef(null);
            const commonFileInputRef = useRef(null);

            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const todayStr = today.toISOString().split('T')[0];

            useEffect(() => {
                window.setActiveStaffScheduleFromList = (name) => {
                    setActiveStaffScheduleName(name);
                };
                return () => {
                    window.setActiveStaffScheduleFromList = null;
                };
            }, []);

            const fetchFromGithub = useCallback(async (tokenToUse) => {
                if (!tokenToUse) {
                    setIsTokenVerified(false);
                    return;
                }
                setSyncStatus('loading');
                try {
                    const headers = { 'Authorization': `token ${tokenToUse}` };
                    
                    const response = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}?nocache=${Date.now()}`, { headers });
                    const staffRes = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.staffPath}?nocache=${Date.now()}`, { headers }).catch(() => null);
                    const commonFilesRes = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.commonFilesPath}?nocache=${Date.now()}`, { headers }).catch(() => null);

                    if (response.ok) {
                        const data = await response.json();
                        const content = JSON.parse(decodeURIComponent(escape(atob(data.content))));
                        setEvents(content);
                        localStorage.setItem('vn_events', JSON.stringify(content));

                        if (staffRes && staffRes.ok) {
                            const sData = await staffRes.json();
                            const sContent = JSON.parse(decodeURIComponent(escape(atob(sData.content))));
                            setStaffDatabase(sContent);
                            localStorage.setItem('vn_staff', JSON.stringify(sContent));
                        }
                        
                        if (commonFilesRes && commonFilesRes.ok) {
                            const cfData = await commonFilesRes.json();
                            const cfContent = JSON.parse(decodeURIComponent(escape(atob(cfData.content))));
                            setCommonFiles(cfContent);
                            localStorage.setItem('vn_common_files', JSON.stringify(cfContent));
                        }

                        setIsTokenVerified(true);
                        setIsLocalStorageVersion(false);
                        setSyncStatus('success');
                        setTimeout(() => setSyncStatus('idle'), 3000);
                    } else {
                        setIsLocalStorageVersion(true);
                        setSyncStatus('error');
                    }
                } catch (err) {
                    setIsLocalStorageVersion(true);
                    setSyncStatus('error');
                }
            }, []);

            useEffect(() => {
                if (token) {
                    fetchFromGithub(token);
                }
            }, [token, fetchFromGithub]);

            const saveToGithub = async (updatedEvents, updatedStaff = null, updatedCommonFiles = null) => {
                if (isLocalStorageVersion) return;
                setSyncStatus('loading');
                try {
                    const headers = { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' };
                    
                    if (updatedEvents) {
                        const res = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}`, { headers });
                        const d = await res.json();
                        await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}`, {
                            method: 'PUT',
                            headers,
                            body: JSON.stringify({
                                message: 'Update events data',
                                content: btoa(unescape(encodeURIComponent(JSON.stringify(updatedEvents, null, 2)))),
                                sha: d.sha
                            })
                        });
                        localStorage.setItem('vn_events', JSON.stringify(updatedEvents));
                    }

                    if (updatedStaff) {
                        const resStaff = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.staffPath}`, { headers });
                        const dStaff = await resStaff.json();
                        await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.staffPath}`, {
                            method: 'PUT',
                            headers,
                            body: JSON.stringify({
                                message: 'Update staff database',
                                content: btoa(unescape(encodeURIComponent(JSON.stringify(updatedStaff, null, 2)))),
                                sha: dStaff.sha
                            })
                        });
                        localStorage.setItem('vn_staff', JSON.stringify(updatedStaff));
                    }

                    if (updatedCommonFiles) {
                        const resCF = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.commonFilesPath}`, { headers });
                        const dCF = await resCF.json();
                        await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.commonFilesPath}`, {
                            method: 'PUT',
                            headers,
                            body: JSON.stringify({
                                message: 'Update common files database',
                                content: btoa(unescape(encodeURIComponent(JSON.stringify(updatedCommonFiles, null, 2)))),
                                sha: dCF.sha
                            })
                        });
                        localStorage.setItem('vn_common_files', JSON.stringify(updatedCommonFiles));
                    }

                    setSyncStatus('success');
                    setTimeout(() => setSyncStatus('idle'), 3000);
                } catch (err) {
                    setSyncStatus('error');
                }
            };

            const handleFileUpload = async (e, type) => {
                if (isLocalStorageVersion) return;
                const file = e.target.files[0];
                if (!file) return;

                setIsUploading(true);
                setSyncStatus('loading');

                try {
                    const reader = new FileReader();
                    reader.onloadend = async () => {
                        const base64Content = reader.result.split(',')[1];
                        const fileName = `${Date.now()}_${file.name}`;
                        const filePath = `files/${fileName}`;

                        const uploadRes = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${filePath}`, {
                            method: 'PUT',
                            headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                message: `Upload file ${file.name}`,
                                content: base64Content
                            })
                        });

                        if (uploadRes.ok) {
                            const fileObj = { name: file.name, path: filePath, size: file.size };
                            
                            if (type === 'event') {
                                const updated = events.map(ev => {
                                    if (ev.id === selectedEventId) {
                                        const existingFiles = ev.files || [];
                                        return { ...ev, files: [...existingFiles, fileObj] };
                                    }
                                    return ev;
                                });
                                setEvents(updated);
                                await saveToGithub(updated, null, null);
                            } else if (type === 'common') {
                                const updatedCF = [...commonFiles, fileObj];
                                setCommonFiles(updatedCF);
                                await saveToGithub(null, null, updatedCF);
                            }
                            
                            setSyncStatus('success');
                        } else {
                            setSyncStatus('error');
                        }
                        setIsUploading(false);
                        setTimeout(() => setSyncStatus('idle'), 3000);
                    };
                    reader.readAsDataURL(file);
                } catch (err) {
                    setIsUploading(false);
                    setSyncStatus('error');
                }
            };

            const handleFileDelete = async (fileObj, type) => {
                if (isLocalStorageVersion) return;
                if (!confirm(`Удалить файл "${fileObj.name}"?`)) return;

                setSyncStatus('loading');
                try {
                    const fileCheck = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${fileObj.path}`, {
                        headers: { 'Authorization': `token ${token}` }
                    });
                    
                    if (fileCheck.ok) {
                        const fileData = await fileCheck.json();
                        await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${fileObj.path}`, {
                            method: 'DELETE',
                            headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                message: `Delete file ${fileObj.name}`,
                                sha: fileData.sha
                            })
                        });
                    }

                    if (type === 'event') {
                        const updated = events.map(ev => {
                            if (ev.id === selectedEventId) {
                                return { ...ev, files: (ev.files || []).filter(f => f.path !== fileObj.path) };
                            }
                            return ev;
                        });
                        setEvents(updated);
                        await saveToGithub(updated, null, null);
                    } else if (type === 'common') {
                        const updatedCF = commonFiles.filter(f => f.path !== fileObj.path);
                        setCommonFiles(updatedCF);
                        await saveToGithub(null, null, updatedCF);
                    }

                    setSyncStatus('success');
                    setTimeout(() => setSyncStatus('idle'), 3000);
                } catch (err) {
                    setSyncStatus('error');
                }
            };

            const handleFileDownload = async (fileObj) => {
                try {
                    const res = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${fileObj.path}`, {
                        headers: { 'Authorization': `token ${token}` }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        const link = document.createElement('a');
                        link.href = `data:application/octet-stream;base64,${data.content.replace(/\s/g, '')}`;
                        link.download = fileObj.name;
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                    } else {
                        alert('Не удалось скачать файл');
                    }
                } catch (err) {
                    alert('Ошибка при скачивании файла');
                }
            };

            const handleSaveEvent = (e) => {
                if (isLocalStorageVersion) return;
                e.preventDefault();
                let updated;
                if (editingEventId) {
                    updated = events.map(ev => ev.id === editingEventId ? { ...ev, ...formData } : ev);
                    setEditingEventId(null);
                } else {
                    const newEvent = { id: Date.now(), date: selectedDate, ...formData, staff: [], files: [], status: { checked: false } };
                    updated = [...events, newEvent];
                }
                setEvents(updated);
                saveToGithub(updated, null, null);
                setIsFormOpen(false);
                setFormData({ name: '', place: '', start: '', end: '', comment: '', neededStaff: { оф: '0', бар: '0', мой: '0', пов: '0' } });
            };

            const startEditEvent = (e, ev) => {
                if (isLocalStorageVersion) return;
                if (e) e.stopPropagation();
                setFormData({
                    name: ev.name,
                    place: ev.place,
                    start: ev.start || '',
                    end: ev.end || '',
                    comment: ev.comment || '',
                    neededStaff: ev.neededStaff || { оф: '0', бар: '0', мой: '0', пов: '0' }
                });
                setEditingEventId(ev.id);
                setIsFormOpen(true);
                setIsCalendarOpen(false);
            };

            const fastDeleteEvent = (e, id) => {
                if (isLocalStorageVersion) return;
                e.stopPropagation();
                if (confirm('Удалить мероприятие?')) {
                    const updated = events.filter(ev => ev.id !== id);
                    setEvents(updated);
                    saveToGithub(updated, null, null);
                    if (selectedEventId === id) setSelectedEventId(null);
                }
            };

            const toggleEventChecked = (e, id) => {
                if (isLocalStorageVersion) return;
                e.stopPropagation();
                const updated = events.map(ev => {
                    if (ev.id === id) {
                        const curChecked = ev.status?.checked || false;
                        return { ...ev, status: { ...ev.status, checked: !curChecked } };
                    }
                    return ev;
                });
                setEvents(updated);
                saveToGithub(updated, null, null);
            };

            const handleStaffNameChange = (val) => {
                setNewStaff({ ...newStaff, name: val });
                if (val.trim().length > 0) {
                    const filtered = staffDatabase
                        .filter(s => s.name.toLowerCase().includes(val.toLowerCase()))
                        .map(s => s.name);
                    setNameSuggestions(filtered);
                } else {
                    setNameSuggestions([]);
                }
            };

            const handleStaffPhoneChange = (val) => {
                const formatted = formatPhoneNumber(val);
                setNewStaff({ ...newStaff, phone: formatted });
                const rawDigits = formatOnlyNumbers(formatted);
                
                if (rawDigits.length > 1) {
                    const filtered = staffDatabase
                        .filter(s => formatOnlyNumbers(s.phone || '').includes(rawDigits))
                        .map(s => s.phone);
                    setPhoneSuggestions(filtered);
                } else {
                    setPhoneSuggestions([]);
                }
            };

            const selectNameSuggestion = (name) => {
                const existing = staffDatabase.find(s => s.name.toLowerCase() === name.toLowerCase());
                if (existing) {
                    setNewStaff({ ...newStaff, name: existing.name, phone: existing.phone || '' });
                } else {
                    setNewStaff({ ...newStaff, name });
                }
                setNameSuggestions([]);
            };

            const selectPhoneSuggestion = (phone) => {
                const existing = staffDatabase.find(s => (s.phone || '') === phone);
                if (existing) {
                    setNewStaff({ ...newStaff, name: existing.name, phone: existing.phone });
                } else {
                    setNewStaff({ ...newStaff, phone });
                }
                setPhoneSuggestions([]);
            };

            const handleSaveStaff = (e) => {
                if (isLocalStorageVersion) return;
                e.preventDefault();
                if (!newStaff.name.trim() || newStaff.roles.length === 0) return;

                let updatedStaffDb = [...staffDatabase];
                const staffIndex = updatedStaffDb.findIndex(s => s.name.toLowerCase() === newStaff.name.trim().toLowerCase());
                if (staffIndex > -1) {
                    updatedStaffDb[staffIndex].phone = newStaff.phone;
                } else {
                    updatedStaffDb.push({ id: Date.now(), name: newStaff.name.trim(), phone: newStaff.phone });
                }

                const updatedEvents = events.map(ev => {
                    if (ev.id === selectedEventId) {
                        let updatedStaffList = ev.staff ? [...ev.staff] : [];
                        if (editingStaffId) {
                            updatedStaffList = updatedStaffList.map(s => s.id === editingStaffId ? { ...s, ...newStaff, name: newStaff.name.trim() } : s);
                            setEditingStaffId(null);
                        } else {
                            updatedStaffList.push({ id: Date.now(), ...newStaff, name: newStaff.name.trim(), rolePaid: {} });
                        }
                        return { ...ev, staff: updatedStaffList };
                    }
                    return ev;
                });

                setEvents(updatedEvents);
                setStaffDatabase(updatedStaffDb);
                saveToGithub(updatedEvents, updatedStaffDb, null);

                setIsStaffFormOpen(false);
                setNewStaff({ name: '', phone: '', time: '', end: '', roles: [] });
            };

            const toggleStaffRolePaid = (staffId, role) => {
                if (isLocalStorageVersion) return;
                const updated = events.map(ev => {
                    if (ev.id === selectedEventId) {
                        const updatedStaff = ev.staff.map(s => {
                            if (s.id === staffId) {
                                const currentRolesPaid = s.rolePaid || {};
                                return {
                                    ...s,
                                    rolePaid: {
                                        ...currentRolesPaid,
                                        [role]: !currentRolesPaid[role]
                                    }
                                };
                            }
                            return s;
                        });
                        return { ...ev, staff: updatedStaff };
                    }
                    return ev;
                });
                setEvents(updated);
                saveToGithub(updated, null, null);
            };

            const currentEvent = events.find(ev => ev.id === selectedEventId);
            const filteredEvents = events.filter(ev => ev.date === selectedDate);

            const viewConfig = {
                list: { bg: '#FFECD2', accent: '#604539', text: '#1F1713' }
            };
            const colors = viewConfig.list;

            const roleIconMap = {
                'Официант': { icon: <Icons.Cloche size={12} />, color: 'bg-amber-50 text-amber-700 border-amber-100' },
                'Бармен': { icon: <Icons.Martini size={12} />, color: 'bg-purple-50 text-purple-700 border-purple-100' },
                'Мойщица': { icon: <Icons.Droplet size={12} />, color: 'bg-blue-50 text-blue-700 border-blue-100' },
                'Повар': { icon: <Icons.Pot size={12} />, color: 'bg-emerald-50 text-emerald-700 border-emerald-100' }
            };

            return (
                <div className="min-h-screen pb-12 transition-colors duration-500" style={{ backgroundColor: colors.bg, color: colors.text }}>
                    
                    {activeStaffScheduleName && (
                        <StaffScheduleModal 
                            staffName={activeStaffScheduleName}
                            events={events}
                            todayStr={todayStr}
                            onClose={() => setActiveStaffScheduleName(null)}
                            onSelectEvent={(eventId) => {
                                setSelectedEventId(eventId);
                                setActiveStaffScheduleName(null);
                                setIsStaffListOpen(false);
                                setIsCalendarOpen(false);
                            }}
                        />
                    )}

                    <div className="max-w-md mx-auto px-4 pt-4">
                        <div className="flex items-center justify-between mb-4 bg-white/60 backdrop-blur-md p-3 rounded-2xl border border-white/40 shadow-sm">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-[#604539] rounded-xl flex items-center justify-center text-white font-black text-xs shadow-md tracking-tighter">VN</div>
                                <div>
                                    <h1 className="font-black text-sm uppercase tracking-widest leading-none">CATERING</h1>
                                    <span className="text-[10px] font-bold opacity-40 uppercase tracking-wider">Управление сменами</span>
                                </div>
                            </div>
                            <div className={`sync-status ${syncStatus === 'loading' ? 'sync-loading' : syncStatus === 'success' ? 'sync-success' : syncStatus === 'error' ? 'sync-error' : isLocalStorageVersion ? 'sync-error' : 'sync-idle'}`}>
                                {syncStatus === 'loading' && <Icons.Refresh size={10} className="spin-slow" />}
                                <span>{syncStatus === 'loading' ? 'ЗАГРУЗКА...' : syncStatus === 'success' ? 'ОБНОВЛЕНО' : isLocalStorageVersion ? 'АРХИВ (ОФФЛАЙН)' : 'ГОТОВО'}</span>
                            </div>
                        </div>

                        {!isTokenVerified && (
                            <div className="bg-white p-5 rounded-3xl border-2 border-red-200 shadow-xl mb-6 animate-in">
                                <h3 className="font-black text-xs uppercase tracking-wider text-red-700 mb-2">Требуется авторизация</h3>
                                <p className="text-xs text-gray-500 mb-4 leading-relaxed">Введите GitHub Personal Access Token для синхронизации структуры данных.</p>
                                <div className="flex gap-2">
                                    <input 
                                        type="password" 
                                        placeholder="ghp_..." 
                                        value={token}
                                        onChange={(e) => setToken(e.target.value)}
                                        className="flex-1 px-4 py-2.5 rounded-xl border-2 border-gray-200 text-sm focus:border-red-400 outline-none transition-all"
                                    />
                                    <button 
                                        onClick={() => { localStorage.setItem('gh_token', token); fetchFromGithub(token); }}
                                        className="px-5 bg-red-600 text-white rounded-xl text-xs font-black uppercase tracking-wider hover:bg-red-700 transition-all"
                                    >
                                        Вход
                                    </button>
                                </div>
                            </div>
                        )}

                        <div className="flex gap-2 mb-4">
                            <button 
                                onClick={() => { setIsCalendarOpen(!isCalendarOpen); setIsStaffListOpen(false); setView('list'); }}
                                className={`flex-1 py-3 rounded-2xl text-[10px] font-black uppercase tracking-widest border-2 transition-all flex items-center justify-center gap-2 ${isCalendarOpen ? 'bg-[#604539] text-white border-[#604539] shadow-md' : 'bg-white text-[#604539] border-[#60453915] hover:border-[#60453950]'}`}
                            >
                                <Icons.Calendar size={14} /> Календарь
                            </button>
                            <button 
                                onClick={() => { setIsStaffListOpen(!isStaffListOpen); setIsCalendarOpen(false); setView('list'); }}
                                className={`flex-1 py-3 rounded-2xl text-[10px] font-black uppercase tracking-widest border-2 transition-all flex items-center justify-center gap-2 ${isStaffListOpen ? 'bg-[#604539] text-white border-[#604539] shadow-md' : 'bg-white text-[#604539] border-[#60453915] hover:border-[#60453950]'}`}
                            >
                                <Icons.Users size={14} /> Сотрудники
                            </button>
                            <button 
                                onClick={() => { setView(view === 'commonFiles' ? 'list' : 'commonFiles'); setIsCalendarOpen(false); setIsStaffListOpen(false); }}
                                className={`py-3 px-4 rounded-2xl border-2 transition-all flex items-center justify-center ${view === 'commonFiles' ? 'bg-[#604539] text-white border-[#604539] shadow-md' : 'bg-white text-[#604539] border-[#60453915] hover:border-[#60453950]'}`}
                            >
                                <Icons.Archive size={14} />
                            </button>
                        </div>

                        {isCalendarOpen && (
                            <Calendar 
                                events={events} 
                                selectedDate={selectedDate} 
                                onSelectDate={(date) => { setSelectedDate(date); setIsCalendarOpen(false); setSelectedEventId(null); }}
                                calendarRef={calendarRef}
                            />
                        )}

                        {isStaffListOpen && (
                            <StaffList 
                                staffDatabase={staffDatabase} 
                                events={events} 
                                onClose={() => setIsStaffListOpen(false)} 
                            />
                        )}

                        {view === 'commonFiles' && (
                            <div className="bg-white p-5 rounded-3xl border-2 border-[#604539] shadow-xl animate-in mb-6">
                                <div className="flex items-center justify-between mb-4">
                                    <h3 className="font-black uppercase tracking-wider text-[#604539] text-xs">Общие файлы базы</h3>
                                    <div>
                                        <input ref={commonFileInputRef} type="file" className="hidden" onChange={(e) => handleFileUpload(e, 'common')} />
                                        <button 
                                            onClick={() => commonFileInputRef.current.click()} 
                                            disabled={isUploading || isLocalStorageVersion}
                                            className="px-4 py-2 bg-[#604539] text-white rounded-xl text-[10px] font-black uppercase tracking-widest flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed"
                                        >
                                            {isUploading ? <Icons.Refresh size={14} className="spin-slow" /> : <Icons.Plus size={14} />} Добавить
                                        </button>
                                    </div>
                                </div>
                                <div className="space-y-2 max-h-60 overflow-y-auto pr-1 custom-scrollbar">
                                    {commonFiles && commonFiles.length > 0 ? (
                                        commonFiles.map((file, idx) => (
                                            <div key={idx} className="flex items-center justify-between p-3 bg-gray-50 rounded-xl border border-gray-100">
                                                <div className="flex items-center gap-2 min-w-0 file-name-container">
                                                    <Icons.FileText size={16} className="text-[#604539] shrink-0" />
                                                    <span className="text-xs font-bold text-gray-700 truncate file-name-text">{file.name}</span>
                                                </div>
                                                <div className="flex items-center gap-1 shrink-0 ml-2">
                                                    <button onClick={() => handleFileDownload(file)} className="w-8 h-8 flex items-center justify-center bg-white rounded-lg border border-gray-200 text-gray-500 hover:text-[#604539]"><Icons.ExternalLink size={14} /></button>
                                                    <button 
                                                        onClick={() => handleFileDelete(file, 'common')} 
                                                        disabled={isLocalStorageVersion}
                                                        className="w-8 h-8 flex items-center justify-center bg-white rounded-lg border border-gray-200 text-gray-300 hover:text-red-500 disabled:opacity-30 disabled:cursor-not-allowed"
                                                    >
                                                        <Icons.Trash size={14} />
                                                    </button>
                                                </div>
                                            </div>
                                        ))
                                    ) : (
                                        <div className="py-6 text-center text-gray-300 border-2 border-dashed border-gray-100 rounded-2xl font-black text-[9px] uppercase">Файлов нет</div>
                                    )}
                                </div>
                            </div>
                        )}

                        {view === 'list' && !selectedEventId && (
                            <div className="space-y-4">
                                <div className="flex items-center justify-between bg-white/40 px-2 py-1 rounded-xl">
                                    <div className="flex items-center gap-2">
                                        <span className="text-xl font-black text-[#604539]">{selectedDate.split('-').reverse().join('.')}</span>
                                        <span className="text-[9px] font-black uppercase bg-[#604539]/10 text-[#604539] px-2 py-0.5 rounded-md">
                                            {filteredEvents.length} {filteredEvents.length === 1 ? 'событие' : filteredEvents.length >= 2 && filteredEvents.length <= 4 ? 'события' : 'событий'}
                                        </span>
                                    </div>
                                </div>

                                {!isFormOpen ? (
                                    <button 
                                        onClick={() => {
                                            if (isLocalStorageVersion) return;
                                            setIsFormOpen(true);
                                            setIsCalendarOpen(false);
                                            setEditingEventId(null);
                                            setFormData({ name: '', place: '', start: '', end: '', comment: '', neededStaff: { оф: '0', бар: '0', мой: '0', пов: '0' } });
                                        }} 
                                        disabled={isLocalStorageVersion}
                                        className="w-full py-3.5 bg-[#604539] text-white rounded-2xl text-[11px] font-black uppercase tracking-widest hover:bg-[#C7886B] transition-all shadow-lg active:scale-[0.99] disabled:opacity-40 disabled:cursor-not-allowed"
                                    >
                                        {isLocalStorageVersion ? 'Добавление недоступно (Оффлайн)' : 'Добавить мероприятие'}
                                    </button>
                                ) : (
                                    <form onSubmit={handleSaveEvent} className="bg-white p-5 rounded-3xl border-2 border-[#604539] shadow-xl space-y-4 animate-in">
                                        <div className="flex items-center justify-between border-b pb-2">
                                            <h3 className="font-black uppercase text-xs tracking-wider text-[#604539]">{editingEventId ? 'Редактировать' : 'Новое мероприятие'}</h3>
                                            <button type="button" onClick={() => setIsFormOpen(false)} className="text-gray-400 hover:text-red-500"><Icons.X size={18} /></button>
                                        </div>
                                        <div>
                                            <label className="text-[9px] uppercase font-black tracking-wider opacity-40 block mb-1 ml-1">Название</label>
                                            <input type="text" required placeholder="Например: Банкет Сбербанк" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full px-4 py-2.5 rounded-xl border-2 border-gray-100 text-sm focus:border-[#C7886B] outline-none transition-all" />
                                        </div>
                                        <div>
                                            <label className="text-[9px] uppercase font-black tracking-wider opacity-40 block mb-1 ml-1">Место проведения</label>
                                            <input type="text" required placeholder="Например: Ресторан Ванильное Небо" value={formData.place} onChange={e => setFormData({...formData, place: e.target.value})} className="w-full px-4 py-2.5 rounded-xl border-2 border-gray-100 text-sm focus:border-[#C7886B] outline-none transition-all" />
                                        </div>
                                        <div className="flex gap-3">
                                            <SimpleTimePicker label="Время начала" value={formData.start} onChange={(time) => setFormData({...formData, start: time})} colors={colors} />
                                            <SimpleTimePicker label="Время окончания" value={formData.end} onChange={(time) => setFormData({...formData, end: time})} colors={colors} />
                                        </div>
                                        <div>
                                            <label className="text-[9px] uppercase font-black tracking-wider opacity-40 block mb-2 ml-1">Необходимый штат (чел.)</label>
                                            <div className="grid grid-cols-4 gap-2">
                                                {['оф', 'бар', 'мой', 'пов'].map(roleKey => (
                                                    <div key={roleKey} className="bg-gray-50 border border-gray-100 p-2 rounded-xl text-center">
